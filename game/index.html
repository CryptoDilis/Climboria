<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climboria | Expeditions</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0F141F;--gold:#D4AF37;--border:#1F2937;--gray:#6B7280}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font-family:Inter,system-ui,sans-serif}
header{height:72px;padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);white-space:nowrap}
.brand{font:900 20px Cinzel,serif;letter-spacing:2px;color:var(--gold);text-decoration:none}.back{color:#d1d5db;border:1px solid var(--border);border-radius:24px;padding:10px 14px;text-decoration:none;font-size:12px}
main{max-width:1200px;margin:auto;padding:clamp(24px,4vw,48px) 16px 60px}.kicker{text-align:center;color:var(--gold);font-size:11px;letter-spacing:3px;font-weight:800}
h1{text-align:center;font:900 clamp(28px,4vw,48px)/1.1 Cinzel,serif;margin:14px 0}.intro{text-align:center;color:#aab3c2;font-size:14px;line-height:1.6;max-width:620px;margin:0 auto 30px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media(min-width:1025px){main{max-width:1320px;padding-inline:32px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{height:232px;padding:22px}h2{font-size:19px}.desc{font-size:14px}.status{font-size:10px}}
@media(min-width:1441px){main{max-width:1440px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.card{height:250px}}
.card{height:220px;min-width:0;position:relative;display:flex;flex-direction:column;text-align:left;padding:20px;border:1px solid var(--border);border-radius:20px;background:#151b27;color:#f8fafc;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.card.active{border-color:var(--gold);box-shadow:0 0 18px #D4AF3722}.card.active:hover{transform:translateY(-4px);box-shadow:0 0 28px #D4AF3750,0 12px 28px #0007}
.card.locked{background:rgba(15,20,31,.4);cursor:not-allowed}.card.locked:hover{transform:none;box-shadow:none}
.card.jarrell{grid-column:span 2;border:2px solid #8e303c;background:linear-gradient(145deg,#17151d,#1b1219 58%,#160f16);box-shadow:inset 0 0 40px #8b1e2b45,0 0 27px #a3263660,0 0 7px #c04a58dd}
.card.jarrell .expedition,.card.jarrell h2{color:#e6b0b2}
.card.jarrell .expedition{font-size:12px;letter-spacing:1.5px}
.card.jarrell h2{font-size:clamp(23px,3vw,30px);line-height:1.12;min-height:0;margin-top:18px;max-width:calc(100% - 52px)}
.card.jarrell .desc{font-size:16px;line-height:1.45;color:#c5a7ab;max-width:95%}
.card.jarrell .difficulty{font-size:12px;letter-spacing:1px}
.card.jarrell .status{font-size:11px;padding:9px 13px;border-width:1.5px}.card.jarrell .crest{filter:drop-shadow(0 0 7px #c32645cc) drop-shadow(0 2px 3px #0009)}.card.jarrell .status{border-color:#79313a;color:#d28a90;background:#2b111833}.card.jarrell .difficulty{color:#b98b91}
.card.jarrell::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse at 90% 8%,#8b1e2b20,transparent 52%)}
.card.jarrell.active{border-color:#b34350;box-shadow:0 0 34px #8b1e2b88,0 0 8px #d65b69cc,inset 0 0 38px #8b1e2b45}.card.jarrell.active:hover{box-shadow:0 0 24px #a3263655,0 12px 28px #0008,inset 0 0 26px #8b1e2b25}
.expedition{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--gold)}
.crest{position:absolute;right:16px;top:17px;width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 1px 2px #0008);transition:filter .2s,transform .2s;opacity:.78}
.card.active .crest{opacity:.95;filter:drop-shadow(0 0 4px #d4af3744)}
.locked:not(.jarrell) .crest{filter:grayscale(1) brightness(.78);opacity:.48}
.crest-jarrell{width:52px;height:52px;right:17px;top:13px;opacity:1;filter:drop-shadow(0 0 8px #c3264588)!important}.card.active .crest{filter:drop-shadow(0 0 5px #d4af3766) drop-shadow(0 2px 3px #0009)}.locked:not(.jarrell) .crest{filter:grayscale(1) brightness(.82) drop-shadow(0 2px 3px #0009);opacity:.72}.card:hover .crest{transform:translateY(-1px)}.crest-jarrell{width:52px;height:52px;right:17px;top:13px;filter:drop-shadow(0 0 8px #b3263c99)}.card.jarrell h2{margin-right:62px}.card.jarrell .crest{opacity:1}
h2{font:700 18px/1.18 Cinzel,serif;margin:20px 40px 8px 0;min-height:2.36em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.desc{font-size:14px;line-height:1.35;color:rgba(248,250,252,.6);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.difficulty{font-size:10px;letter-spacing:.8px;color:#9CA3AF;margin-top:8px;white-space:nowrap}
.status{align-self:flex-start;margin-top:auto;max-width:100%;border:1px solid var(--gold);border-radius:999px;padding:7px 11px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.8px;background:transparent;white-space:nowrap}
.locked .status{border-color:#4B5563;color:#9CA3AF}
@media(max-width:767px){.status{white-space:normal;line-height:1.15;text-align:center;letter-spacing:.35px;max-width:100%;min-width:0}.card:not(.jarrell) .status{font-size:clamp(8px,2.35vw,10px);padding:6px 7px}.card:not(.jarrell) .status{overflow-wrap:anywhere}.card.jarrell .status{white-space:normal;max-width:100%;line-height:1.2}}
@media(min-width:768px) and (max-width:1024px){main{padding-inline:24px}.grid{gap:20px}.card{height:220px}}
@media(max-width:767px){.card.jarrell{grid-column:span 2;height:220px;padding:20px}.card.jarrell .expedition{font-size:12px}.card.jarrell h2{font-size:25px;margin-top:16px}.card.jarrell .desc{font-size:16px}.card.jarrell .status{font-size:11px;padding:9px 13px}header{height:64px;padding:0 14px}.brand{font-size:16px;letter-spacing:1.5px}.back{font-size:10px;padding:9px 10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{height:180px;padding:16px;border-radius:18px}.crest{right:12px;top:14px;width:36px;height:36px}.crest-jarrell{width:46px;height:46px;right:13px;top:12px}.card.jarrell h2{margin-right:68px}h2{font-size:clamp(15px,3.8vw,18px);margin:18px 34px 7px 0}.expedition{font-size:9px;letter-spacing:.8px}.status{font-size:9px;padding:6px 8px}.difficulty{font-size:9px;letter-spacing:0}}
@media(min-width:1441px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card{height:264px}h2{font-size:21px}.desc{font-size:16px}.expedition{font-size:13px}.status{font-size:11px}}
</style></head><body>
<header><a class="brand" href="../">CLIMBORIA</a><a class="back" href="../">← BACK TO HOME</a></header>
<main><div class="kicker">CHOOSE YOUR ASCENT</div><h1>EXPEDITION SELECT</h1><p class="intro">Eleven mountain expeditions. Prepare your gear, master each ascent, and push toward the ultimate summit.</p>
<section class="grid" aria-label="Eleven expeditions"><button class="card locked jarrell" data-level="11" aria-disabled="true"><img class="crest crest-jarrell" src="../11_jarrells-peak-extreme-risk.png" alt="jarrells peak emblem" loading="lazy"><h2>JARRELL'S PEAK</h2><p class="desc">A terrifying, high-risk ascent. One mistake—and the mountain claims you.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★ ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button>
<button class="card active" data-level="01" ><img class="crest" src="../01_ellas-blackfang-peak.png" alt="ellas blackfang peak emblem" loading="lazy"><h2>ELLA'S BLACKFANG PEAK</h2><p class="desc">A jagged first ascent with unforgiving teeth.</p><span class="difficulty">DIFFICULTY&nbsp; ★☆☆☆☆</span><span class="status">BASE CAMP</span></button><button class="card locked" data-level="02" aria-disabled="true"><img class="crest" src="../02_nathalias-starbreaker-summit.png" alt="nathalias starbreaker summit emblem" loading="lazy"><h2>NATHALIA'S STARBREAKER SUMMIT</h2><p class="desc">Crack the sky on a blade of frozen stone.</p><span class="difficulty">DIFFICULTY&nbsp; ★★☆☆☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="03" aria-disabled="true"><img class="crest" src="../03_alas-ironclaw-ridge.png" alt="alas ironclaw ridge emblem" loading="lazy"><h2>ALAS' IRONCLAW RIDGE</h2><p class="desc">Steel-hard holds. One slip, a long fall.</p><span class="difficulty">DIFFICULTY&nbsp; ★★☆☆☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="04" aria-disabled="true"><img class="crest" src="../04_lheiz-shadowforge-spire.png" alt="lheiz shadowforge spire emblem" loading="lazy"><h2>LHEIZ'S SHADOWFORGE SPIRE</h2><p class="desc">A dark monolith forged above the clouds.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★☆☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="05" aria-disabled="true"><img class="crest" src="../05_zaldys-thundermaw-crag.png" alt="zaldys thundermaw crag emblem" loading="lazy"><h2>ZALDY'S THUNDERMAW CRAG</h2><p class="desc">Storms roar through its shattered cliffs.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="06" aria-disabled="true"><img class="crest" src="../06_tatas-titanwall.png" alt="tatas titanwall emblem" loading="lazy"><h2>TATA'S TITANWALL</h2><p class="desc">A colossal wall built to break climbers.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button>
<button class="card locked" data-level="07" aria-disabled="true"><img class="crest" src="../07_jeffs-stormbreaker.png" alt="jeffs stormbreaker emblem" loading="lazy"><h2>JEFF'S STORMBREAKER</h2><p class="desc">A savage ridge split by roaring storms.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="08" aria-disabled="true"><img class="crest" src="../08_gabs-doomspire.png" alt="gabs doomspire emblem" loading="lazy"><h2>GAB'S DOOMSPIRE</h2><p class="desc">A black spire where every hold feels cursed.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="09" aria-disabled="true"><img class="crest" src="../09_d30s-oblivion-crown.png" alt="d30s oblivion crown emblem" loading="lazy"><h2>D30'S OBLIVION CROWN</h2><p class="desc">A knife-edge crown above a bottomless void.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="10" aria-disabled="true"><img class="crest" src="../10_laizas-worldender.png" alt="laizas worldender emblem" loading="lazy"><h2>LAIZA'S WORLDENDER</h2><p class="desc">The final wall before the world falls away.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button></section></main>
<script>
const unlocked=n=>n==="01"||localStorage.getItem("climboria_completed_"+String(Number(n)-1).padStart(2,"0"))==="true";
document.querySelectorAll(".card").forEach(card=>{const n=card.dataset.level;const active=unlocked(n);card.classList.toggle("locked",!active);card.classList.toggle("active",n==="01"&&active);card.setAttribute("aria-disabled",String(!active));if(!active)card.querySelector(".status").textContent="🔒 COMPLETE PREVIOUS LEVEL";else if(localStorage.getItem("climboria_completed_"+n)==="true")card.querySelector(".status").textContent="✓ SUMMIT CLEARED";card.addEventListener("click",()=>{if(!unlocked(n))return;const name=card.querySelector("h2").textContent;location.href="./play.html?level="+encodeURIComponent(n)+"&name="+encodeURIComponent(name)})});
</script></body></html>
