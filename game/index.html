<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climboria | Expeditions</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0F141F;--gold:#D4AF37;--border:#1F2937;--gray:#6B7280}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font-family:Inter,system-ui,sans-serif}
header{height:72px;padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);white-space:nowrap}
.brand{font:900 20px Cinzel,serif;letter-spacing:2px;color:var(--gold);text-decoration:none}.back{color:#d1d5db;border:1px solid var(--border);border-radius:24px;padding:10px 14px;text-decoration:none;font-size:12px}
main{max-width:1200px;margin:auto;padding:clamp(24px,4vw,48px) 16px 60px}.kicker{text-align:center;color:var(--gold);font-size:11px;letter-spacing:3px;font-weight:800}
h1{text-align:center;font:900 clamp(28px,4vw,48px)/1.1 Cinzel,serif;margin:14px 0}.intro{text-align:center;color:#aab3c2;font-size:14px;line-height:1.6;max-width:620px;margin:0 auto 30px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media(min-width:1025px){main{max-width:1320px;padding-inline:32px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{height:232px;padding:22px}h2{font-size:19px}.desc{font-size:14px}.status{font-size:10px}}
@media(min-width:1441px){main{max-width:1440px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.card{height:250px}}
.card{height:220px;min-width:0;position:relative;display:flex;flex-direction:column;text-align:left;padding:20px;border:1px solid var(--border);border-radius:20px;background:#151b27;color:#f8fafc;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.card.active{border-color:var(--gold);box-shadow:0 0 18px #D4AF3722}.card.active:hover{transform:translateY(-4px);box-shadow:0 0 28px #D4AF3750,0 12px 28px #0007}
.card.locked{background:rgba(15,20,31,.4);cursor:not-allowed}.card.locked:hover{transform:none;box-shadow:none}
.card.jarrell{grid-column:span 2;border:2px solid #8e303c;background:linear-gradient(145deg,#17151d,#1b1219 58%,#160f16);box-shadow:inset 0 0 30px #8b1e2b30,0 0 20px #a3263644,0 0 4px #c04a58aa}
.card.jarrell .expedition,.card.jarrell h2{color:#e6b0b2}
.card.jarrell .expedition{font-size:12px;letter-spacing:1.5px}
.card.jarrell h2{font-size:clamp(23px,3vw,30px);line-height:1.12;min-height:0;margin-top:18px;max-width:calc(100% - 52px)}
.card.jarrell .desc{font-size:16px;line-height:1.45;color:#c5a7ab;max-width:95%}
.card.jarrell .difficulty{font-size:12px;letter-spacing:1px}
.card.jarrell .status{font-size:11px;padding:9px 13px;border-width:1.5px}.card.jarrell .crest{stroke:#a83b45;filter:drop-shadow(0 0 3px #a32636aa)}.card.jarrell .status{border-color:#79313a;color:#d28a90;background:#2b111833}.card.jarrell .difficulty{color:#b98b91}
.card.jarrell::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse at 90% 8%,#8b1e2b20,transparent 52%)}
.card.jarrell.active{border-color:#b34350;box-shadow:0 0 25px #8b1e2b66,0 0 5px #d65b69aa,inset 0 0 32px #8b1e2b30}.card.jarrell.active:hover{box-shadow:0 0 24px #a3263655,0 12px 28px #0008,inset 0 0 26px #8b1e2b25}
.expedition{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--gold)}
.crest{position:absolute;right:20px;top:20px;width:32px;height:32px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.locked .crest{stroke:var(--gray)}
h2{font:700 18px/1.18 Cinzel,serif;margin:20px 40px 8px 0;min-height:2.36em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.desc{font-size:14px;line-height:1.35;color:rgba(248,250,252,.6);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.difficulty{font-size:10px;letter-spacing:.8px;color:#9CA3AF;margin-top:8px;white-space:nowrap}
.status{align-self:flex-start;margin-top:auto;max-width:100%;border:1px solid var(--gold);border-radius:999px;padding:7px 11px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.8px;background:transparent;white-space:nowrap}
.locked .status{border-color:#4B5563;color:#9CA3AF}
@media(min-width:768px) and (max-width:1024px){main{padding-inline:24px}.grid{gap:20px}.card{height:220px}}
@media(max-width:767px){.card.jarrell{grid-column:span 2;height:220px;padding:20px}.card.jarrell .expedition{font-size:12px}.card.jarrell h2{font-size:25px;margin-top:16px}.card.jarrell .desc{font-size:16px}.card.jarrell .status{font-size:11px;padding:9px 13px}header{height:64px;padding:0 14px}.brand{font-size:16px;letter-spacing:1.5px}.back{font-size:10px;padding:9px 10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{height:180px;padding:16px;border-radius:18px}.crest{right:14px;top:14px;width:32px;height:32px}h2{font-size:clamp(15px,3.8vw,18px);margin:18px 34px 7px 0}.expedition{font-size:9px;letter-spacing:.8px}.status{font-size:9px;padding:6px 8px}.difficulty{font-size:9px;letter-spacing:0}}
@media(min-width:1441px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card{height:264px}h2{font-size:21px}.desc{font-size:16px}.expedition{font-size:13px}.status{font-size:11px}}
</style></head><body>
<header><a class="brand" href="../">CLIMBORIA</a><a class="back" href="../">← BACK TO HOME</a></header>
<main><div class="kicker">CHOOSE YOUR ASCENT</div><h1>EXPEDITION SELECT</h1><p class="intro">Eleven mountain expeditions. Prepare your gear, master each ascent, and push toward the ultimate summit.</p>
<section class="grid" aria-label="Eleven expeditions"><button class="card locked jarrell" data-level="11" aria-disabled="true"><span class="expedition">EXPEDITION 11 · EXTREME RISK</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 35 L8 18 L13 25 L18 7 L22 20 L27 2 L32 22 L38 35 Z M18 7 L14 15 L21 15 L18 24 M27 2 L23 12 L30 12 L27 19"/></svg><h2>JARRELL'S PEAK</h2><p class="desc">A terrifying, high-risk ascent. One mistake—and the mountain claims you.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button>
<button class="card active" data-level="01" ><span class="expedition">EXPEDITION 01</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 35 L7 18 L12 25 L17 8 L22 23 L27 4 L32 22 L38 35 Z M17 8 L14 16 L20 16 M27 4 L24 13 L30 13"/></svg><h2>ELLA'S BLACKFANG PEAK</h2><p class="desc">A jagged first ascent with unforgiving teeth.</p><span class="difficulty">DIFFICULTY&nbsp; ★☆☆☆☆</span><span class="status">BASE CAMP</span></button><button class="card locked" data-level="02" aria-disabled="true"><span class="expedition">EXPEDITION 02</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 35 L9 21 L16 25 L20 13 L24 25 L31 21 L38 35 Z M20 13 L20 5 L24 9 L29 5 L29 13"/></svg><h2>NATHALIA'S STARBREAKER SUMMIT</h2><p class="desc">Crack the sky on a blade of frozen stone.</p><span class="difficulty">DIFFICULTY&nbsp; ★★☆☆☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="03" aria-disabled="true"><span class="expedition">EXPEDITION 03</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 35 L10 14 L16 22 L21 8 L26 22 L33 14 L37 35 Z M10 14 L13 20 L16 14 M26 14 L29 20 L33 14"/></svg><h2>ALAS' IRONCLAW RIDGE</h2><p class="desc">Steel-hard holds. One slip, a long fall.</p><span class="difficulty">DIFFICULTY&nbsp; ★★☆☆☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="04" aria-disabled="true"><span class="expedition">EXPEDITION 04</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 35 L12 19 L17 22 L20 3 L23 22 L28 19 L35 35 Z M20 3 L16 12 L24 12 L20 22"/></svg><h2>LHEIZ'S SHADOWFORGE SPIRE</h2><p class="desc">A dark monolith forged above the clouds.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★☆☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="05" aria-disabled="true"><span class="expedition">EXPEDITION 05</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 35 L8 20 L13 24 L18 8 L23 24 L28 3 L33 22 L38 35 Z M8 20 L15 20 M23 24 L31 15"/></svg><h2>ZALDY'S THUNDERMAW CRAG</h2><p class="desc">Storms roar through its shattered cliffs.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="06" aria-disabled="true"><span class="expedition">EXPEDITION 06</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 35 L9 28 L9 12 L16 12 L16 20 L23 20 L23 5 L30 5 L30 25 L37 35 Z M16 12 L13 17 L19 17"/></svg><h2>TATA'S TITANWALL</h2><p class="desc">A colossal wall built to break climbers.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button>
<button class="card locked" data-level="07" aria-disabled="true"><span class="expedition">EXPEDITION 07</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 35 L8 19 L13 23 L19 7 L23 18 L29 3 L35 22 L38 35 Z M19 7 L15 14 L22 14 M29 3 L26 12 L32 12"/></svg><h2>JEFF'S STORMBREAKER</h2><p class="desc">A savage ridge split by roaring storms.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="08" aria-disabled="true"><span class="expedition">EXPEDITION 08</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 35 L11 16 L17 21 L20 3 L24 21 L29 11 L37 35 Z M20 3 L17 12 L23 12 L20 19"/></svg><h2>GAB'S DOOMSPIRE</h2><p class="desc">A black spire where every hold feels cursed.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★☆</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="09" aria-disabled="true"><span class="expedition">EXPEDITION 09</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 35 L7 18 L13 22 L18 9 L22 22 L27 5 L33 19 L38 35 Z M7 18 L13 14 L18 18 M22 22 L27 17 L33 19"/></svg><h2>D30'S OBLIVION CROWN</h2><p class="desc">A knife-edge crown above a bottomless void.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button><button class="card locked" data-level="10" aria-disabled="true"><span class="expedition">EXPEDITION 10</span><svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 35 L10 18 L16 24 L23 4 L29 21 L34 14 L38 35 Z M23 4 L19 15 L26 15 L22 25"/></svg><h2>LAIZA'S WORLDENDER</h2><p class="desc">The final wall before the world falls away.</p><span class="difficulty">DIFFICULTY&nbsp; ★★★★★</span><span class="status">🔒 COMPLETE PREVIOUS LEVEL</span></button></section></main>
<script>
const unlocked=n=>n==="01"||localStorage.getItem("climboria_completed_"+String(Number(n)-1).padStart(2,"0"))==="true";
document.querySelectorAll(".card").forEach(card=>{const n=card.dataset.level;const active=unlocked(n);card.classList.toggle("locked",!active);card.classList.toggle("active",n==="01"&&active);card.setAttribute("aria-disabled",String(!active));if(!active)card.querySelector(".status").textContent="🔒 COMPLETE PREVIOUS LEVEL";else if(localStorage.getItem("climboria_completed_"+n)==="true")card.querySelector(".status").textContent="✓ SUMMIT CLEARED";card.addEventListener("click",()=>{if(!unlocked(n))return;const name=card.querySelector("h2").textContent;location.href="./play.html?level="+encodeURIComponent(n)+"&name="+encodeURIComponent(name)})});
</script></body></html>
