<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Climboria — Cinematic Mountain Prototype</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#eef4f7}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,15,24,.55),transparent 25%,transparent 70%,rgba(7,15,24,.38))}#top{position:absolute;top:16px;left:18px;max-width:calc(100vw - 36px)}h1{font-size:clamp(17px,2.5vw,25px);letter-spacing:.08em;margin:0 0 4px;font-weight:800}#sub{color:#c5d5dd;font-size:12px}#panel{position:absolute;right:16px;top:16px;width:min(270px,calc(100vw - 32px));padding:14px;border:1px solid #ffffff26;border-radius:14px;background:#101a22d9;backdrop-filter:blur(12px);pointer-events:auto;box-shadow:0 8px 28px #0005}#panel strong{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 3px;color:#d6e1e6;font-size:12px}input[type=range]{width:100%;accent-color:#e6b85c}button{background:#e6b85c;color:#17212a;border:0;border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer;margin-top:10px;width:100%}#bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#d6e1e6;background:#101a22b8;border:1px solid #ffffff20;border-radius:20px;padding:8px 12px;white-space:nowrap}#fps{color:#ffd77a}#hint{color:#9fb2be;margin-top:8px;font-size:11px}@media(max-width:650px){#panel{top:auto;bottom:48px;right:10px;width:190px;padding:10px}#top{top:10px;left:12px}#bottom{bottom:10px;left:10px;transform:none;font-size:10px}label{margin:6px 0 2px}}
</style>
</head>
<body>
<div id="hud"><div id="top"><h1>CLIMBORIA</h1><div id="sub">CINEMATIC MOUNTAIN · VISUAL PROTOTYPE</div></div><div id="panel"><strong>Environment controls</strong>
<label for="mist">Mountain mist <span id="mistVal">42%</span></label><input id="mist" type="range" min="0" max="100" value="42">
<label for="trees">Forest density <span id="treesVal">55%</span></label><input id="trees" type="range" min="0" max="100" value="55">
<label for="snow">Summit snow <span id="snowVal">55%</span></label><input id="snow" type="range" min="0" max="100" value="55">
<label for="quality">Render quality <span id="qualityVal">Balanced</span></label><input id="quality" type="range" min="1" max="3" step="1" value="2">
<button id="reset">Reset camera</button><div id="hint">Drag to orbit · Scroll to zoom · Prototype only, not connected to game collisions yet.</div></div><div id="bottom">THREE.JS · <span id="fps">FPS —</span> · GPU-friendly procedural terrain</div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import { OrbitControls } from 'https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const isMobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||innerWidth<700;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8cbd8);scene.fog=new THREE.FogExp2(0xb8cbd8,.0065);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,700);camera.position.set(58,48,76);
const renderer=new THREE.WebGLRenderer({antialias:!isMobile,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1:1.35));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,13,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=28;controls.maxDistance=180;
scene.add(new THREE.HemisphereLight(0xd9e9ff,0x45473c,2.0));const sun=new THREE.DirectionalLight(0xffe0b0,2.6);sun.position.set(-45,90,28);scene.add(sun);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function hash(x,z){const n=Math.sin(x*127.1+z*311.7+19.19)*43758.5453;return n-Math.floor(n)}
function noise(x,z){let ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;fx=fx*fx*(3-2*fx);fz=fz*fz*(3-2*fz);return (hash(ix,iz)*(1-fx)+hash(ix+1,iz)*fx)*(1-fz)+(hash(ix,iz+1)*(1-fx)+hash(ix+1,iz+1)*fx)*fz}
function fbm(x,z){let s=0,a=.56,n=0;for(let i=0;i<5;i++){s+=(noise(x,z)*2-1)*a;n+=a;x=x*2.03+17.2;z=z*2.01-9.4;a*=.49}return s/n}
function heightAt(x,z){const edge=Math.max(Math.abs(x),Math.abs(z));const fall=smooth(64,43,edge);const broad=13+12*Math.exp(-((x+8)**2+(z-4)**2)/1150)+8*Math.exp(-((x-24)**2+(z+17)**2)/550);const ridge=Math.max(0,1-Math.abs(x*.052+z*.027+fbm(x*.035,z*.035)*.32));const peaks=Math.pow(ridge,1.35)*22;const detail=fbm(x*.105,z*.105)*6+fbm(x*.26+4,z*.26-8)*1.8;const valley=-6*Math.exp(-((x-3)**2+(z+18)**2)/270);return Math.max(.5,(broad+peaks+detail+valley)*fall)}
function surfaceColor(x,z,y){const n=fbm(x*.09,z*.09);const snowLine=28+Number(snowInput.value)*.19;let c;if(y>snowLine)c=new THREE.Color(0xdfe5e5).lerp(new THREE.Color(0xf8fbff),clamp((y-snowLine)/15,0,1));else if(y>19)c=new THREE.Color(0x656d6a).lerp(new THREE.Color(0xa2a49a),clamp((y-19)/12,0,1));else if(y>9)c=new THREE.Color(0x4c5145).lerp(new THREE.Color(0x6f6d59),clamp((n+.35)*.9,0,1));else c=new THREE.Color(0x314c3b).lerp(new THREE.Color(0x58714a),clamp((n+.55)*.8,0,1));const shade=.91+n*.12;return c.multiplyScalar(shade)}
const snowInput=document.querySelector('#snow');
function buildTerrain(){if(terrain){scene.remove(terrain);terrain.geometry.dispose();terrain.material.dispose()}const seg= isMobile?130:180,size=128,geo=new THREE.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);const p=geo.attributes.position,colors=[];for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),y=heightAt(x,z);p.setY(i,y);const c=surfaceColor(x,z,y);colors.push(c.r,c.g,c.b)}geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.94,metalness:0,flatShading:false});terrain=new THREE.Mesh(geo,mat);terrain.receiveShadow=false;scene.add(terrain);terrain.position.y=-.4}
let terrain;buildTerrain();
function createDistantMountains(){const mat=new THREE.MeshStandardMaterial({color:0x718793,roughness:1,flatShading:true});for(let i=0;i<7;i++){const g=new THREE.ConeGeometry(18+hash(i,2)*13,25+hash(i,4)*24,7);const m=new THREE.Mesh(g,mat);m.position.set(-110+i*36,5+hash(i,5)*8,-98-hash(i,9)*18);m.rotation.y=hash(i,8)*2;scene.add(m)}}
createDistantMountains();
function makeForest(){for(const obj of forestObjects)scene.remove(obj);forestObjects=[];const count=Math.round((isMobile?230:480)*Number(treeInput.value)/100);const trunkGeo=new THREE.CylinderGeometry(.12,.23,1.7,5),leafGeo=new THREE.ConeGeometry(1,3.4,6);const trunkMat=new THREE.MeshStandardMaterial({color:0x514638,roughness:1}),leafMats=[0x243d31,0x2f4b37,0x3c5a40].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,count),leaves=leafMats.map(mat=>new THREE.InstancedMesh(leafGeo,mat,count));const dummy=new THREE.Object3D();let used=0;for(let i=0;i<count*3&&used<count;i++){const x=(hash(i,31)-.5)*116,z=(hash(i,32)-.5)*116,y=heightAt(x,z);if(y>14||y<1.5)continue;const scale=.55+hash(i,33)*.8;dummy.position.set(x,y+.7*scale,z);dummy.scale.setScalar(scale);dummy.rotation.y=hash(i,34)*6.28;dummy.updateMatrix();trunks.setMatrixAt(used,dummy.matrix);dummy.position.y=y+2*scale;dummy.scale.set(scale,scale,scale);dummy.updateMatrix();leaves[Math.floor(hash(i,35)*3)].setMatrixAt(used,dummy.matrix);used++}trunks.count=used;trunks.instanceMatrix.needsUpdate=true;scene.add(trunks);forestObjects.push(trunks);for(const l of leaves){l.count=used;l.instanceMatrix.needsUpdate=true;scene.add(l);forestObjects.push(l)}}
const forestObjects=[];const treeInput=document.querySelector('#trees');makeForest();
const mistInput=document.querySelector('#mist');function updateAtmosphere(){scene.fog.density=.0025+Number(mistInput.value)/100*.009;document.querySelector('#mistVal').textContent=mistInput.value+'%';document.querySelector('#treesVal').textContent=treeInput.value+'%';document.querySelector('#snowVal').textContent=snowInput.value+'%';}
function updateSnow(){if(terrain)buildTerrain();document.querySelector('#snowVal').textContent=snowInput.value+'%'}
mistInput.addEventListener('input',updateAtmosphere);treeInput.addEventListener('change',()=>{makeForest();updateAtmosphere()});snowInput.addEventListener('change',updateSnow);
const q=document.querySelector('#quality');function setQuality(){const v=Number(q.value);renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?(.7+v*.15):(.75+v*.3)));renderer.shadowMap.enabled=false;document.querySelector('#qualityVal').textContent=['Eco','Balanced','Detail'][v-1];}q.addEventListener('input',setQuality);setQuality();updateAtmosphere();
document.querySelector('#reset').onclick=()=>{camera.position.set(58,48,76);controls.target.set(0,13,0);controls.update()};
let last=performance.now(),frames=0,fps=0;function animate(now){requestAnimationFrame(animate);controls.update();frames++;if(now-last>1000){fps=Math.round(frames*1000/(now-last));document.querySelector('#fps').textContent=fps+' FPS';frames=0;last=now}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1:1.35))});
</script></body></html>
