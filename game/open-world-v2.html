<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Climboria — Open Mountain World Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb4c4;color:#f4f6f8;font:13px/1.4 system-ui,Segoe UI,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#07121b88,transparent 20%,transparent 76%,#07121b55)}#brand{position:absolute;top:17px;left:20px;text-shadow:0 2px 8px #0009}#brand b{font-size:21px;letter-spacing:.14em}#brand small{display:block;color:#d1e0e5;letter-spacing:.16em;font-size:10px;margin-top:2px}#card{position:absolute;right:16px;top:16px;width:235px;border:1px solid #ffffff30;background:#0a1724c9;border-radius:13px;padding:13px;backdrop-filter:blur(10px);pointer-events:auto;box-shadow:0 12px 32px #0004}#card strong{display:block;letter-spacing:.1em;font-size:11px;margin-bottom:9px;color:#f4d38a}label{display:flex;justify-content:space-between;margin:9px 0 2px;font-size:11px;color:#d9e4e9}input{width:100%;accent-color:#dfb85e}button{width:100%;border:1px solid #e7c77a;background:#d8b45f;color:#14212b;border-radius:7px;padding:8px;margin-top:9px;font-weight:800;cursor:pointer}#help{position:absolute;bottom:17px;left:18px;max-width:330px;padding:11px 13px;background:#081521bb;border:1px solid #ffffff20;border-radius:10px;color:#d7e2e7;font-size:11px}#stats{position:absolute;right:17px;bottom:17px;background:#081521bb;border:1px solid #ffffff20;border-radius:8px;padding:7px 10px;font-size:10px;color:#c5d5de}#fps{color:#ffe19b}@media(max-width:650px){#card{width:180px;right:8px;top:8px;padding:9px}#brand{left:10px;top:10px}#brand b{font-size:16px}#help{left:8px;bottom:8px;max-width:calc(100vw - 205px);font-size:10px}#stats{display:none}}
</style></head><body>
<div id="hud"><div id="brand"><b>CLIMBORIA</b><small>OPEN MOUNTAIN WORLD · VISUAL / MOVEMENT TEST</small></div><div id="card"><strong>WORLD SETTINGS</strong>
<label>Atmospheric haze <span id="hazeV">45%</span></label><input id="haze" type="range" min="0" max="100" value="45">
<label>Forest density <span id="forestV">65%</span></label><input id="forest" type="range" min="15" max="100" value="65">
<label>Snowline <span id="snowV">65%</span></label><input id="snow" type="range" min="35" max="90" value="65">
<label>Graphics preset <span id="qualityV">Balanced</span></label><input id="quality" type="range" min="1" max="3" value="2">
<button id="reset">RESET CAMERA</button><div style="font-size:10px;color:#9fb4c0;margin-top:8px">Prototype only — not yet connected to the live expedition or climbing-grip system.</div></div>
<div id="help"><b>EXPLORE</b><br>WASD move · Shift sprint · Mouse drag orbit · Wheel zoom<br>Terrain, trees and distant peaks are generated locally.</div><div id="stats">RENDER <span id="fps">— FPS</span> · <span id="tri">—</span> tris</div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
const mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||innerWidth<700;
const scene=new THREE.Scene();const sky=new THREE.Color(0x9eb8c9);scene.background=sky;scene.fog=new THREE.FogExp2(sky,.0027);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1600);camera.position.set(0,9,18);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1:1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.13;renderer.shadowMap.enabled=!mobile;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9edff,0x3d453b,1.7));const sun=new THREE.DirectionalLight(0xffe1ba,2.5);sun.position.set(-220,340,150);sun.castShadow=!mobile;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-150;sun.shadow.camera.right=150;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function hash(x,z){let n=Math.sin(x*127.1+z*311.7+78.233)*43758.5453123;return n-Math.floor(n)}
function noise(x,z){let ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;fx=fx*fx*(3-2*fx);fz=fz*fz*(3-2*fz);let a=hash(ix,iz),b=hash(ix+1,iz),c=hash(ix,iz+1),d=hash(ix+1,iz+1);return (a+(b-a)*fx)*(1-fz)+(c+(d-c)*fx)*fz}
function fbm(x,z){let v=0,a=.55,n=0;for(let i=0;i<5;i++){v+=(noise(x,z)*2-1)*a;n+=a;x=x*2.03+13.4;z=z*2.01-8.7;a*=.49}return v/n}
function heightAt(x,z){const ridgeLine=80*Math.exp(-((x+28)/125)**2)+49*Math.exp(-((x-108)/80)**2)+37*Math.exp(-((x+170)/90)**2);const ridgeNoise=fbm(x*.018,z*.018)*24+fbm(x*.052,z*.052)*10;const foothill=6+4*Math.sin(x*.013+z*.006)+3*Math.sin(z*.021-x*.011);const massif= Math.max(0,ridgeLine+ridgeNoise)*smooth(260,95,Math.abs(z+160));const valley=-14*Math.exp(-((x-18)**2+(z-35)**2)/1900)-8*Math.exp(-((x+110)**2+(z+20)**2)/1300);const detail=fbm(x*.13,z*.13)*2.8+fbm(x*.29+9,z*.29)*.7;return Math.max(-1,foothill+massif+valley+detail)}
const snow=document.querySelector('#snow'),haze=document.querySelector('#haze'),forest=document.querySelector('#forest'),quality=document.querySelector('#quality');let terrain,treeGroup=[],rockGroup=[];
function colorAt(x,z,y){const n=fbm(x*.075,z*.075);const line=55+Number(snow.value)*.62;let c;if(y>line)c=new THREE.Color(0x8d9698).lerp(new THREE.Color(0xf4f5f3),smooth(line,line+23,y));else if(y>line-20)c=new THREE.Color(0x565f60).lerp(new THREE.Color(0x96968b),smooth(line-20,line,y));else if(y>25)c=new THREE.Color(0x4b514b).lerp(new THREE.Color(0x77776a),clamp((n+.45)*.7,0,1));else c=new THREE.Color(0x344b37).lerp(new THREE.Color(0x62714a),clamp((n+.5)*.75,0,1));return c.multiplyScalar(.92+n*.1)}
function canvasTexture(kind){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');if(kind==='rock'){x.fillStyle='#77786f';x.fillRect(0,0,512,512);let seed=8;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<16000;i++){x.globalAlpha=.04+rand()*.15;x.fillStyle=rand()>.5?'#e2dfd4':'#303b3e';x.beginPath();x.ellipse(rand()*512,rand()*512,1+rand()*4,.5+rand()*2,rand()*3,0,Math.PI*2);x.fill()}x.globalAlpha=1}else{x.fillStyle='#465a3b';x.fillRect(0,0,512,512);let seed=99;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<23000;i++){x.globalAlpha=.05+rand()*.16;x.fillStyle=['#243b2b','#718251','#9a956b','#31472d'][i%4];x.fillRect(rand()*512,rand()*512,1+rand()*4,1+rand()*5)}x.globalAlpha=1}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}
const rockTex=canvasTexture('rock'),grassTex=canvasTexture('grass');
function buildTerrain(){if(terrain){scene.remove(terrain);terrain.geometry.dispose();terrain.material.dispose()}const seg=mobile?180:260,size=900,geo=new THREE.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);const p=geo.attributes.position,cols=[];for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),y=heightAt(x,z);p.setY(i,y);const c=colorAt(x,z,y);cols.push(c.r,c.g,c.b)}geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));geo.computeVertexNormals();terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,map:rockTex,roughness:.96,metalness:0,bumpMap:rockTex,bumpScale:.24}));terrain.receiveShadow=true;terrain.position.z=-40;scene.add(terrain)}
buildTerrain();
function buildForest(){treeGroup.forEach(o=>scene.remove(o));treeGroup=[];const count=Math.floor((mobile?850:2100)*Number(forest.value)/100);const trunkGeo=new THREE.CylinderGeometry(.18,.34,2.7,6),leafGeo=new THREE.ConeGeometry(1.25,4.8,7),trunkMat=new THREE.MeshStandardMaterial({color:0x594633,roughness:1}),leafMats=[0x203b2b,0x294a32,0x3a5a3b].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,count),leaves=leafMats.map(m=>new THREE.InstancedMesh(leafGeo,m,count));const d=new THREE.Object3D();let used=0;for(let i=0;i<count*5&&used<count;i++){const x=(hash(i,14)-.5)*830,z=(hash(i,17)-.5)*830,y=heightAt(x,z);if(y>49||y<1||Math.abs(x)<12&&z>-80)continue;const s=.65+hash(i,22)*1.45;d.position.set(x,y+1.3*s,z-40);d.scale.set(s,s,s);d.rotation.y=hash(i,24)*6.28;d.updateMatrix();trunks.setMatrixAt(used,d.matrix);d.position.y=y+3.1*s;d.scale.set(s,s,s);d.updateMatrix();leaves[Math.floor(hash(i,29)*3)].setMatrixAt(used,d.matrix);used++}trunks.count=used;trunks.instanceMatrix.needsUpdate=true;scene.add(trunks);treeGroup.push(trunks);for(const l of leaves){l.count=used;l.instanceMatrix.needsUpdate=true;scene.add(l);treeGroup.push(l)}}
buildForest();
function buildRocks(){rockGroup.forEach(o=>scene.remove(o));rockGroup=[];const count=mobile?260:650;const geo=new THREE.DodecahedronGeometry(1,1);const mats=[0x555a57,0x686b65,0x77776e].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}));const inst=mats.map(m=>new THREE.InstancedMesh(geo,m,count));const d=new THREE.Object3D();let used=0;for(let i=0;i<count*2&&used<count;i++){const x=(hash(i,41)-.5)*520,z=(hash(i,43)-.5)*570,y=heightAt(x,z);if(y<8||y>82)continue;const s=.7+hash(i,47)*4;d.position.set(x,y+s*.15,z-40);d.scale.set(s*(.7+hash(i,49)),s*.5,s*(.8+hash(i,51)));d.rotation.set(hash(i,53),hash(i,59)*6,hash(i,61));d.updateMatrix();inst[Math.floor(hash(i,63)*3)].setMatrixAt(used,d.matrix);used++}for(const m of inst){m.count=used;m.instanceMatrix.needsUpdate=true;scene.add(m);rockGroup.push(m)}}
buildRocks();
function distantRanges(){const mat=new THREE.MeshStandardMaterial({color:0x6b8590,roughness:1,flatShading:true});for(let i=0;i<23;i++){const h=45+hash(i,6)*115,r=28+hash(i,9)*47,g=new THREE.ConeGeometry(r,h,7,2);const m=new THREE.Mesh(g,mat);m.position.set(-680+i*61, h*.25-3,-530-hash(i,4)*180);m.rotation.y=hash(i,12)*2;scene.add(m)}}
distantRanges();
// Player proxy for movement and scale; replaced by the live hero when this environment is integrated into play.html.
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),new THREE.MeshStandardMaterial({color:0x243c43,roughness:.8}));body.position.y=1.25;player.add(body);const pack=new THREE.Mesh(new THREE.BoxGeometry(.52,.6,.25),new THREE.MeshStandardMaterial({color:0xb58a3e,roughness:1}));pack.position.set(0,1.45,-.34);player.add(pack);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),new THREE.MeshStandardMaterial({color:0xc49b79,roughness:1}));head.position.y=2;player.add(head);player.position.set(0,heightAt(0,0),12);scene.add(player);
let yaw=0,pitch=-.18,dist=13,drag=false,lastX=0,lastY=0;const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.004;pitch=clamp(pitch-(e.clientY-lastY)*.003,-.75,.18);lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.018,6,36)},{passive:true});
function updateCamera(){const target=player.position.clone().add(new THREE.Vector3(0,1.5,0));const offset=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(-pitch)*dist+3,Math.cos(yaw)*Math.cos(pitch)*dist);camera.position.copy(target).add(offset);camera.lookAt(target)}
function updateSettings(){scene.fog.density=.0012+Number(haze.value)/100*.0048;document.querySelector('#hazeV').textContent=haze.value+'%';document.querySelector('#forestV').textContent=forest.value+'%';document.querySelector('#snowV').textContent=snow.value+'%';}
haze.addEventListener('input',updateSettings);forest.addEventListener('change',buildForest);forest.addEventListener('input',updateSettings);snow.addEventListener('input',()=>{document.querySelector('#snowV').textContent=snow.value+'%';buildTerrain()});quality.addEventListener('input',()=>{const q=Number(quality.value);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?[.7,.85,1][q-1]:[.85,1.15,1.5][q-1]));renderer.shadowMap.enabled=!mobile&&q===3;document.querySelector('#qualityV').textContent=['Eco','Balanced','High'][q-1]});document.querySelector('#reset').onclick=()=>{yaw=0;pitch=-.18;dist=13;player.position.set(0,heightAt(0,0),12)};updateSettings();
let last=performance.now(),frames=0;function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000||.016);last=now;let forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0);if(forward||side){const speed=(keys.ShiftLeft||keys.ShiftRight?24:11)*dt;const fx=-Math.sin(yaw),fz=-Math.cos(yaw);player.position.x+=(fx*forward+Math.cos(yaw)*side)*speed;player.position.z+=(fz*forward-Math.sin(yaw)*side)*speed;player.position.x=clamp(player.position.x,-420,420);player.position.z=clamp(player.position.z,-450,420);player.position.y=heightAt(player.position.x,player.position.z)}updateCamera();renderer.render(scene,camera);frames++;if(now-lastFps>1000){document.querySelector('#fps').textContent=Math.round(frames*1000/(now-lastFps))+' FPS';document.querySelector('#tri').textContent=Math.round(renderer.info.render.triangles/1000)+'k';frames=0;lastFps=now}}let lastFps=performance.now();requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1:1.5))});
</script></body></html>
