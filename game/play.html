<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CLIMBORIA — Climbing Prototype</title>
<style>
:root{color-scheme:dark;--gold:#f7c65b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b;color:#f8fafc;font:14px Inter,system-ui,sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.plate{background:#07101bd9;border:1px solid #ffffff20;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px);box-shadow:0 8px 24px #0005}.brand{font:900 14px Cinzel,Georgia,serif;letter-spacing:2px;color:var(--gold)}.small{font-size:10px;color:#aebbd0;letter-spacing:1px;margin-top:5px}.meters{display:flex;gap:7px;margin-top:8px}.meter{width:90px;height:5px;border-radius:9px;background:#ffffff20;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:#f7c65b}.meter.stamina i{background:#73d5b0}.objective{align-self:center;text-align:center;margin-top:8px;font-size:11px;letter-spacing:1px;color:#e9e3d3;text-shadow:0 2px 5px #000}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px}.help{max-width:340px;font-size:11px;line-height:1.6;color:#c0cbd9}.btn{pointer-events:auto;border:1px solid #f7c65b88;background:#111b2add;color:#ffe29a;border-radius:999px;padding:12px 16px;font-weight:800;letter-spacing:1px;cursor:pointer}.btn:active{transform:scale(.97)}#touch{display:none;pointer-events:auto;align-items:flex-end;gap:12px}.stick{width:124px;height:124px;border:1px solid #ffffff40;border-radius:50%;background:#08132199;position:relative;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:38px;top:38px;border-radius:50%;background:#f7c65b99;border:1px solid #ffe5a0}.actions{display:grid;grid-template-columns:repeat(2,58px);gap:8px}.actions button{width:58px;height:58px;padding:0;font-size:10px}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#081321ee;border:1px solid #f7c65b66;border-radius:14px;padding:18px 22px;text-align:center;display:none;max-width:90%;pointer-events:auto}.toast.show{display:block}.toast b{display:block;color:var(--gold);margin-bottom:7px}.toast button{margin-top:12px}
@media(pointer:coarse),(max-width:760px){#touch{display:flex}.help{display:none}.bottom{justify-content:space-between}.top .right{max-width:48%}.meter{width:65px}}
</style></head><body><div id="game"></div>
<div class="hud"><div class="top"><div class="plate"><div class="brand">CLIMBORIA</div><div class="small" id="levelName">EXPEDITION 01 · BINANCE RIDGE</div><div class="meters"><span><div class="small">HEALTH</div><div class="meter"><i id="healthBar"></i></div></span><span><div class="small">STAMINA</div><div class="meter stamina"><i id="staminaBar"></i></div></span></div></div><div class="plate right"><div class="small">ALTITUDE</div><strong id="altitude">0 m</strong><div class="small" id="state">ON THE GROUND</div></div></div><div class="objective" id="objective">Reach the glowing grips. Press E / GRAB to latch on.</div><div class="bottom"><div class="plate help">DESKTOP: WASD move · SPACE jump · E grab/release · SHIFT sprint · ESC pause<br>Climb by moving toward nearby glowing holds while latched.</div><div id="touch"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn" id="jump">JUMP</button><button class="btn" id="grab">GRAB</button><button class="btn" id="sprint">RUN</button><button class="btn" id="pause">PAUSE</button></div></div><button class="btn" id="menu">EXPEDITION MENU</button></div></div>
<div class="toast" id="toast"><b id="toastTitle">PAUSED</b><span id="toastText">Take a breather.</span><br><button class="btn" id="resume">RESUME</button></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
const host=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x8da8bc);scene.fog=new THREE.Fog(0x8da8bc,24,95);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7eaff,0x453b31,2));
const sun=new THREE.DirectionalLight(0xffe2b0,3.2);sun.position.set(-8,18,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const rock=mat(0x4b5965),darkRock=mat(0x263746),gripMat=new THREE.MeshStandardMaterial({color:0x8df0a8,emissive:0x1c9b4b,emissiveIntensity:1.5,roughness:.5});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x293b36));ground.rotation.x=-Math.PI/2;ground.position.y=-.25;ground.receiveShadow=true;scene.add(ground);
// Climbable crag wall, ledges and highlighted holds.
const wall=new THREE.Mesh(new THREE.BoxGeometry(12,24,2.8),rock);wall.position.set(0,11.5,-3.4);wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);
for(let i=0;i<24;i++){const x=(Math.sin(i*2.31)*4.8),y=1+i*.82,z=-1.85+(Math.cos(i*1.7)*.3);const hold=new THREE.Mesh(new THREE.DodecahedronGeometry(.23+(i%3)*.04,0),gripMat);hold.position.set(x,y,z);hold.castShadow=true;scene.add(hold);holds.push(hold)}
function addRidge(x,z,s,h){const m=new THREE.Mesh(new THREE.ConeGeometry(s,h,5),darkRock);m.position.set(x,h/2-0.2,z);m.rotation.y=.3;m.castShadow=true;scene.add(m)}
for(let i=0;i<22;i++)addRidge((Math.random()-.5)*65,-18-Math.random()*42,3+Math.random()*5,8+Math.random()*16);
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.95,4,8),mat(0xc98b50));body.position.y=1.05;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),mat(0xd7a477));head.position.y=1.82;player.add(head);
const pack=new THREE.Mesh(new THREE.BoxGeometry(.42,.55,.22),mat(0x263d54));pack.position.set(0,1.1,.32);player.add(pack);
player.position.set(0,0,3);
const holds=[]; // holds are populated below (declared before construction)
let latched=false,paused=false,health=100,stamina=100,vel=new THREE.Vector3(),keys={},touchMove={x:0,y:0},sprinting=false;
function closestHold(){let best=null,d=2.2;for(const h of holds){const n=player.position.distanceTo(h.position);if(n<d){d=n;best=h}}return best}
function grab(){if(latched){latched=false;document.getElementById('state').textContent='FREE CLIMB';return}const h=closestHold();if(h){latched=true;player.position.copy(h.position).add(new THREE.Vector3(0,-.75,.65));vel.set(0,0,0);document.getElementById('state').textContent='GRIPPING HOLD';document.getElementById('objective').textContent='Latched! Move toward the next glowing grip.'}else{document.getElementById('objective').textContent='Move closer to a glowing grip, then GRAB.'}}
function jump(){if(latched){latched=false;vel.y=4.6;document.getElementById('state').textContent='LEAPING'}else if(player.position.y<.05)vel.y=6}
function moveVec(){let x=(keys.KeyD?1:0)-(keys.KeyA?1:0),z=(keys.KeyW?1:0)-(keys.KeyS?1:0);x+=touchMove.x;z+=touchMove.y;const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}return{x,z}}
function update(dt){if(paused)return;const m=moveVec(),speed=sprinting||keys.ShiftLeft?6.2:3.6;
if(latched){player.position.x+=m.x*speed*.55*dt;player.position.y+=m.z*speed*.55*dt;player.position.z=-1.2;player.position.y=Math.max(.5,Math.min(20,player.position.y));}
else{vel.y-=12*dt;player.position.x+=m.x*speed*dt;player.position.z+=m.z*speed*dt;player.position.y+=vel.y*dt;if(player.position.y<0){player.position.y=0;vel.y=0}player.position.x=Math.max(-5.5,Math.min(5.5,player.position.x));player.position.z=Math.max(-1,Math.min(5,player.position.z))}
stamina=Math.max(0,Math.min(100,stamina+(latched?-10:7)*dt));document.getElementById('staminaBar').style.width=stamina+'%';document.getElementById('healthBar').style.width=health+'%';document.getElementById('altitude').textContent=Math.round(player.position.y*5)+' m';
const target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z);const camPos=new THREE.Vector3(player.position.x+4,player.position.y+3.1,player.position.z+8);camera.position.lerp(camPos,1-Math.pow(.001,dt));camera.lookAt(target);
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);renderer.render(scene,camera)}let last=performance.now();requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')grab();if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='Escape')togglePause(true)});addEventListener('keyup',e=>keys[e.code]=false);
document.getElementById('jump').onclick=jump;document.getElementById('grab').onclick=grab;document.getElementById('sprint').onpointerdown=()=>sprinting=true;document.getElementById('sprint').onpointerup=()=>sprinting=false;document.getElementById('sprint').onpointerleave=()=>sprinting=false;document.getElementById('pause').onclick=()=>togglePause(true);
function togglePause(p){paused=p;document.getElementById('toast').classList.toggle('show',p);document.getElementById('toastTitle').textContent=p?'PAUSED':'CLIMB ON';document.getElementById('toastText').textContent=p?'Your ascent is paused.':'Back to the mountain.'}
document.getElementById('resume').onclick=()=>togglePause(false);document.getElementById('menu').onclick=()=>location.href='./';
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let pointer=null;
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);updateStick(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)updateStick(e)});function updateStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=42,l=Math.hypot(dx,dy),s=l>max?max/l:1;touchMove.x=dx*s/max;touchMove.y=-dy*s/max;knob.style.transform='translate('+dx*s+'px,'+dy*s+'px)'}function endStick(){pointer=null;touchMove={x:0,y:0};knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
const qs=new URLSearchParams(location.search),lev=qs.get('level')||'01',name=qs.get('name')||'Binance Ridge';document.getElementById('levelName').textContent='EXPEDITION '+lev+' · '+name.toUpperCase();
</script></body></html>
