name: CLIMBX release safety (non-deploying)
on:
  push:
    paths:
      - 'climbx/**'
      - 'dex/climbx/**'
      - 'dex/index.html'
      - '.github/workflows/climbx-release-gate.yml'
  pull_request:
    paths:
      - 'climbx/**'
      - '.github/workflows/climbx-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: climbx_test
          POSTGRES_PASSWORD: climbx_test_only
          POSTGRES_DB: climbx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U climbx_test -d climbx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: |
          python - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, "climbx")
          suite = unittest.defaultTestLoader.discover("climbx", pattern="test_*.py")
          count = suite.countTestCases()
          if count < 121:
              raise SystemExit(f"Test collection unexpectedly shrank: {count} < 121")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f"Verified {count} CLIMBX repository tests.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real PostgreSQL migration and nonce tests (isolated CI database)
        env:
          CLIMBX_TEST_DATABASE_URL: postgresql://climbx_test:climbx_test_only@localhost:5432/climbx_test
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          python -m unittest climbx.test_postgres_integration -v
      - name: Solana Ed25519 signature tests
        run: node --test climbx/solana_signature.test.cjs climbx/verify_challenge.test.cjs climbx/bind_wallet_pg.test.cjs climbx/canonical_challenge.test.cjs climbx/issue_challenge_pg.test.cjs climbx/supabase_auth.test.cjs climbx/authenticated_wallet_service.test.cjs climbx/wallet_http.test.cjs climbx/pg_wallet_rate_limit.test.cjs climbx/wallet_api_factory.test.cjs climbx/deadline.test.cjs climbx/reconcile_wallet_binding_pg.test.cjs climbx/dashboard_preview.test.cjs climbx/authorization_policy_simulation.test.cjs climbx/devnet_toolchain_check.test.cjs climbx/devnet_route_preflight.test.cjs climbx/devnet_grant_state_simulation.test.cjs climbx/execution_authorization_boundary.test.cjs climbx/audit_execution_boundary.test.cjs climbx/probe_solana_toolchain.test.cjs climbx/local_validator_evidence_gate.test.cjs climbx/local_validator_rpc_probe.test.cjs
      - name: Verify exact fail-closed release decision
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "climbx/release_gate.py",
               "--evidence", "climbx/release_evidence.json"],
              text=True, capture_output=True, check=False,
          )
          if result.returncode != 1:
              raise SystemExit(f"Expected NO_GO exit 1; got {result.returncode}: {result.stderr}")
          try:
              decision = json.loads(result.stdout)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Release gate did not return JSON: {exc}")
          if decision.get("decision") != "NO_GO" or not decision.get("missing"):
              raise SystemExit(f"Expected explicit NO_GO with missing evidence; got {decision}")
          print("Verified NO_GO and missing evidence; no deployment performed.")
          PY
