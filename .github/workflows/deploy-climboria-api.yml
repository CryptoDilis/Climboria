name: Deploy Climboria API

on:
  workflow_dispatch:
  # Ship the quote-only Worker once when this guarded release workflow lands
  # on main. Later source changes never silently enable mainnet trading.
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-climboria-api.yml'

permissions:
  contents: read

concurrency:
  group: deploy-climboria-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Worker security and API tests
        working-directory: dex/swap-proxy
        run: node --test test/*.test.mjs

      - name: Configure account-specific rate-limit namespace
        working-directory: dex/swap-proxy
        env:
          RATE_LIMIT_NAMESPACE_ID: ${{ vars.CLOUDFLARE_RATE_LIMIT_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RATE_LIMIT_NAMESPACE_ID" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::Set repository variable CLOUDFLARE_RATE_LIMIT_NAMESPACE_ID to a positive integer reserved for this Worker in the Cloudflare account."
            exit 1
          fi
          sed -i "s/namespace_id = \"20261108\"/namespace_id = \"$RATE_LIMIT_NAMESPACE_ID\"/" wrangler.toml
          grep -Fqx "namespace_id = \"$RATE_LIMIT_NAMESPACE_ID\"" wrangler.toml

      - name: Validate Worker configuration
        working-directory: dex/swap-proxy
        run: |
          set -euo pipefail
          test -f src/index.mjs
          test -f wrangler.toml
          grep -Fqx 'name = "climboria-swap-proxy"' wrangler.toml
          grep -Fqx 'ALLOWED_ORIGINS = "https://climboria.fun,https://www.climboria.fun"' wrangler.toml
          grep -Fqx 'EXECUTION_ENABLED = "false"' wrangler.toml
          grep -Fqx 'const SIGNABLE_ORDER_SECURITY_REVIEW_COMPLETE = false;' src/index.mjs
          grep -Fqx 'const EXECUTION_SECURITY_REVIEW_COMPLETE = false;' src/index.mjs
          grep -Eq '^[[:space:]]*enabled:[[:space:]]*false' ../../swap-config.js
          grep -Fqx 'pattern = "api.climboria.fun"' wrangler.toml
          grep -Fqx 'custom_domain = true' wrangler.toml
          grep -Fqx 'name = "RATE_LIMITER"' wrangler.toml
          grep -Fqx 'name = "ORDER_STORE"' wrangler.toml
          grep -Fqx 'class_name = "SwapOrderStore"' wrangler.toml
          grep -Fqx 'new_sqlite_classes = ["SwapOrderStore"]' wrangler.toml
          grep -Fqx 'name = "ORDER_STORE"' wrangler.toml
          grep -Fqx 'class_name = "SwapOrderStore"' wrangler.toml
          grep -Fqx 'new_sqlite_classes = ["SwapOrderStore"]' wrangler.toml
          namespace_id="$(sed -n 's/^namespace_id = "\([0-9][0-9]*\)"/\1/p' wrangler.toml)"
          if [ -z "$namespace_id" ] || [ "$namespace_id" = "20261108" ]; then
            echo "::error::A real account-specific RATE_LIMITER namespace is required before deploying."
            exit 1
          fi

      - name: Validate Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-fA-F0-9]{32}$'; then
            echo "::error::Missing or invalid GitHub Actions secret CLOUDFLARE_ACCOUNT_ID (expected 32 hexadecimal characters)."
            exit 1
          fi
          if [ -z "$JUPITER_API_KEY" ]; then
            echo "::error::Missing GitHub Actions secret JUPITER_API_KEY. Store the Jupiter server key as an encrypted Actions secret; never commit it."
            exit 1
          fi
          # Solana RPC is required for a future security-reviewed signed-order
          # release, but quote-only Jupiter search/quotes do not consume it.
          if [ -n "$SOLANA_RPC_URL" ] && ! node -e 'const u=new URL(process.argv[1]);if(u.protocol!=="https:"||u.username||u.password)process.exit(1)' "$SOLANA_RPC_URL"; then
            echo "::error::Invalid SOLANA_RPC_URL; if configured, it must be an HTTPS URL without credentials."
            exit 1
          fi
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo "::notice::SOLANA_RPC_URL is unset. Shipping quote-only API: signable orders and execution remain source-disabled."
          fi

      - name: Set Jupiter server key as a Worker secret
        working-directory: dex/swap-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          printf '%s' "$JUPITER_API_KEY" | npx wrangler@4.36.0 secret put JUPITER_API_KEY

      - name: Set Solana RPC endpoint as a Worker secret
        working-directory: dex/swap-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set -euo pipefail
          if [ -n "$SOLANA_RPC_URL" ]; then
            printf '%s' "$SOLANA_RPC_URL" | npx wrangler@4.36.0 secret put SOLANA_RPC_URL
          else
            echo "Quote-only release: skipping unset Solana RPC secret."
          fi

      - name: Deploy Worker
        working-directory: dex/swap-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.36.0 deploy

      - name: Verify deployed Worker health and CORS
        run: |
          set -euo pipefail
          response="$(curl --retry 6 --retry-delay 10 --retry-connrefused --fail --silent --show-error https://api.climboria.fun/health)"
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.ok!==true||x.configured?.jupiterKey!==true||x.configured?.rateLimiter!==true||x.configured?.orderStore!==true||x.execution!=='disabled'||x.configured?.executionEnabled!==false){console.error('Worker health is not quote-only production-ready:',x);process.exit(1)}console.log('Worker health, required bindings, and disabled execution kill switch verified.')})"
          curl --fail --silent --show-error -X OPTIONS https://api.climboria.fun/api/swap/order -H 'Origin: https://climboria.fun' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' -o /dev/null -D /tmp/climboria-cors-headers
          grep -qi '^access-control-allow-origin: https://climboria.fun' /tmp/climboria-cors-headers
          echo "Worker CORS preflight verified for https://climboria.fun."

      - name: Verify production API quote, token search, and closed transaction gates
        run: node .github/scripts/api-production-readiness.mjs
