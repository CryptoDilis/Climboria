name: Deploy Climboria API

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/worker/**"
      - ".github/workflows/deploy-climboria-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-climboria-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend/worker
        run: npm install --no-audit --no-fund

      - name: Check D1 configuration is present
        working-directory: backend/worker
        run: |
          if grep -q "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID" wrangler.toml; then
            echo "::error::Set the real D1 database_id in backend/worker/wrangler.toml before deployment."
            exit 1
          fi

      - name: Validate Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-fA-F0-9]{32}$'; then
            echo "::error::Missing or invalid GitHub Actions secret CLOUDFLARE_ACCOUNT_ID (expected 32 hexadecimal characters)."
            exit 1
          fi

      - name: Deploy Worker
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deployed Worker health
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error https://climboria-api.escalante-wacom.workers.dev/health; then
              echo
              echo "Worker health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt/10 failed; retrying in 5 seconds."
            sleep 5
          done
          echo "::error::Deployed Worker did not return a successful /health response."
          exit 1
