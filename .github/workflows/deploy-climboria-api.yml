          fi
          if [ -z "$JUPITER_API_KEY" ]; then
            echo "::error::Missing GitHub Actions secret JUPITER_API_KEY. Store the Jupiter server key as an encrypted Actions secret; never commit or paste it into chat."
            exit 1
          fi

      - name: Set Jupiter server key as a Worker secret
        working-directory: dex/swap-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          printf '%s' "$JUPITER_API_KEY" | npx wrangler@4.36.0 secret put JUPITER_API_KEY

      - name: Deploy Worker
