name: Deploy Climboria API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-climboria-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Worker security and API tests
        working-directory: dex/swap-proxy
        run: node --test test/worker.test.mjs

      - name: Validate Worker configuration
        working-directory: dex/swap-proxy
        run: |
          test -f src/index.mjs
          test -f wrangler.toml
          grep -q '^name = "climboria-swap-proxy"' wrangler.toml
          grep -q 'name = "RATE_LIMITER"' wrangler.toml
          grep -q 'ALLOWED_ORIGINS = "https://climboria.fun,https://www.climboria.fun"' wrangler.toml

      - name: Validate Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-fA-F0-9]{32}$'; then
            echo "::error::Missing or invalid GitHub Actions secret CLOUDFLARE_ACCOUNT_ID (expected 32 hexadecimal characters)."
            exit 1
          fi

      - name: Deploy Worker
        working-directory: dex/swap-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.36.0 deploy
