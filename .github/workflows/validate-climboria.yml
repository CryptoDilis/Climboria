name: Validate Climboria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current homepage structure and controls
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags=[]
                  self.hero_buttons=[]
                  self.in_hero_buttons=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs); self.tags.append((tag,a))
                  classes=a.get("class","").split()
                  if tag=="div" and "hero-buttons" in classes:
                      self.in_hero_buttons=True
                  elif self.in_hero_buttons and tag=="button":
                      self.hero_buttons.append(a)
              def handle_endtag(self, tag):
                  if tag=="div" and self.in_hero_buttons:
                      self.in_hero_buttons=False
          p=Probe(); p.feed(html)
          for tag in ("html","body"):
              if sum(1 for t,_ in p.tags if t==tag)!=1:
                  raise SystemExit(f"Expected exactly one <{tag}> element")
          if len(p.hero_buttons)!=3:
              raise SystemExit(f"Expected 3 hero CTA buttons; got {len(p.hero_buttons)}")
          labels=[(b.get("id",""),b.get("class","")) for b in p.hero_buttons]
          for required_id in ("swapBtn","launchpadBtn","hamburger","mobileMenu","swapModal","launchpadModal"):
              if not any(a.get("id")==required_id for _,a in p.tags):
                  raise SystemExit(f"Missing expected homepage control: #{required_id}")
          print("Current homepage structure and hero controls validated.")
          PY
      - name: Syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.attrs={}; self.buf=[]; self.out=[]
              def handle_starttag(self,t,a):
                  if t=="script": self.active=True; self.attrs=dict(a); self.buf=[]
              def handle_data(self,d):
                  if self.active: self.buf.append(d)
              def handle_endtag(self,t):
                  if t=="script" and self.active:
                      if not self.attrs.get("src") and (self.attrs.get("type","").lower() not in ("application/json","application/ld+json","importmap")):
                          code="".join(self.buf).strip()
                          if code: self.out.append(code)
                      self.active=False
          p=Scripts(); p.feed(Path("index.html").read_text(encoding="utf-8"))
          Path("/tmp/climboria-inline-js").mkdir(exist_ok=True)
          for i,s in enumerate(p.out): Path(f"/tmp/climboria-inline-js/{i}.js").write_text(s,encoding="utf-8")
          print(f"Extracted {len(p.out)} inline script(s).")
          PY
          for file in /tmp/climboria-inline-js/*.js; do node --check "$file"; done
