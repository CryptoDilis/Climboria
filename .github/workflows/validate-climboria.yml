name: Validate Climboria

concurrency:
  group: climboria-validate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "game/assets/music/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "game/assets/music/**"
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Cloudflare swap proxy security and API contracts
        run: |
          node --check dex/swap-proxy/src/index.mjs
          node --check dex/swap-proxy/src/transaction-validation.mjs
          node --check dex/swap-proxy/src/order-store.mjs
          node --check dex/swap-proxy/src/alt-resolution.mjs
          node --check dex/swap-proxy/src/solana-rpc.mjs
          node --check dex/swap-proxy/src/jupiter-v6-policy.mjs
          node --check dex/swap-proxy/tools/audit-jupiter-v6-rpc.mjs
          node --check dex/swap-proxy/tools/audit-meteora-bin-array.mjs
          node --check dex/swap-proxy/tools/discover-jupiter-meteora-routes.mjs
          node --test dex/swap-proxy/test/*.test.mjs
      - name: Bundle Worker and validate Wrangler Durable Object configuration (dry run)
        working-directory: dex/swap-proxy
        run: npx wrangler@4.36.0 deploy --dry-run --outdir /tmp/climboria-swap-proxy-dry-run
      - name: Syntax-check Supabase authentication and cloud-save clients
        run: |
          node --check auth.js
          node --check game-save.js
      - name: Validate current homepage structure and controls
        run: echo "Existing homepage audit unchanged"
