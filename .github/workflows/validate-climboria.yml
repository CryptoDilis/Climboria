name: Validate Climboria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current homepage structure and controls
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags=[]
                  self.hero_buttons=[]
                  self.in_hero_buttons=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs); self.tags.append((tag,a))
                  classes=a.get("class","").split()
                  if tag=="div" and "hero-buttons" in classes:
                      self.in_hero_buttons=True
                  elif self.in_hero_buttons and tag=="button":
                      self.hero_buttons.append(a)
              def handle_endtag(self, tag):
                  if tag=="div" and self.in_hero_buttons:
                      self.in_hero_buttons=False
          p=Probe(); p.feed(html)
          for tag in ("html","body"):
              if sum(1 for t,_ in p.tags if t==tag)!=1:
                  raise SystemExit(f"Expected exactly one <{tag}> element")
          if len(p.hero_buttons)!=3:
              raise SystemExit(f"Expected 3 hero CTA buttons; got {len(p.hero_buttons)}")
          labels=[(b.get("id",""),b.get("class","")) for b in p.hero_buttons]
          for required_id in ("swapBtn","launchpadBtn","hamburger","mobileMenu","swapModal","launchpadModal"):
              if not any(a.get("id")==required_id for _,a in p.tags):
                  raise SystemExit(f"Missing expected homepage control: #{required_id}")
          print("Current homepage structure and hero controls validated.")
          PY
      - name: Verify token launch copy is clearly marked as a target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "PLANNED LAUNCH TARGET",
              "Planned launch target · subject to readiness",
              "date may change",
              "verify launch link and token address on official channels",
              "TARGET NOV 15, 2026",
          ]
          missing = [text for text in required if text not in html]
          if missing:
              raise SystemExit(f"Missing transparent launch-status copy: {missing}")
          if "Official launch announcement</div>" in html:
              raise SystemExit("Homepage must not imply an unverified token launch is already official.")
          print("Launch target wording is clearly marked as planned and subject to verification.")
          PY
      - name: Syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.attrs={}; self.buf=[]; self.out=[]
              def handle_starttag(self,t,a):
                  if t=="script": self.active=True; self.attrs=dict(a); self.buf=[]
              def handle_data(self,d):
                  if self.active: self.buf.append(d)
              def handle_endtag(self,t):
                  if t=="script" and self.active:
                      if not self.attrs.get("src") and (self.attrs.get("type","").lower() not in ("application/json","application/ld+json","importmap")):
                          code="".join(self.buf).strip()
                          if code: self.out.append(code)
                      self.active=False
          p=Scripts(); p.feed(Path("index.html").read_text(encoding="utf-8"))
          Path("/tmp/climboria-inline-js").mkdir(exist_ok=True)
          for i,s in enumerate(p.out): Path(f"/tmp/climboria-inline-js/{i}.js").write_text(s,encoding="utf-8")
          print(f"Extracted {len(p.out)} inline script(s).")
          PY
          for file in /tmp/climboria-inline-js/*.js; do node --check "$file"; done
      - name: Syntax-check game/play.html scripts
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.attrs = {}
                  self.buf = []
                  self.out = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.active = True
                      self.attrs = dict(attrs)
                      self.buf = []
              def handle_data(self, data):
                  if self.active:
                      self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      typ = self.attrs.get("type", "").lower()
                      if not self.attrs.get("src") and typ not in ("application/json", "application/ld+json", "importmap"):
                          code = "".join(self.buf).strip()
                          if code:
                              self.out.append((typ, code))
                      self.active = False
          parser = Scripts()
          parser.feed(Path("game/play.html").read_text(encoding="utf-8"))
          out = Path("/tmp/climboria-game-js")
          out.mkdir(exist_ok=True)
          for i, (typ, code) in enumerate(parser.out):
              suffix = ".mjs" if typ == "module" else ".js"
              (out / f"{i}{suffix}").write_text(code, encoding="utf-8")
          if not parser.out:
              raise SystemExit("No inline game scripts were found.")
          print(f"Extracted {len(parser.out)} inline game script(s).")
          PY
          for file in /tmp/climboria-game-js/*; do node --check "$file"; done
      - name: Audit remaining game and site HTML scripts
        run: |
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          files = [
              "game/index.html", "game/character-lab.html",
              "game/mountain-prototype.html", "game/open-world-v2.html",
              "overview/index.html", "terms/index.html",
          ]
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.scripts=[]; self.active=False; self.attrs={}; self.buf=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if a.get("id"): self.ids.append(a["id"])
                  if tag=="script": self.active=True; self.attrs=a; self.buf=[]
              def handle_data(self, data):
                  if self.active: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag=="script" and self.active:
                      typ=self.attrs.get("type","").lower()
                      code="".join(self.buf).strip()
                      if code and not self.attrs.get("src") and typ not in ("application/json","application/ld+json","importmap"):
                          self.scripts.append((typ,code))
                      self.active=False
          out=Path("/tmp/climboria-other-html-scripts"); out.mkdir(exist_ok=True)
          count=0
          for filename in files:
              source=Path(filename).read_text(encoding="utf-8")
              audit=Audit(); audit.feed(source)
              duplicates=[name for name,n in Counter(audit.ids).items() if n>1]
              if duplicates: raise SystemExit(f"{filename}: duplicate HTML IDs: {duplicates}")
              for i,(typ,code) in enumerate(audit.scripts):
                  suffix="mjs" if typ=="module" else "js"
                  (out/f"{Path(filename).stem}-{count}-{i}.{suffix}").write_text(code,encoding="utf-8")
              count += len(audit.scripts)
              print(f"{filename}: {len(audit.ids)} IDs checked; {len(audit.scripts)} inline scripts extracted.")
          print(f"Audit passed for {len(files)} HTML files; extracted {count} inline scripts.")
          PY
          find /tmp/climboria-other-html-scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: Install Playwright Chromium for browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Smoke-test Jarrell on desktop and mobile viewports
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/climboria-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/game/play.html?level=11' >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:4173/game/play.html?level=11' >/dev/null
          node .github/scripts/game-smoke.mjs
      - name: Upload Jarrell desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarrell-browser-smoke
          path: /tmp/jarrell-*.png
          if-no-files-found: ignore
          retention-days: 3
