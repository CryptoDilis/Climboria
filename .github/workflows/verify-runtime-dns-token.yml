name: Verify runtime DNS token read-only
on:
  push:
    branches: [codex/swap-dex-production-release-gate]
    paths: [.github/workflows/verify-runtime-dns-token.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DNS_TOKEN: ${{ secrets.CLOUDFLARE_RUNTIME_DNS_TOKEN }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify token and list scoped DNS records
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DNS_TOKEN"
          api=https://api.cloudflare.com/client/v4
          cf() { curl -sS --max-time 15 -H "Authorization: Bearer $DNS_TOKEN" "$api/$1"; }
          user=$(cf user/tokens/verify)
          echo "User token verification:"
          jq -c '{success,status:.result.status,errors:[.errors[]|{code,message}]}' <<<"$user"
          if ! jq -e '.success and .result.status == "active"' <<<"$user" >/dev/null; then
            account=$(cf "accounts/$ACCOUNT_ID/tokens/verify")
            echo "Account token verification:"
            jq -c '{success,status:.result.status,errors:[.errors[]|{code,message}]}' <<<"$account"
          fi
          zones=$(cf 'zones?name=climboria.fun')
          echo "Zone lookup:"
          jq -c '{success,matchingZones:(.result // [] | length),errors:[.errors[]|{code,message}]}' <<<"$zones"
          zone=$(jq -er 'select(.success) | .result | select(length == 1) | .[0].id' <<<"$zones")
          dns=$(cf "zones/$zone/dns_records?name=climboria.fun")
          echo "Apex DNS lookup:"
          jq -c '{success,records:(.result // [] | map({type,proxied})),errors:[.errors[]|{code,message}]}' <<<"$dns"
          jq -e '.success' <<<"$dns" >/dev/null
