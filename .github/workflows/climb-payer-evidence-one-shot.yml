name: CLIMB Provided Testnet Payer Evidence - Read Only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/climb-payer-evidence-one-shot.yml'
permissions:
  contents: read
jobs:
  payer:
    if: github.head_ref == 'climb-bridge/payer-evidence-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe provided public testnet payer addresses only
        env:
          SOLANA_PUBLIC_ADDRESS: 'G8CYYBwU9GzvaEVwdAwZMEbyn9K7JceztSHXW4DzNuJQ'
          BASE_PUBLIC_ADDRESS: '0x9bA615a67d6365849293521F6F9Ce0dFd00D6012'
        run: |
          set -euo pipefail
          node token/climb-bridge/testnet-payer-preflight.mjs "$SOLANA_PUBLIC_ADDRESS" "$BASE_PUBLIC_ADDRESS" > "$RUNNER_TEMP/payer-evidence.json"
          cat "$RUNNER_TEMP/payer-evidence.json"
          {
            echo '## Read-only payer observations'
            echo 'No signing, transfers or deployment. Release NO_GO.'
            echo '~~~json'
            cat "$RUNNER_TEMP/payer-evidence.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compare latest safe and finalized Base Sepolia public balance
        env:
          BASE_PUBLIC_ADDRESS: '0x9bA615a67d6365849293521F6F9Ce0dFd00D6012'
        run: |
          node --input-type=module <<'NODE'
          const rpc = async (method, params) => {
            const r = await fetch('https://sepolia.base.org', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(15000)});
            if (!r.ok) throw Error('RPC HTTP failure');
            const d = await r.json();
            if (d.error || d.id!==1 || d.result==null) throw Error('RPC result unavailable');
            return d.result;
          };
          if(await rpc('eth_chainId',[])!=='0x14a34') throw Error('Wrong chain');
          for(const tag of ['latest','safe','finalized']) {
            const block=await rpc('eth_getBlockByNumber',[tag,false]);
            const balance=await rpc('eth_getBalance',[process.env.BASE_PUBLIC_ADDRESS,block.number]);
            console.log('BASE_BALANCE_OBSERVATION '+JSON.stringify({tag,block:BigInt(block.number).toString(),balanceWei:BigInt(balance).toString()}));
          }
          NODE
