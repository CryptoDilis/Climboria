name: Game Import Verified Optimized Meshy GLB Packs

on:
  push:
    branches: [game/meshy-asset-pipeline-2026-11-15]
    paths:
      - 'assets/game/new_optimized/Climboria_Meshy_Assets_Pack_*.zip'

permissions:
  contents: write

concurrency:
  group: climboria-game-meshy-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-import:
    if: github.ref == 'refs/heads/game/meshy-asset-pipeline-2026-11-15'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout owner Game asset branch
        uses: actions/checkout@v4
        with:
          ref: game/meshy-asset-pipeline-2026-11-15
          persist-credentials: true
      - name: Validate archive members, GLB headers and geometry before importing
        run: python3 .github/scripts/game-import-meshy-packs.py
      - name: Verify isolated runtime loader JS syntax
        run: node --check game/meshy-world-assets.js
      - name: Commit only verified Game GLB bytes and remove source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/game/new_optimized/*.glb
          for pack in assets/game/new_optimized/Climboria_Meshy_Assets_Pack_*.zip; do
            if [ -f "$pack" ]; then git rm -- "$pack"; fi
          done
          if git diff --cached --quiet; then
            echo 'No newly imported Meshy GLBs'
          else
            git commit -m "assets(game): import validated optimized owner Meshy GLB files"
            git push origin HEAD:refs/heads/game/meshy-asset-pipeline-2026-11-15
          fi
      - name: Keep runtime release gate disabled until manual visual and device QA
        run: |
          python3 - <<'PY'
          import json
          config=json.load(open('assets/game/new_optimized/manifest.json',encoding='utf-8'))
          assert config['enabled'] is False, 'Unreviewed game assets must not auto-launch'
          print('PASS optional Meshy asset loading remains disabled')
          PY
