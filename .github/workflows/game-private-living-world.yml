name: Game Private Living World Fixtures
on:
  pull_request:
    paths:
      - 'game/multiplayer/private-campsite-*.mjs'
      - 'game/multiplayer/private-rest-ledger*.mjs'
      - 'game/multiplayer/private-weather-exposure*.mjs'
      - 'game/multiplayer/private-wildlife*.mjs'
      - 'game/multiplayer/private-player-resources*.mjs'
      - 'game/multiplayer/private-region-events*.mjs'
      - 'game/multiplayer/private-mastery-ledger*.mjs'
      - '.github/workflows/game-private-living-world.yml'
  push:
    branches: [main]
    paths:
      - 'game/multiplayer/private-campsite-*.mjs'
      - 'game/multiplayer/private-rest-ledger*.mjs'
      - 'game/multiplayer/private-weather-exposure*.mjs'
      - 'game/multiplayer/private-wildlife*.mjs'
      - 'game/multiplayer/private-player-resources*.mjs'
      - 'game/multiplayer/private-region-events*.mjs'
      - 'game/multiplayer/private-mastery-ledger*.mjs'
      - '.github/workflows/game-private-living-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-living-world:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact private Living World fixture tests
        run: node --test game/multiplayer/private-campsite-registry.test.mjs game/multiplayer/private-campsite-rest.test.mjs game/multiplayer/private-rest-ledger.test.mjs game/multiplayer/private-weather-exposure.test.mjs game/multiplayer/private-wildlife.test.mjs game/multiplayer/private-player-resources.test.mjs game/multiplayer/private-region-events.test.mjs game/multiplayer/private-mastery-ledger.test.mjs
