name: CLIMB Base Launch Metadata Draft
on:
  pull_request:
    paths:
      - 'base/launch-metadata/**'
      - 'assets/climb-token-official*'
      - '.github/workflows/climb-base-launch-metadata.yml'
  push:
    branches: [main]
    paths:
      - 'base/launch-metadata/**'
      - 'assets/climb-token-official*'
      - '.github/workflows/climb-base-launch-metadata.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test base/launch-metadata/climb-base-draft.test.mjs
