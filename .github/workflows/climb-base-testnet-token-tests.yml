name: CLIMB Base Sepolia Test Asset - Unit Tests
on:
  pull_request:
    paths:
      - 'token/climb-bridge/testnet-base/**'
      - '.github/workflows/climb-base-testnet-token-tests.yml'
  push:
    branches: [main]
    paths:
      - 'token/climb-bridge/testnet-base/**'
      - '.github/workflows/climb-base-testnet-token-tests.yml'
permissions:
  contents: read
jobs:
  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: token/climb-bridge/testnet-base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.5.0
          cache: false
      - name: Fetch exact OpenZeppelin source
        run: |
          set -euo pipefail
          mkdir -p lib/openzeppelin-contracts
          git -C lib/openzeppelin-contracts init
          git -C lib/openzeppelin-contracts fetch --depth=1 https://github.com/OpenZeppelin/openzeppelin-contracts.git dc44c9f1a4c3b10af99492eed84f83ed244203f6
          git -C lib/openzeppelin-contracts checkout --detach FETCH_HEAD
          test "$(git -C lib/openzeppelin-contracts rev-parse HEAD)" = dc44c9f1a4c3b10af99492eed84f83ed244203f6
      - name: Compile and run offline Solidity unit tests
        run: forge test -vv
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare unsigned test-only deployment artifact
        run: |
          set -euo pipefail
          node prepare-unsigned.mjs out/ClimbTestnetToken.sol/ClimbTestnetToken.json src/ClimbTestnetToken.sol "$GITHUB_SHA" "$RUNNER_TEMP/climb-testnet-unsigned.json"
      - uses: actions/upload-artifact@v4
        with:
          name: climb-base-sepolia-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/climb-testnet-unsigned.json
          retention-days: 7
          if-no-files-found: error
