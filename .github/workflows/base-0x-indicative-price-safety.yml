name: Base DEX Indicative Price Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "dex/base-price-provider/**"
      - ".github/scripts/base-0x-indicative-price.test.mjs"
      - ".github/scripts/base-price-worker.test.mjs"
      - ".github/scripts/base-price-budget.test.mjs"
      - ".github/scripts/base-price-disabled-staging-*.mjs"
      - ".github/workflows/base-price-disabled-worker-staging.yml"
      - ".github/workflows/base-0x-indicative-price-safety.yml"
  push:
    branches: [main]
    paths:
      - "dex/base-price-provider/**"
      - ".github/scripts/base-0x-indicative-price.test.mjs"
      - ".github/scripts/base-price-worker.test.mjs"
      - ".github/scripts/base-price-budget.test.mjs"
      - ".github/scripts/base-price-disabled-staging-*.mjs"
      - ".github/workflows/base-price-disabled-worker-staging.yml"
      - ".github/workflows/base-0x-indicative-price-safety.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check default-off indicative pricing adapter without credentials or live calls
        run: |
          node --check dex/base-price-provider/zeroex-indicative.mjs
          node --check dex/base-price-provider/worker.mjs
          node --check dex/base-price-provider/budget.mjs
          node --test .github/scripts/base-0x-indicative-price.test.mjs .github/scripts/base-price-worker.test.mjs .github/scripts/base-price-budget.test.mjs
          grep -Fqx 'BASE_INDICATIVE_PRICE_ENABLED = "false"' dex/base-price-provider/wrangler.toml
          grep -Fqx 'BASE_PRICE_DAILY_ATTEMPTS = "0"' dex/base-price-provider/wrangler.toml
          grep -Fqx 'workers_dev = false' dex/base-price-provider/wrangler.toml
          grep -Fqx 'preview_urls = false' dex/base-price-provider/wrangler.toml
          if grep -Eq '^[[:space:]]*(routes?[[:space:]]*=|\[\[routes\]\])' dex/base-price-provider/wrangler.toml; then exit 1; fi
      - name: Verify generated disabled staging configuration offline
        env:
          DEPLOY_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BASE_IP_NAMESPACE: "987001"
          BASE_SHARED_NAMESPACE: "987002"
          EXISTING_SOLANA_NAMESPACE: "987003"
        run: |
          node --check .github/scripts/base-price-disabled-staging-smoke.mjs
          node .github/scripts/base-price-disabled-staging-config.mjs
          grep -Fqx 'BASE_INDICATIVE_PRICE_ENABLED = "false"' dex/base-price-provider/wrangler.staging.generated.toml
          grep -Fqx 'BASE_PRICE_DAILY_ATTEMPTS = "0"' dex/base-price-provider/wrangler.staging.generated.toml
          grep -Fqx 'routes = [{ pattern = "base-price.climboria.fun", custom_domain = true }]' dex/base-price-provider/wrangler.staging.generated.toml
          grep -Fqx 'BASE_PRICE_DEPLOYED_SHA = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' dex/base-price-provider/wrangler.staging.generated.toml
          rm dex/base-price-provider/wrangler.staging.generated.toml
          if BASE_SHARED_NAMESPACE=987001 node .github/scripts/base-price-disabled-staging-config.mjs; then exit 1; fi
          test ! -e dex/base-price-provider/wrangler.staging.generated.toml
      - name: Preserve Solana execution gates
        run: |
          grep -Fqx 'const SIGNABLE_ORDER_SECURITY_REVIEW_COMPLETE = false;' dex/swap-proxy/src/index.mjs
          grep -Fqx 'const EXECUTION_SECURITY_REVIEW_COMPLETE = false;' dex/swap-proxy/src/index.mjs
          grep -Fqx 'const THIRD_PARTY_JUPITER_DEX_APPROVED = false;' dex/swap-proxy/src/index.mjs
