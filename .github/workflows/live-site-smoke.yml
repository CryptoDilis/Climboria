name: Climboria Live Site Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-site-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: climboria-live-site-smoke
  cancel-in-progress: false

jobs:
  live-site-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke-test deployed homepage and Jarrell's Peak
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--enable-webgl', '--use-gl=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
            const errors = [];
            try {
              const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
              page.on('pageerror', error => errors.push(error.message));
              const home = await page.goto('https://climboria.fun/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              if (!home || !home.ok()) throw new Error('Live homepage HTTP failure: ' + (home?.status() ?? 'no response'));
              const ctas = await page.locator('.hero-buttons button').allTextContents();
              if (ctas.length !== 3 || !ctas[0].includes('PLAY')) throw new Error('Unexpected live homepage CTAs: ' + JSON.stringify(ctas));
              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
              mobile.on('pageerror', error => errors.push('mobile: ' + error.message));
              const mobileHome = await mobile.goto('https://climboria.fun/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              if (!mobileHome || !mobileHome.ok()) throw new Error('Live mobile homepage HTTP failure');
              await mobile.locator('#hamburger').click({ timeout: 15000 });
              if (!await mobile.locator('#mobileMenu').evaluate(el => el.classList.contains('active'))) throw new Error('Live mobile navigation did not open');
              const game = await browser.newPage({ viewport: { width: 1365, height: 900 } });
              game.on('pageerror', error => errors.push('game: ' + error.message));
              const response = await game.goto('https://climboria.fun/game/play.html?level=11&smoke=1', { waitUntil: 'domcontentloaded', timeout: 60000 });
              if (!response || !response.ok()) throw new Error('Live Jarrell page HTTP failure: ' + (response?.status() ?? 'no response'));
              await game.waitForFunction(
                () => [...document.querySelectorAll('canvas')].some(canvas => canvas.id !== 'world-map' && canvas.width >= 100 && canvas.height >= 100),
                null,
                { timeout: 60000 }
              );
              await game.waitForFunction(() => {
                const visible = selector => { const el=document.querySelector(selector); if(!el)return false; const style=getComputedStyle(el),rect=el.getBoundingClientRect(); return style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)>0&&rect.width>0&&rect.height>0; };
                return window.__climboriaGameReady===true && document.body.classList.contains('free') && visible('#player-card') && visible('#status-card');
              }, null, { timeout: 60000 });
              await game.waitForTimeout(2000);
              // A real user gesture must recover playback when autoplay was blocked during takeOver().
              await game.locator('#expedition-settings-toggle').click({timeout:15000});
              await game.waitForFunction(() => document.documentElement.dataset.climboriaMusic === 'playing', null, {timeout:15000});
              const state = await game.evaluate(() => {
                const visible = selector => { const el=document.querySelector(selector); if(!el)return false; const style=getComputedStyle(el),rect=el.getBoundingClientRect(); return style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)>0&&rect.width>0&&rect.height>0; };
                const sceneCanvas=[...document.querySelectorAll('canvas')].find(canvas=>canvas.id!=='world-map');
                return {
                  ready:window.__climboriaGameReady===true,
                  gameplayActive:document.body.classList.contains('free'),
                  canvas:!!sceneCanvas,
                  canvasWidth:sceneCanvas?.width||0,
                  canvasHeight:sceneCanvas?.height||0,
                  playerHud:visible('#player-card')&&visible('#player-name'),
                  healthHud:visible('#status-card')&&!!document.querySelector('#health-value'),
                  staminaHud:!!document.querySelector('#stamina-value'),
                  worldMap:visible('#world-map-panel'),
                  settings:visible('#expedition-settings-toggle'),
                  soundtrack:document.documentElement.dataset.climboriaMusic||'not-started'
                };
              });
              if (!state.ready || !state.gameplayActive || !state.canvas || state.canvasWidth < 100 || state.canvasHeight < 100 || !state.playerHud || !state.healthHud || !state.staminaHud || !state.worldMap || !state.settings || state.soundtrack !== 'playing') throw new Error('Live Jarrell scene did not initialize: ' + JSON.stringify(state));
              if (errors.length) throw new Error('Uncaught browser errors: ' + errors.join(' | '));
              console.log('PASS live homepage/mobile navigation/Jarrell scene: ' + JSON.stringify(state));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Smoke-test deployed Climboria DEX market terminal
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              const page = await browser.newPage({viewport:{width:1440,height:1000}});
              page.on('pageerror', error => { throw error; });
              const response = await page.goto('https://climboria.fun/dex/', {waitUntil:'domcontentloaded',timeout:60000});
              if (!response || !response.ok()) throw new Error('Live DEX route HTTP failure: '+(response?.status() ?? 'no response'));
              await page.locator('#markets').waitFor({state:'visible',timeout:20000});
              for (const selector of ['#search','#refresh','#connectWallet','#getQuote','#quoteAmount']) {
                if (await page.locator(selector).count() !== 1) throw new Error('Missing DEX control: '+selector);
              }
              const heading = await page.locator('h1').first().innerText();
              if (!heading.toLowerCase().includes('solana')) throw new Error('Unexpected DEX heading: '+heading);
              const labels = await page.locator('#connectWallet,#getQuote').allTextContents();
              if (!labels.some(x=>x.toLowerCase().includes('connect')) || !labels.some(x=>x.toLowerCase().includes('quote'))) throw new Error('Wallet/quote controls are not visible: '+JSON.stringify(labels));
              console.log('PASS live DEX route and market/search/wallet/quote UI. Swap remains quote-only.');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
