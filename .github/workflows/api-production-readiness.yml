name: Climboria API Production Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/api-production-readiness.mjs"
      - ".github/scripts/api-production-readiness.test.mjs"
      - ".github/workflows/api-production-readiness.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/api-production-readiness.mjs"
      - ".github/scripts/api-production-readiness.test.mjs"
      - ".github/workflows/api-production-readiness.yml"
  workflow_dispatch:
  # Deploy runs and readiness checks are separate workflows. Checking on a
  # main push can probe the OLD Worker before Wrangler finishes.
  workflow_run:
    workflows: ["Deploy Climboria API"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: climboria-api-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-unit:
    name: Validate API readiness probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the deployed revision on post-deploy checks.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and fail-closed unit tests
        run: |
          node --check .github/scripts/api-production-readiness.mjs
          node --test .github/scripts/api-production-readiness.test.mjs
          node --test dex/swap-proxy/test/worker.test.mjs
      - name: Guard both source-level trading kill switches
        run: |
          grep -Fqx 'const SIGNABLE_ORDER_SECURITY_REVIEW_COMPLETE = false;' dex/swap-proxy/src/index.mjs
          grep -Fqx 'const EXECUTION_SECURITY_REVIEW_COMPLETE = false;' dex/swap-proxy/src/index.mjs

  production-probe:
    name: Check real API production quote-only readiness
    # A successful Worker deployment (or an explicit manual check) is the
    # ONLY condition that permits a live quote-only production probe.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    needs: probe-unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the deployed revision on post-deploy checks.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify real Worker, quote/search and disabled execution
        env:
          # Manual checks are observational; post-deploy checks require an exact SHA.
          CLIMBORIA_EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: node .github/scripts/api-production-readiness.mjs
