name: Game Private Expedition Station
on:
  pull_request:
    paths:
      - 'game/play.html'
      - 'game/multiplayer/private-expedition-station*.mjs'
      - 'game/multiplayer/private-expedition-cooking*.mjs'
      - 'game/multiplayer/private-expedition-gateway*.mjs'
      - 'game/multiplayer/worker/preview-ticket-store.mjs'
      - 'game/multiplayer/private-campsite-*.mjs'
      - 'game/multiplayer/private-crafting-ledger*.mjs'
      - 'game/multiplayer/jarrell-terrain-reference*.mjs'
      - 'game/multiplayer/jarrell-dry-region-prototype*.mjs'
      - 'game/multiplayer/server-ground-movement*.mjs'
      - '.github/workflows/game-private-expedition-station.yml'
  push:
    branches: [main]
    paths:
      - 'game/play.html'
      - 'game/multiplayer/private-expedition-station*.mjs'
      - 'game/multiplayer/private-expedition-cooking*.mjs'
      - 'game/multiplayer/private-expedition-gateway*.mjs'
      - 'game/multiplayer/worker/preview-ticket-store.mjs'
      - 'game/multiplayer/private-campsite-*.mjs'
      - 'game/multiplayer/private-crafting-ledger*.mjs'
      - 'game/multiplayer/jarrell-terrain-reference*.mjs'
      - 'game/multiplayer/jarrell-dry-region-prototype*.mjs'
      - 'game/multiplayer/server-ground-movement*.mjs'
      - '.github/workflows/game-private-expedition-station.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-station:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test game/multiplayer/private-expedition-gateway.test.mjs game/multiplayer/private-expedition-cooking.test.mjs game/multiplayer/private-campsite-registry.test.mjs game/multiplayer/private-expedition-station.test.mjs game/multiplayer/jarrell-dry-region-prototype.test.mjs game/multiplayer/private-crafting-ledger.test.mjs
