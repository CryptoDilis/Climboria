name: CLIMB Historical Cutoff Block Bracket
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'base/inventory-probe/historical-bracket*.mjs'
      - '.github/workflows/climb-historical-cutoff-bracket.yml'
permissions:
  contents: read
concurrency:
  group: climb-historical-bracket-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test base/inventory-probe/historical-bracket.test.mjs
  observe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect reported finalized block-time bracket only
        env:
          CLIMB_SOLANA_RPC_A_URL: ${{ secrets.CLIMBORIA_SOLANA_RPC_URL }}
          CLIMB_SOLANA_RPC_B_URL: ${{ secrets.CLIMBORIA_SOLANA_RPC_URL_SECONDARY }}
        run: |
          set -euo pipefail
          node base/inventory-probe/historical-bracket-cli.mjs > "$RUNNER_TEMP/climb-cutoff-bracket.json"
          cat "$RUNNER_TEMP/climb-cutoff-bracket.json"
      - uses: actions/upload-artifact@v4
        with:
          name: climb-historical-block-bracket
          path: ${{ runner.temp }}/climb-cutoff-bracket.json
          retention-days: 7
          if-no-files-found: error
