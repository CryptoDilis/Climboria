name: Game Private Crafting Interaction
on:
  pull_request:
    paths:
      - 'game/multiplayer/private-crafting-*'
      - 'game/multiplayer/private-survival-ledger*'
      - 'game/multiplayer/private-crafted-meal*'
      - '.github/workflows/game-private-crafting-interaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-crafting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test game/multiplayer/private-crafting-ledger.test.mjs game/multiplayer/private-survival-ledger.test.mjs game/multiplayer/private-crafted-meal.test.mjs game/multiplayer/private-crafting-panel.test.mjs
