name: CLIMB Solana Devnet Mint Rent - Read Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'token/climb-bridge/testnet-solana/mint-plan.mjs'
      - '.github/workflows/climb-solana-testnet-mint-rent.yml'
permissions:
  contents: read
jobs:
  rent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Estimate public Devnet storage rent
        run: node token/climb-bridge/testnet-solana/mint-plan.mjs
