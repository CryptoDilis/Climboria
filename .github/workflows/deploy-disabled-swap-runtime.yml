name: Deploy disabled Swap runtime status
on:
  push:
    branches: [codex/swap-dex-production-release-gate]
    paths: [.github/workflows/deploy-disabled-swap-runtime.yml]
permissions:
  contents: read
concurrency: climboria-production-runtime-routing
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify DNS access, deploy disabled handler, and validate apex
        shell: bash
        env:
          DNS_TOKEN: ${{ secrets.CLOUDFLARE_RUNTIME_DNS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$DNS_TOKEN"
          api=https://api.cloudflare.com/client/v4
          cf() {
            local method=$1 path=$2 token=$3 result
            shift 3
            result=$(curl -sS --max-time 15 -X "$method" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$api/$path" "$@")
            if ! jq -e '.success == true' <<<"$result" >/dev/null; then
              jq -c '{errors}' <<<"$result" >&2
              return 1
            fi
            jq -c '.result' <<<"$result"
          }
          zone=$(cf GET 'zones?name=climboria.fun' "$DNS_TOKEN" | jq -er 'select(length == 1) | .[0].id')
          records=$(cf GET "zones/$zone/dns_records?name=climboria.fun&per_page=100" "$DNS_TOKEN")
          apex=$(jq -c '[.[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME")]' <<<"$records")
          jq -e 'length > 0 and all(.[]; .proxiable and ((.type == "A" and (.content | test("^185[.]199[.]10[89][.]153$|^185[.]199[.]11[01][.]153$"))) or (.type == "AAAA" and (.content | test("^2606:50c0:800[0-3]::153$")))))' <<<"$apex" >/dev/null
          echo 'Apex DNS access verified; web records point to GitHub Pages.'
          for page in swap dex; do
            curl -fsS --max-time 15 "https://climboria.fun/$page/" -o "/tmp/$page.baseline"
            grep -q 'data-climboria-managed-swap-panel' "/tmp/$page.baseline"
          done
          npx --yes wrangler@4.36.0 deploy --config dex/runtime-status/wrangler.toml
          changed=()
          rollback() {
            local code=$?
            if (( code != 0 )); then
              for id in "${changed[@]}"; do
                cf PATCH "zones/$zone/dns_records/$id" "$DNS_TOKEN" --data '{"proxied":false}' >/dev/null ||
                  echo "::error::Cannot restore one apex record; inspect Cloudflare DNS immediately."
              done
            fi
          }
          trap rollback EXIT
          while IFS= read -r id; do
            changed+=("$id")
            cf PATCH "zones/$zone/dns_records/$id" "$DNS_TOKEN" --data '{"proxied":true}' >/dev/null
          done < <(jq -r '.[] | select(.proxied == false) | .id' <<<"$apex")
          for attempt in {1..15}; do
            if curl -fsS --max-time 10 -D /tmp/status.headers https://climboria.fun/swap-runtime-status.json -o /tmp/status.body &&
               grep -Eiq '^cache-control:.*no-store' /tmp/status.headers &&
               jq -e '.enabled == false' /tmp/status.body >/dev/null; then
              break
            fi
            test "$attempt" -lt 15
            sleep 15
          done
          for page in swap dex; do
            curl -fsS --max-time 20 "https://climboria.fun/$page/" -o "/tmp/$page.live"
            grep -q 'data-climboria-managed-swap-panel' "/tmp/$page.live"
          done
          curl -fsS https://climboria.fun/swap-config.js | grep -Eq 'enabled:[[:space:]]*false'
          curl -fsS https://api.climboria.fun/health | jq -e '.execution == "disabled" and .configured.executionEnabled == false' >/dev/null
          echo 'Live endpoint HTTP 200, no-store, enabled:false. Swap and DEX serve the existing pages; execution remains disabled.'
