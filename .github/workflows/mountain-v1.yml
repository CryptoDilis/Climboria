name: Climboria Mountain V1

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mountain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upgrade mountain
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          marker = "climboria-mountain-v1"

          if marker in html:
              print("Mountain V1 already installed.")
              raise SystemExit(0)

          old = 'const cliff='
          pos = html.find(old)

          if pos == -1:
              raise SystemExit("ERROR: cliff definition not found.")

          html = html[:pos] + '''
          /* climboria-mountain-v1 */
          const mountainVisualMarker=true;
          ''' + html[pos:]

          path.write_text(html, encoding="utf-8")
          print("Mountain V1 installed.")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mountain V1"
          git push
