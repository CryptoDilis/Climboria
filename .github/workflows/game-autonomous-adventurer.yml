name: Game Autonomous Adventurer Foundation
on:
  push:
    paths: ['game/npc/**','.github/workflows/game-autonomous-adventurer.yml']
  pull_request:
    paths: ['game/npc/**','.github/workflows/game-autonomous-adventurer.yml']
permissions:
  contents: read
jobs:
  npc-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test game/npc/autonomous-adventurer.test.mjs
