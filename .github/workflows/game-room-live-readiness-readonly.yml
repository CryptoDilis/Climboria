name: GAME Room Readiness + Unauthorized Denials (No Secrets)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/game-room-live-readiness-readonly.yml"
      - "game/multiplayer/worker/qa-readiness-check.mjs"
      - "game/multiplayer/worker/qa-readiness-check.test.mjs"
      - "game/multiplayer/worker/qa-access-denial-check.mjs"
      - "game/multiplayer/worker/qa-access-denial-check.test.mjs"
      - "game/multiplayer/worker/qa-public-config-check.mjs"
      - "game/multiplayer/worker/qa-public-config-check.test.mjs"
      - "game/multiplayer/worker/staging-preflight.mjs"
      - "game/multiplayer/client-config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climboria-game-room-readonly-check
  cancel-in-progress: true

jobs:
  game-room-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Game source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify approved Game gateway readiness and no customer-funds execution
        run: |
          node --test game/multiplayer/worker/qa-readiness-check.test.mjs
          node game/multiplayer/worker/qa-readiness-check.mjs
      - name: Check deployed Game gateway configuration (may still be on previous Pages release)
        run: |
          node --test game/multiplayer/worker/qa-public-config-check.test.mjs
          node game/multiplayer/worker/qa-public-config-check.mjs
      - name: Check deployed Game ticket access-denial policy without credentials
        run: |
          node --test game/multiplayer/worker/qa-access-denial-check.test.mjs
          node game/multiplayer/worker/qa-access-denial-check.mjs
      # The intentionally rejected POST /ticket requests carry no tokens,
      # return 401/403 before ticket issuance or room state writes, and do not
      # open WebSockets, trade, modify Cloudflare or toggle Game multiplayer.
