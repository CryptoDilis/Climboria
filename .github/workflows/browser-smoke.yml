name: Climboria Browser Smoke Test

concurrency:
  group: climboria-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, codex/jarrell-natural-wilderness-pass, codex/mountain-stability-v2, codex/ten-summit-expedition, codex/hero-banga-mountain-results, fix/browser-smoke-homepage-check]
    paths:
      - "index.html"
      - "climboria-favicon.png"
      - "game/assets/music/TRACK_01.mp3"
      - "game/play.html"
      - "game/character-lab.html"
      - "game/index.html"
      - ".github/scripts/game-smoke.mjs"
      - ".github/scripts/mobile-reentry-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "climboria-favicon.png"
      - "game/assets/music/TRACK_01.mp3"
      - "game/play.html"
      - "game/character-lab.html"
      - "game/index.html"
      - ".github/scripts/game-smoke.mjs"
      - ".github/scripts/mobile-reentry-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast-fail smoke script syntax and saved-hero auto-entry contract
        run: |
          node --check .github/scripts/mobile-reentry-smoke.mjs
          node --check .github/scripts/game-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          game = Path("game/play.html").read_text(encoding="utf-8")
          mobile = Path(".github/scripts/mobile-reentry-smoke.mjs").read_text(encoding="utf-8")
          required_game = ["id=" + chr(34) + "player-card" + chr(34), "async function initChunks()", "function checkAllReady()", "function takeOver()"]
          required_test = ["#menuCreateHero", "noHeroMenu", "noGenerating"]
          missing = [item for item in required_game if item not in game] + [item for item in required_test if item not in mobile]
          if missing:
              raise SystemExit("Missing gameplay smoke contract: " + repr(missing))
          print("Fast preflight passed: JavaScript syntax and gameplay selectors.")
          PY

  browser-smoke:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: climboria-npm-node22-${{ runner.os }}-v1

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright
        timeout-minutes: 10
        run: |
          npm init -y
          timeout --signal=TERM --kill-after=20s 2m npm install --no-save playwright
          timeout --signal=TERM --kill-after=20s 4m npx playwright install chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/climboria-http.log
          exit 1

      - name: Test mobile Hub-to-game auto-entry and HUD visibility (3 consecutive runs)
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            echo "Mobile Hub-to-game smoke run $attempt/3"
            node .github/scripts/mobile-reentry-smoke.mjs
          done

      - name: Test homepage CTAs, DEX modal, and mobile navigation
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors=[];
            try {
              const page=await browser.newPage({viewport:{width:1365,height:900}});
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              if(!response?.ok()) throw new Error('Homepage HTTP load failed');
              const ctas=page.locator('.hero-buttons button');
              if(await ctas.count()!==3) throw new Error('Expected 3 hero CTA buttons');
              const labels=(await ctas.allTextContents()).map(s=>s.trim());
              if(!labels[0].includes('PLAY')||!labels[1].includes('SWAP')||!labels[2].includes('LAUNCHPAD')) throw new Error('Unexpected hero CTA labels: '+JSON.stringify(labels));
              await page.locator('#swapBtn').click();
              if(!await page.locator('#swapModal').evaluate(el=>el.classList.contains('active'))) throw new Error('DEX modal did not open');
              await page.locator('#closeSwap').click();
              if(await page.locator('#swapModal').evaluate(el=>el.classList.contains('active'))) throw new Error('DEX modal did not close');
              await page.screenshot({path:'climboria-desktop-home.png',fullPage:true});
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              mobile.on('pageerror',e=>errors.push('mobile: '+e.message));
              await mobile.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await mobile.locator('#hamburger').click();
              if(!await mobile.locator('#mobileMenu').evaluate(el=>el.classList.contains('active'))) throw new Error('Mobile menu did not open');
              const metrics=await mobile.evaluate(()=>({vw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth,ctas:document.querySelectorAll('.hero-buttons button').length}));
              if(metrics.sw>metrics.vw+2||metrics.ctas!==3) throw new Error('Mobile layout overflow/CTA check: '+JSON.stringify(metrics));
              await mobile.screenshot({path:'climboria-mobile-home.png',fullPage:true});
              if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
              console.log('PASS: homepage, 3 hero CTAs, DEX modal, mobile menu, and mobile width.');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Run Jarrell's Peak desktop and mobile gameplay smoke tests
        timeout-minutes: 21
        run: |
          echo 'Starting bounded Jarrell desktop/mobile gameplay smoke test.'
          timeout --signal=TERM --kill-after=30s 20m node .github/scripts/game-smoke.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climboria-browser-smoke-screenshots
          path: |
            climboria-desktop-home.png
            climboria-mobile-home.png
            climboria-character-creator.png
            climboria-mobile-menu-reentry.png
            climboria-desktop-gameplay.png
            climboria-mobile-gameplay.png
            freshwater-*.png
          if-no-files-found: warn
          retention-days: 7
