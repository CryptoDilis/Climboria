name: Climboria Browser Smoke Test

on:
  push:
    branches: [main, codex/mountain-stability-v2, codex/ten-summit-expedition, codex/hero-banga-mountain-results, codex/modular-code-generated-homepage]
    paths:
      - "index.html"
      - "favicon.png"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.png"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/climboria-http.log
          exit 1

      - name: Test landing screen, WebGL canvas, and level flow
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-webgl',
                '--ignore-gpu-blocklist'
              ]
            });
            const page = await browser.newPage({
              viewport: { width: 1365, height: 900 },
              deviceScaleFactor: 1
            });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));

            try {
              const response = await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
              if (!response || !response.ok()) {
                throw new Error('Landing page did not return a successful response.');
              }

              await page.waitForFunction(() => {
                const landing = document.getElementById('landing');
                const play = document.querySelector('[data-cd-action="play"], .cd-play-now');
                const legacy = document.getElementById('startButton');
                return !!landing && getComputedStyle(landing).display !== 'none' && (!!play || !!legacy);
              }, { timeout: 15000 });
              await page.waitForTimeout(2500);
              // Accept either the legacy approved full-page artwork or the modular
              // generated mountain layer. For the modular branch, verify that the
              // procedural canvas fills the viewport and the original character asset loads.
              const referenceCanvas = page.locator('#climboria-reference-canvas');
              await referenceCanvas.waitFor({ state: 'attached', timeout: 10000 });
              const referenceState = await referenceCanvas.evaluate(async el => {
                const rect = el.getBoundingClientRect();
                const generated = el.querySelector('#climboria-generated-mountain');
                const cutout = document.getElementById('climboriaHeroCutout');
                let cutoutOk = false;
                if (cutout && cutout.getAttribute('src')) {
                  cutoutOk = await new Promise(resolve => {
                    if (cutout.complete) return resolve(cutout.naturalWidth > 0);
                    cutout.addEventListener('load', () => resolve(cutout.naturalWidth > 0), { once: true });
                    cutout.addEventListener('error', () => resolve(false), { once: true });
                    setTimeout(() => resolve(false), 5000);
                  });
                }
                const style = getComputedStyle(el);
                const url = style.backgroundImage.match(/url\(["']?(.*?)["']?\)/)?.[1];
                let imageOk = false;
                if (url && url !== 'none') {
                  const response = await fetch(new URL(url, location.href));
                  if (response.ok) {
                    const blob = await response.blob();
                    imageOk = blob.size > 100000;
                  }
                }
                const generatedOk = !!generated && generated.width >= 100 && generated.height >= 100;
                return {
                  imageOk, generatedOk, cutoutOk,
                  backgroundImage: style.backgroundImage,
                  width: rect.width, height: rect.height,
                  generatedWidth: generated?.width || 0,
                  generatedHeight: generated?.height || 0
                };
              });
              const modularMode = referenceState.generatedOk;
              if ((!modularMode && !referenceState.imageOk) ||
                  referenceState.width < 100 || referenceState.height < 100 ||
                  (modularMode && !referenceState.cutoutOk)) {
                throw new Error('Homepage artwork/generated mountain failed to load or fit: ' + JSON.stringify(referenceState));
              }
              const bootFailure = await page.locator('#climboriaBootErrorMessage').textContent().catch(() => null);
              const visibleCanvasCount = await page.locator('canvas:visible').count();
              if (bootFailure || visibleCanvasCount === 0) {
                throw new Error('Game boot failed before WebGL canvas became visible. Boot overlay: ' +
                  (bootFailure || 'none') + '; page errors: ' + pageErrors.join(' | '));
              }
              await page.locator('canvas:visible').first().waitFor({ state: 'visible', timeout: 10000 });
              await page.screenshot({ path: 'climboria-landing.png', fullPage: true });

              const canvasSize = await page.locator('canvas:visible').first().evaluate(el => ({
                width: el.width,
                height: el.height,
                cssWidth: el.getBoundingClientRect().width,
                cssHeight: el.getBoundingClientRect().height
              }));
              if (canvasSize.width < 100 || canvasSize.height < 100 ||
                  canvasSize.cssWidth < 100 || canvasSize.cssHeight < 100) {
                throw new Error('Three.js canvas exists but has invalid dimensions: ' + JSON.stringify(canvasSize));
              }

              await page.evaluate(() => {
                const play = document.querySelector('[data-cd-action="play"], .cd-play-now');
                const legacy = document.getElementById('startButton');
                if (play) play.click();
                else if (legacy) legacy.click();
                else throw new Error('No Play/Start Climb control found');
              });
              await page.locator('#levelSelect').waitFor({ state: 'visible', timeout: 10000 });
              await page.screenshot({ path: 'climboria-level-select.png', fullPage: true });

              await page.locator('#level1Card').click();
              await page.waitForTimeout(2500);
              const uiState = await page.evaluate(() => {
                const ids = ['landing', 'levelSelect', 'hud', 'help', 'nav', 'status'];
                return Object.fromEntries(ids.map(id => {
                  const el = document.getElementById(id);
                  if (!el) return [id, null];
                  const cs = getComputedStyle(el);
                  const rect = el.getBoundingClientRect();
                  return [id, {
                    display: cs.display,
                    visibility: cs.visibility,
                    zIndex: cs.zIndex,
                    text: (el.innerText || '').trim().slice(0, 100),
                    rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
                  }];
                }));
              });
              console.log('Post-Level-1 UI state: ' + JSON.stringify(uiState));
              await page.screenshot({ path: 'climboria-gameplay.png', fullPage: false });

              if (uiState.hud?.display === 'none' || uiState.levelSelect?.display !== 'none') {
                throw new Error('Level 1 did not enter the expected gameplay UI state.');
              }

              const mobile = await browser.newPage({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true
              });
              mobile.on('pageerror', error => pageErrors.push('mobile: ' + error.message));
              await mobile.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
              await mobile.waitForFunction(() => {
                // On some mobile boot paths the landing shell is hidden before this
                // checkpoint. Accept either a visible landing CTA or the level-menu API,
                // then explicitly open level selection below.
                const landing = document.getElementById('landing');
                const play = document.querySelector('[data-cd-action="play"], .cd-play-now, #startButton');
                return (!!landing && !!play) || typeof window.showLevelSelect === 'function';
              }, { timeout: 20000 });
              await mobile.waitForTimeout(2500);
              // Check the reference asset directly. The landing root is transient during
              // responsive/game boot, so do not re-query it as a second condition here.
              const mobileReferenceState = await mobile.evaluate(async () => {
                const response = await fetch(new URL('./climboria-homepage.png', location.href));
                const blob = response.ok ? await response.blob() : null;
                const landing = document.getElementById('landing');
                const rect = landing?.getBoundingClientRect();
                return {
                  imageOk: !!blob && blob.size > 100000,
                  imageStatus: response.status,
                  landingPresentAtCheck: !!landing,
                  landingWidth: rect ? rect.width : 0,
                  landingHeight: rect ? rect.height : 0
                };
              });
              if (!mobileReferenceState.imageOk) {
                throw new Error('Approved homepage reference asset failed on mobile: ' +
                  JSON.stringify(mobileReferenceState));
              }
              console.log('Mobile reference asset check: ' + JSON.stringify(mobileReferenceState));
              const mobileBootFailure = await mobile.locator('#climboriaBootErrorMessage').textContent().catch(() => null);
              const mobileCanvasCount = await mobile.locator('canvas:visible').count();
              if (mobileBootFailure || mobileCanvasCount === 0) {
                throw new Error('Mobile game boot failed before WebGL canvas became visible. Boot overlay: ' +
                  (mobileBootFailure || 'none') + '; page errors: ' + pageErrors.join(' | '));
              }
              await mobile.locator('canvas:visible').first().waitFor({ state: 'visible', timeout: 10000 });
              await mobile.evaluate(() => {
                const play = document.querySelector('[data-cd-action="play"], .cd-play-now');
                const legacy = document.getElementById('startButton');
                const visibleLanding = document.getElementById('landing') &&
                  getComputedStyle(document.getElementById('landing')).display !== 'none';
                if (visibleLanding && play) play.click();
                else if (visibleLanding && legacy) legacy.click();
                else if (typeof window.showLevelSelect === 'function') window.showLevelSelect();
                else throw new Error('Neither a visible landing CTA nor showLevelSelect() is available');
              });
              await mobile.locator('#levelSelect').waitFor({ state: 'visible', timeout: 10000 });
              const landingHiddenInMenu = await mobile.evaluate(() =>
                getComputedStyle(document.getElementById('landing')).display === 'none'
              );
              if (!landingHiddenInMenu) {
                throw new Error('Mobile landing overlay remains visible over the level-selection screen.');
              }
              const mobileLevelSelect = await mobile.evaluate(() => {
                const bounds = selector => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  return { left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width) };
                };
                return {
                  viewportWidth: document.documentElement.clientWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  panel: bounds('#levelSelect .panel'),
                  firstCard: bounds('#level1Card'),
                  lastCard: bounds('#level10Card')
                };
              });
              console.log('Mobile level-select bounds: ' + JSON.stringify(mobileLevelSelect));
              if (mobileLevelSelect.documentWidth > mobileLevelSelect.viewportWidth + 2 ||
                  !mobileLevelSelect.panel ||
                  mobileLevelSelect.panel.left < -2 ||
                  mobileLevelSelect.panel.right > mobileLevelSelect.viewportWidth + 2 ||
                  !mobileLevelSelect.firstCard ||
                  mobileLevelSelect.firstCard.left < -2 ||
                  mobileLevelSelect.firstCard.right > mobileLevelSelect.viewportWidth + 2) {
                throw new Error('Mobile level-select layout exceeds viewport bounds: ' + JSON.stringify(mobileLevelSelect));
              }
              await mobile.screenshot({ path: 'climboria-mobile-level-select.png' });
              await mobile.locator('#level1Card').click();
              await mobile.waitForTimeout(1000);
              const mobileState = await mobile.evaluate(() => ({
                landingDisplay: getComputedStyle(document.getElementById('landing')).display,
                hudDisplay: getComputedStyle(document.getElementById('hud')).display,
                levelSelectDisplay: getComputedStyle(document.getElementById('levelSelect')).display,
                canvas: (() => {
                  const c = Array.from(document.querySelectorAll('canvas')).find(el => {
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                });
                  return { width: c?.width || 0, height: c?.height || 0 };
                })()
              }));
              const mobileLayout = await mobile.evaluate(() => ({
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                hud: (() => {
                  const el = document.getElementById('hud');
                  const r = el?.getBoundingClientRect();
                  return r ? { left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width) } : null;
                })(),
                levelSelect: (() => {
                  const el = document.getElementById('levelSelect');
                  const r = el?.getBoundingClientRect();
                  return r ? { left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width) } : null;
                })()
              }));
              console.log('Mobile layout bounds: ' + JSON.stringify(mobileLayout));
              if (mobileLayout.documentWidth > mobileLayout.viewportWidth + 2) {
                throw new Error('Mobile layout has horizontal overflow: ' + JSON.stringify(mobileLayout));
              }
              console.log('Mobile gameplay state: ' + JSON.stringify(mobileState));
              await mobile.screenshot({ path: 'climboria-mobile-gameplay.png' });
              if (mobileState.landingDisplay !== 'none' || mobileState.hudDisplay === 'none' ||
                  mobileState.levelSelectDisplay !== 'none' ||
                  mobileState.canvas.width < 100 || mobileState.canvas.height < 100) {
                throw new Error('Mobile gameplay did not reach the expected state.');
              }
              await mobile.close();
              // Release the desktop WebGL page before the final expedition test.
              // Keeping multiple software-rendered WebGL pages alive can starve Chromium on CI.
              await page.close();

              // Ten-summit progression: use the game's public menu API instead of
              // depending on the landing CTA being visible in a fresh CI context.
              // This isolates the level-unlock/launch test from unrelated landing layout.
              const expedition = await browser.newPage({
                viewport: { width: 1280, height: 800 },
                deviceScaleFactor: 1
              });
              expedition.on('pageerror', error => pageErrors.push('expedition: ' + error.message));
              await expedition.addInitScript(() => {
                if (location.origin === 'http://127.0.0.1:4173') {
                  localStorage.setItem('climboria_unlocked_level', '10');
                }
              });
              await expedition.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
              await expedition.waitForFunction(() =>
                typeof window.showLevelSelect === 'function' &&
                typeof window.startLevel === 'function',
                { timeout: 20000 }
              );
              const unlocked = await expedition.evaluate(() => ({
                saved: localStorage.getItem('climboria_unlocked_level'),
                landingDisplay: getComputedStyle(document.getElementById('landing')).display,
                levelSelectDisplay: getComputedStyle(document.getElementById('levelSelect')).display
              }));
              console.log('Expedition boot state: ' + JSON.stringify(unlocked));
              if (unlocked.saved !== '10') {
                throw new Error('Expedition save did not load level 10 unlock: ' + JSON.stringify(unlocked));
              }
              await expedition.evaluate(() => window.showLevelSelect());
              await expedition.locator('#levelSelect').waitFor({ state: 'visible', timeout: 10000 });
              const summitCount = await expedition.locator('.levelCard[data-level]').count();
              if (summitCount !== 10) {
                throw new Error('Expected 10 summit cards, found ' + summitCount);
              }
              await expedition.locator('#level10Card').click();
              await expedition.waitForFunction(() => {
                const hud = document.getElementById('hud');
                const name = document.getElementById('hudLevelName')?.innerText || '';
                return !!hud && getComputedStyle(hud).display !== 'none' && name.includes('WORLD PEAK');
              }, { timeout: 15000 });
              const finalLevelName = await expedition.locator('#hudLevelName').innerText();
              console.log('PASS: all 10 summit cards render and Level 10 launches: ' + finalLevelName);
              await expedition.close();

              if (pageErrors.length) {
                throw new Error('Uncaught browser errors: ' + pageErrors.join(' | '));
              }

              console.log('PASS: desktop and mobile landing, WebGL canvas, level selection, and Level 1 launch.');
              console.log('Desktop canvas dimensions: ' + JSON.stringify(canvasSize));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climboria-browser-smoke-screenshots
          path: |
            climboria-landing.png
            climboria-level-select.png
            climboria-gameplay.png
            climboria-mobile-level-select.png
            climboria-mobile-gameplay.png
          if-no-files-found: warn
          retention-days: 7
