      - name: Test DEX mobile workspace tabs and desktop regression
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const mobile = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors=[];
              mobile.on('pageerror',error=>errors.push(error.message));
              const response=await mobile.goto('http://127.0.0.1:4173/dex/',{waitUntil:'domcontentloaded'});
              if(!response?.ok()) throw new Error('Mobile DEX route failed to load');
              await mobile.locator('#dexMobileNav').waitFor({state:'visible',timeout:10000});
              if(await mobile.locator('#evmMarkets').isVisible())throw new Error('Base market explorer should not stack below Solana by default on mobile');
              if(!await mobile.locator('#markets').isVisible())throw new Error('Solana markets should be the default mobile DEX view');
              const mobileNav=mobile.locator('#dexMobileNav');
              if(await mobileNav.evaluate(el=>getComputedStyle(el).position)!=='fixed')throw new Error('DEX mobile navigation must stay fixed at the bottom');
              await mobileNav.locator('[data-dex-mobile-view="base"]').tap();
              if(!await mobile.locator('#evmMarkets').isVisible()||await mobile.locator('#markets').isVisible())throw new Error('Base mobile view must replace, not stack under, Solana markets');
              await mobileNav.locator('[data-dex-mobile-view="solana"]').tap();
              await mobile.locator('#tokenDetail').evaluate(el=>{el.classList.add('open');document.body.classList.add('mobile-token-view')});
              if(await mobile.locator('#dexMobileNav').isVisible()||!await mobile.locator('#tokenDetail').isVisible())throw new Error('Selected-token view should replace market explorer and main mobile navigation');
              const chartContext=await mobile.evaluate(()=>({overview:getComputedStyle(document.querySelector('.chart-overview')).display,metrics:getComputedStyle(document.querySelector('.chart-overview .detail-metrics')).display,columns:getComputedStyle(document.querySelector('.chart-overview .detail-metrics')).gridTemplateColumns.split(' ').length,marketNav:getComputedStyle(document.querySelector('#dexMobileNav')).display,detailNav:getComputedStyle(document.querySelector('#detailMobileTabs')).position}));
              if(chartContext.overview==='none'||chartContext.metrics!=='grid'||chartContext.columns!==2)throw new Error('Mobile chart must show four provider-backed metrics in a compact 2x2 strip: '+JSON.stringify(chartContext));
              if(chartContext.marketNav!=='none'||chartContext.detailNav!=='fixed')throw new Error('Mobile token detail must show only its single fixed detail navigation: '+JSON.stringify(chartContext));
              const tabs=mobile.locator('#detailMobileTabs');
              const workspace=mobile.locator('#detailWorkspace');
              if(!await tabs.isVisible()) throw new Error('Mobile DEX tablist is not visible');
              const cases=[
                {name:'chart',button:'#detailTabChart',visible:'.detail-main',hidden:'.dex-trade-terminal'},
                {name:'trade',button:'#detailTabTrade',visible:'.dex-trade-terminal',hidden:'.token-community'},
                {name:'chat',button:'#detailTabChat',visible:'.token-community',hidden:'.dex-trade-terminal'},
                {name:'pools',button:'#detailTabPools',visible:'.trailmap',hidden:'.token-community'}
              ];
              async function assertTab(item){
                const button=mobile.locator(item.button);
                if(await button.getAttribute('aria-selected')!=='true'||await button.getAttribute('tabindex')!=='0') throw new Error(item.name+' tab ARIA selection/focus state is incorrect');
                if(await workspace.getAttribute('aria-labelledby')!==await button.getAttribute('id')) throw new Error(item.name+' tab is not associated with the workspace panel');
                if(!await workspace.locator(item.visible).first().isVisible()) throw new Error(item.name+' panel content is not visible: '+item.visible);
                if(await workspace.locator(item.hidden).first().isVisible()) throw new Error(item.name+' panel is showing content from another tab: '+item.hidden);
                for(const other of cases){if(other.name!==item.name&&await mobile.locator(other.button).getAttribute('aria-selected')==='true')throw new Error('Multiple DEX tabs are selected');}
              }
              for(const item of cases){await mobile.locator(item.button).tap();await assertTab(item);}
              await mobile.locator('#detailTabChart').focus();
              await mobile.keyboard.press('ArrowRight');
              await assertTab(cases[1]);
              await mobile.keyboard.press('ArrowLeft');
              await assertTab(cases[0]);
              await mobile.keyboard.press('End');
              await assertTab(cases[3]);
              await mobile.keyboard.press('Home');
              await assertTab(cases[0]);
              if(await workspace.locator('.signalbox').count()!==1) throw new Error('Pools tab signal panel missing');
              if(errors.length) throw new Error('Mobile DEX tab JavaScript errors: '+errors.join(' | '));

              const desktop=await browser.newPage({viewport:{width:1365,height:900}});
              desktop.on('pageerror',error=>errors.push(error.message));
              const desktopResponse=await desktop.goto('http://127.0.0.1:4173/dex/',{waitUntil:'domcontentloaded'});
              if(!desktopResponse?.ok()) throw new Error('Desktop DEX route failed to load');
              await desktop.locator('#tokenDetail').evaluate(el=>el.classList.add('open'));
              if(await desktop.locator('#detailMobileTabs').isVisible()) throw new Error('Mobile-only DEX tabs leaked into desktop layout');
              for(const selector of ['.detail-main','.dex-trade-terminal','.token-community']){
                if(!await desktop.locator('#detailWorkspace '+selector).first().isVisible()) throw new Error('Desktop workspace column is hidden: '+selector);
              }
              if(errors.length) throw new Error('DEX tab regression browser errors: '+errors.join(' | '));
              console.log('PASS DEX mobile Chart/Trade/Chat/Pools touch, panel visibility, ARIA, arrow/Home/End keyboard navigation, and desktop three-column regression.');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
