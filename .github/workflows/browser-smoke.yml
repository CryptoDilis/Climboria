      - name: Test standalone DEX market and quote-preview shell
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:1365,height:900}});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              const response=await page.goto('http://127.0.0.1:4173/dex/',{waitUntil:'domcontentloaded'});
              if(!response?.ok()) throw new Error('Local DEX route failed to load');
              if(!await page.locator('#markets').count()) throw new Error('Market explorer missing');
              for(const selector of ['#search','#refresh','#connectWallet','#getQuote','#quoteAmount']) {
                if(await page.locator(selector).count()!==1) throw new Error('Missing DEX control: '+selector);
              }
              const heading=await page.locator('h1').first().innerText();
              if(!heading.toLowerCase().includes('solana')) throw new Error('Unexpected DEX page heading: '+heading);
              if(errors.length) throw new Error('DEX browser errors: '+errors.join(' | '));
              // Verify DEX token/pool selection is represented in browser history.
              const mint='So11111111111111111111111111111111111111112';
              const poolA='11111111111111111111111111111111';
              const poolB='22222222222222222222222222222222';
              const poolData={pairs:[
                {chainId:'solana',dexId:'pool-a',pairAddress:poolA,baseToken:{address:mint,name:'Test Solana',symbol:'TST'},quoteToken:{address:'EPjFWdd5AufqSSqeM2q8xzybapC8G4wEGGkZwyTDt1v',symbol:'USDC'},liquidity:{usd:200000},volume:{h24:50000},priceUsd:'1',priceChange:{h24:1},txns:{h24:{buys:10,sells:5}},info:{websites:[{label:'Website',url:'https://climboria.fun'}],socials:[{type:'twitter',url:'https://x.com/ClimboriaHQ'}]}},
                {chainId:'solana',dexId:'pool-b',pairAddress:poolB,baseToken:{address:mint,name:'Test Solana',symbol:'TST'},quoteToken:{address:'So11111111111111111111111111111111111111112',symbol:'SOL'},liquidity:{usd:100000},volume:{h24:25000},priceUsd:'1',priceChange:{h24:0.5},txns:{h24:{buys:6,sells:3}}}
              ]};
              await page.route('https://api.dexscreener.com/**',route=>{
                const url=route.request().url();
                if(url.includes('/latest/dex/tokens/')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(poolData)});
                if(url.includes('/latest/dex/search')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(poolData)});
                if(url.includes('/token-profiles/latest/v1')) return route.fulfill({status:200,contentType:'application/json',body:'[]'});
                if(url.includes('/tokens/v1/solana/')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(poolData.pairs)});
                return route.fulfill({status:200,contentType:'application/json',body:'{}'});
              });
              await page.goto('http://127.0.0.1:4173/dex/?token='+mint,{waitUntil:'domcontentloaded'});
              // Token Intelligence social actions must remain inside the card, beneath the title/metrics row.
              await page.locator('#detailSocialRail a').first().waitFor({state:'visible',timeout:15000});
              const socialLayout=await page.evaluate(()=>{
                const card=document.querySelector('#tokenDetail'),rail=document.querySelector('#detailSocialRail'),heading=card?.querySelector('.detail-heading');
                if(!card||!rail||!heading)return null;
                const c=card.getBoundingClientRect(),r=rail.getBoundingClientRect(),titleRow=card.querySelector('.detail-name-row')?.getBoundingClientRect();
                return {cardRight:c.right,railRight:r.right,titleRowBottom:titleRow?.bottom,railTop:r.top,links:[...rail.querySelectorAll('a')].map(a=>({label:a.innerText.trim(),href:a.href}))};
              });
              if(!socialLayout||socialLayout.links.length!==2) throw new Error('Token Intelligence social links did not render from provider metadata: '+JSON.stringify(socialLayout));
              if(socialLayout.railRight>socialLayout.cardRight+1||socialLayout.railTop<socialLayout.titleRowBottom-1) throw new Error('Token social action rail escaped the card or overlapped title/metrics: '+JSON.stringify(socialLayout));
              await page.screenshot({path:'climboria-dex-token-socials.png',fullPage:true});
              await page.setViewportSize({width:390,height:844});
              await page.waitForTimeout(150);
              const mobileSocialLayout=await page.evaluate(()=>{
                const card=document.querySelector('#tokenDetail'),rail=document.querySelector('#detailSocialRail');
                if(!card||!rail)return null;
                const c=card.getBoundingClientRect(),r=rail.getBoundingClientRect();
                return {viewport:innerWidth,cardLeft:c.left,cardRight:c.right,railLeft:r.left,railRight:r.right,railWidth:r.width,cardWidth:c.width};
              });
              if(!mobileSocialLayout||mobileSocialLayout.railLeft<mobileSocialLayout.cardLeft-1||mobileSocialLayout.railRight>mobileSocialLayout.cardRight+1) throw new Error('Mobile token social rail escaped Token Intelligence card: '+JSON.stringify(mobileSocialLayout));
              await page.screenshot({path:'climboria-dex-token-socials-mobile.png',fullPage:true});
              await page.setViewportSize({width:1365,height:900});
              await page.locator('#detailPairs button[data-pool="'+poolB+'"]').waitFor({state:'visible',timeout:15000});
              if(new URL(page.url()).searchParams.get('pool')!==poolA) throw new Error('DEX initial token selection did not persist its best pool in URL');
              await page.evaluate(pool=>{const u=new URL(location.href);u.searchParams.set('pool',pool);history.pushState({climboriaDex:true},'',u);},poolA);
              await page.locator('#detailPairs button[data-pool="'+poolB+'"]').click();
              if(new URL(page.url()).searchParams.get('pool')!==poolB) throw new Error('DEX pool selection did not update URL');
              await page.goBack();
              await page.waitForFunction(pool=>new URL(location.href).searchParams.get('pool')===pool,poolA,{timeout:10000});
              await page.waitForFunction(pool=>document.querySelector('#detailPairs .routecandidate.selected')?.dataset.pair===pool,poolA,{timeout:10000}).catch(async error=>{const state=await page.evaluate(()=>({url:location.href,rows:[...document.querySelectorAll('#detailPairs .routecandidate')].map(x=>({pair:x.dataset.pair,selected:x.classList.contains('selected')})),title:document.querySelector('#detailTitle')?.textContent}));throw new Error('DEX Back selected-pool restore diagnostic: '+JSON.stringify(state)+'; '+error.message)});
              await page.goForward();
              await page.waitForFunction(pool=>new URL(location.href).searchParams.get('pool')===pool,poolB,{timeout:10000});
              await page.waitForFunction(pool=>document.querySelector('#detailPairs .routecandidate.selected')?.dataset.pair===pool,poolB,{timeout:10000}).catch(async error=>{const state=await page.evaluate(()=>({url:location.href,activeMint:window.activeDetailMint||null,rows:[...document.querySelectorAll('#detailPairs .routecandidate')].map(x=>({pair:x.dataset.pair,selected:x.classList.contains('selected')})),title:document.querySelector('#detailTitle')?.textContent}));throw new Error('DEX Forward selected-pool restore diagnostic: '+JSON.stringify(state)+'; '+error.message)});
              if(errors.length) throw new Error('DEX history browser errors: '+errors.join(' | '));
              console.log('PASS local DEX route, market explorer, search, wallet and quote-preview controls; token/pool URL and browser back/forward restore.');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Test DEX mobile workspace tabs and desktop regression
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const mobile = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors=[];
              mobile.on('pageerror',error=>errors.push(error.message));
              const response=await mobile.goto('http://127.0.0.1:4173/dex/',{waitUntil:'domcontentloaded'});
              if(!response?.ok()) throw new Error('Mobile DEX route failed to load');
              await mobile.locator('#tokenDetail').evaluate(el=>el.classList.add('open'));
              const tabs=mobile.locator('#detailMobileTabs');
              const workspace=mobile.locator('#detailWorkspace');
              if(!await tabs.isVisible()) throw new Error('Mobile DEX tablist is not visible');
              const cases=[
                {name:'chart',button:'#detailTabChart',visible:'.detail-main',hidden:'.dex-trade-terminal'},
                {name:'trade',button:'#detailTabTrade',visible:'.dex-trade-terminal',hidden:'.token-community'},
                {name:'chat',button:'#detailTabChat',visible:'.token-community',hidden:'.dex-trade-terminal'},
                {name:'pools',button:'#detailTabPools',visible:'.trailmap',hidden:'.token-community'}
              ];
              async function assertTab(item){
                const button=mobile.locator(item.button);
                if(await button.getAttribute('aria-selected')!=='true'||await button.getAttribute('tabindex')!=='0') throw new Error(item.name+' tab ARIA selection/focus state is incorrect');
                if(await workspace.getAttribute('aria-labelledby')!==await button.getAttribute('id')) throw new Error(item.name+' tab is not associated with the workspace panel');
                if(!await workspace.locator(item.visible).first().isVisible()) throw new Error(item.name+' panel content is not visible: '+item.visible);
                if(await workspace.locator(item.hidden).first().isVisible()) throw new Error(item.name+' panel is showing content from another tab: '+item.hidden);
                for(const other of cases){if(other.name!==item.name&&await mobile.locator(other.button).getAttribute('aria-selected')==='true')throw new Error('Multiple DEX tabs are selected');}
              }
              for(const item of cases){await mobile.locator(item.button).tap();await assertTab(item);}
              await mobile.locator('#detailTabChart').focus();
              await mobile.keyboard.press('ArrowRight');
              await assertTab(cases[1]);
              await mobile.keyboard.press('ArrowLeft');
              await assertTab(cases[0]);
              await mobile.keyboard.press('End');
              await assertTab(cases[3]);
              await mobile.keyboard.press('Home');
              await assertTab(cases[0]);
              if(await workspace.locator('.signalbox').count()!==1) throw new Error('Pools tab signal panel missing');
              if(errors.length) throw new Error('Mobile DEX tab JavaScript errors: '+errors.join(' | '));

              const desktop=await browser.newPage({viewport:{width:1365,height:900}});
              desktop.on('pageerror',error=>errors.push(error.message));
              const desktopResponse=await desktop.goto('http://127.0.0.1:4173/dex/',{waitUntil:'domcontentloaded'});
              if(!desktopResponse?.ok()) throw new Error('Desktop DEX route failed to load');
              await desktop.locator('#tokenDetail').evaluate(el=>el.classList.add('open'));
              if(await desktop.locator('#detailMobileTabs').isVisible()) throw new Error('Mobile-only DEX tabs leaked into desktop layout');
              for(const selector of ['.detail-main','.dex-trade-terminal','.token-community']){
                if(!await desktop.locator('#detailWorkspace '+selector).first().isVisible()) throw new Error('Desktop workspace column is hidden: '+selector);
              }
              if(errors.length) throw new Error('DEX tab regression browser errors: '+errors.join(' | '));
              console.log('PASS DEX mobile Chart/Trade/Chat/Pools touch, panel visibility, ARIA, arrow/Home/End keyboard navigation, and desktop three-column regression.');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

