name: Climboria Browser Smoke Test

concurrency:
  group: climboria-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, codex/jarrell-natural-wilderness-pass, codex/mountain-stability-v2, codex/ten-summit-expedition, codex/hero-banga-mountain-results, fix/browser-smoke-homepage-check]
    paths:
      - "index.html"
      - "dex/**"
      - "climboria-favicon.png"
      - "game/assets/music/TRACK_01.mp3"
      - "game/play.html"
      - "game/index.html"
      - ".github/scripts/game-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "dex/**"
      - "climboria-favicon.png"
      - "game/assets/music/TRACK_01.mp3"
      - "game/play.html"
      - ".github/scripts/game-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright
        timeout-minutes: 10
        run: |
          npm init -y
          timeout --signal=TERM --kill-after=20s 2m npm install --no-save playwright
          timeout --signal=TERM --kill-after=20s 4m npx playwright install chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/climboria-http.log
          exit 1

      - name: Test homepage CTAs, DEX routing, and mobile navigation
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors=[];
            try {
              const page=await browser.newPage({viewport:{width:1365,height:900}});
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              if(!response?.ok()) throw new Error('Homepage HTTP load failed');
              const ctas=page.locator('.hero-buttons button');
              if(await ctas.count()!==3) throw new Error('Expected 3 hero CTA buttons');
              const labels=(await ctas.allTextContents()).map(s=>s.trim());
              if(!labels[0].includes('PLAY')||!labels[1].includes('SWAP')||!labels[2].includes('LAUNCHPAD')) throw new Error('Unexpected hero CTA labels: '+JSON.stringify(labels));
              await page.screenshot({path:'climboria-desktop-home.png',fullPage:true});
              for (const selector of ['#dexNavLink','#mobileDexBtn']) {
                const href=await page.locator(selector).getAttribute('href');
                if(href!=='/dex/') throw new Error(selector+' must route to /dex/, got '+href);
              }
              await Promise.all([page.waitForURL('**/dex/'),page.locator('#swapBtn').click()]);
              if(new URL(page.url()).pathname!=='/dex/') throw new Error('Homepage SWAP CTA did not navigate to /dex/');
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              mobile.on('pageerror',e=>errors.push('mobile: '+e.message));
              await mobile.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await mobile.locator('#hamburger').click();
              if(!await mobile.locator('#mobileMenu').evaluate(el=>el.classList.contains('active'))) throw new Error('Mobile menu did not open');
              const metrics=await mobile.evaluate(()=>({vw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth,ctas:document.querySelectorAll('.hero-buttons button').length}));
              if(metrics.sw>metrics.vw+2||metrics.ctas!==3) throw new Error('Mobile layout overflow/CTA check: '+JSON.stringify(metrics));
              const mobileDexHref=await mobile.locator('#mobileDexBtn').getAttribute('href');
              if(mobileDexHref!=='/dex/') throw new Error('Mobile DEX link must route to /dex/, got '+mobileDexHref);
              const mobileDexLabel=(await mobile.locator('#mobileDexBtn').innerText()).trim();
              if(!mobileDexLabel.includes('SUMMIT RADAR')||/demo only/i.test(mobileDexLabel)) throw new Error('Mobile DEX menu still presents as demo-only: '+mobileDexLabel);
              const launchpadLabel=(await mobile.locator('#mobileLaunchpadBtn').innerText()).trim();
              if(!/demo only/i.test(launchpadLabel)) throw new Error('Launchpad must remain clearly marked demo-only until operational: '+launchpadLabel);
              await mobile.screenshot({path:'climboria-mobile-home.png',fullPage:true});
              await Promise.all([mobile.waitForURL('**/dex/'),mobile.locator('#mobileDexBtn').click()]);
              if(new URL(mobile.url()).pathname!=='/dex/') throw new Error('Mobile DEX navigation did not reach /dex/');
              if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
              console.log('PASS: homepage, 3 hero CTAs, desktop/mobile DEX routing, mobile menu, and mobile width.');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Test Cloudflare DEX swap proxy
        run: node --test dex/swap-proxy/test/worker.test.mjs

      - name: Verify DEX execution stays fail-closed without secure backend
        run: |
          node <<'JS'
          const fs=require('fs');
          const page=fs.readFileSync('dex/index.html','utf8');
          const readiness=fs.readFileSync('dex/EXECUTION_READINESS.md','utf8');
          if(/JUPITER_API_KEY|x-api-key/i.test(page)) throw new Error('A Jupiter API credential/header must never be exposed in the public DEX page');
          if(!/quote-only/i.test(page)||!/Swap execution is not enabled/i.test(page)) throw new Error('DEX must clearly disclose quote-only status');
          if(!/CLIMBORIA_SWAP_CONFIG/.test(page)||!/enabled===true/.test(page)) throw new Error('Swap execution must remain disabled by default until backend verification');
          if(!/signTransaction/.test(page)||!/VersionedTransaction\.deserialize/.test(page)||!/requestId/.test(page)||!/status==='Success'/.test(page)) throw new Error('Wallet-reviewed Jupiter Order/Execute flow is incomplete');
          if(/JUPITER_API_KEY|x-api-key/i.test(page)) throw new Error('Public DEX must not contain provider credentials');
          for(const term of ['taker','requestId','/execute','Devnet','private key','seed phrase']) if(!readiness.includes(term)) throw new Error('Execution readiness document missing: '+term);
          console.log('PASS: public DEX exposes no Jupiter credential; wallet signing and execution require explicit backend feature enablement; security gates documented.');
          JS

      - name: Test standalone DEX market and quote-preview shell
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:1365,height:900}});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              const response=await page.goto('http://127.0.0.1:4173/dex/',{waitUntil:'domcontentloaded'});
              if(!response?.ok()) throw new Error('Local DEX route failed to load');
              if(!await page.locator('#markets').count()) throw new Error('Market explorer missing');
              for(const selector of ['#search','#refresh','#connectWallet','#getQuote','#quoteAmount']) {
                if(await page.locator(selector).count()!==1) throw new Error('Missing DEX control: '+selector);
              }
              const heading=await page.locator('h1').first().innerText();
              if(!heading.toLowerCase().includes('solana')) throw new Error('Unexpected DEX page heading: '+heading);
              if(errors.length) throw new Error('DEX browser errors: '+errors.join(' | '));
              console.log('PASS local DEX route, market explorer, search, wallet and quote-preview controls.');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Run Jarrell's Peak desktop and mobile gameplay smoke tests
        timeout-minutes: 21
        run: |
          echo 'Starting bounded Jarrell desktop/mobile gameplay smoke test.'
          timeout --signal=TERM --kill-after=30s 20m node .github/scripts/game-smoke.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climboria-browser-smoke-screenshots
          path: |
            climboria-desktop-home.png
            climboria-mobile-home.png
            climboria-desktop-gameplay.png
            climboria-mobile-gameplay.png
            climboria-desktop-cave-entrance.png
            climboria-mobile-cave-entrance.png
            climboria-desktop-cave-interior.png
            climboria-mobile-cave-interior.png
            freshwater-*.png
          if-no-files-found: warn
          retention-days: 7
