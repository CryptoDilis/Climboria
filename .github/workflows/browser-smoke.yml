name: Climboria Browser Smoke Test

on:
  push:
    branches: [main, codex/mountain-stability-v2, codex/ten-summit-expedition]
    paths:
      - "index.html"
      - "favicon.png"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/climboria-http.log
          exit 1

      - name: Test landing screen, WebGL canvas, and level flow
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-webgl',
                '--ignore-gpu-blocklist'
              ]
            });
            const page = await browser.newPage({
              viewport: { width: 1365, height: 900 },
              deviceScaleFactor: 1
            });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));

            try {
              const response = await page.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
              if (!response || !response.ok()) {
                throw new Error('Landing page did not return a successful response.');
              }

              await page.getByRole('button', { name: /start climb/i }).waitFor({ timeout: 15000 });
              await page.locator('canvas').waitFor({ state: 'visible', timeout: 20000 });
              await page.screenshot({ path: 'climboria-landing.png', fullPage: true });

              const canvasSize = await page.locator('canvas').evaluate(el => ({
                width: el.width,
                height: el.height,
                cssWidth: el.getBoundingClientRect().width,
                cssHeight: el.getBoundingClientRect().height
              }));
              if (canvasSize.width < 100 || canvasSize.height < 100 ||
                  canvasSize.cssWidth < 100 || canvasSize.cssHeight < 100) {
                throw new Error('Three.js canvas exists but has invalid dimensions: ' + JSON.stringify(canvasSize));
              }

              await page.getByRole('button', { name: /start climb/i }).click();
              await page.locator('#levelSelect').waitFor({ state: 'visible', timeout: 10000 });
              await page.screenshot({ path: 'climboria-level-select.png', fullPage: true });

              await page.locator('#level1Card').click();
              await page.waitForTimeout(2500);
              const uiState = await page.evaluate(() => {
                const ids = ['landing', 'levelSelect', 'hud', 'help', 'nav', 'status'];
                return Object.fromEntries(ids.map(id => {
                  const el = document.getElementById(id);
                  if (!el) return [id, null];
                  const cs = getComputedStyle(el);
                  const rect = el.getBoundingClientRect();
                  return [id, {
                    display: cs.display,
                    visibility: cs.visibility,
                    zIndex: cs.zIndex,
                    text: (el.innerText || '').trim().slice(0, 100),
                    rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
                  }];
                }));
              });
              console.log('Post-Level-1 UI state: ' + JSON.stringify(uiState));
              await page.screenshot({ path: 'climboria-gameplay.png', fullPage: false });

              if (uiState.hud?.display === 'none' || uiState.levelSelect?.display !== 'none') {
                throw new Error('Level 1 did not enter the expected gameplay UI state.');
              }

              const mobile = await browser.newPage({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true
              });
              mobile.on('pageerror', error => pageErrors.push('mobile: ' + error.message));
              await mobile.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
              await mobile.getByRole('button', { name: /start climb/i }).waitFor({ timeout: 15000 });
              await mobile.locator('canvas').waitFor({ state: 'visible', timeout: 20000 });
              await mobile.getByRole('button', { name: /start climb/i }).click();
              await mobile.locator('#levelSelect').waitFor({ state: 'visible', timeout: 10000 });
              await mobile.locator('#level1Card').click();
              await mobile.waitForTimeout(1000);
              const mobileState = await mobile.evaluate(() => ({
                hudDisplay: getComputedStyle(document.getElementById('hud')).display,
                levelSelectDisplay: getComputedStyle(document.getElementById('levelSelect')).display,
                canvas: (() => {
                  const c = document.querySelector('canvas');
                  return { width: c?.width || 0, height: c?.height || 0 };
                })()
              }));
              console.log('Mobile gameplay state: ' + JSON.stringify(mobileState));
              await mobile.screenshot({ path: 'climboria-mobile-gameplay.png' });
              if (mobileState.hudDisplay === 'none' || mobileState.levelSelectDisplay !== 'none' ||
                  mobileState.canvas.width < 100 || mobileState.canvas.height < 100) {
                throw new Error('Mobile gameplay did not reach the expected state.');
              }
              await mobile.close();

              // Ten-summit progression: preload a fully unlocked save and verify Level 10 can launch.
              const expedition = await browser.newPage({
                viewport: { width: 1280, height: 800 },
                deviceScaleFactor: 1
              });
              expedition.on('pageerror', error => pageErrors.push('expedition: ' + error.message));
              await expedition.addInitScript(() => localStorage.setItem('climboria_unlocked_level', '10'));
              await expedition.goto('http://127.0.0.1:4173/', {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
              await expedition.getByRole('button', { name: /start climb/i }).click();
              await expedition.locator('#levelSelect').waitFor({ state: 'visible', timeout: 10000 });
              const summitCount = await expedition.locator('.levelCard[data-level]').count();
              if (summitCount !== 10) {
                throw new Error('Expected 10 summit cards, found ' + summitCount);
              }
              await expedition.locator('#level10Card').click();
              await expedition.waitForTimeout(1200);
              const finalLevelName = await expedition.locator('#hudLevelName').innerText();
              if (!finalLevelName.includes('WORLD PEAK')) {
                throw new Error('Level 10 did not launch correctly: ' + finalLevelName);
              }
              console.log('PASS: all 10 summit cards render and Level 10 launches: ' + finalLevelName);
              await expedition.close();

              if (pageErrors.length) {
                throw new Error('Uncaught browser errors: ' + pageErrors.join(' | '));
              }

              console.log('PASS: desktop and mobile landing, WebGL canvas, level selection, and Level 1 launch.');
              console.log('Desktop canvas dimensions: ' + JSON.stringify(canvasSize));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climboria-browser-smoke-screenshots
          path: |
            climboria-landing.png
            climboria-level-select.png
            climboria-gameplay.png
            climboria-mobile-gameplay.png
          if-no-files-found: warn
          retention-days: 7
