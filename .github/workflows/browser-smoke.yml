name: Climboria Browser Smoke Test

on:
  push:
    branches: [main, codex/mountain-stability-v2, codex/ten-summit-expedition, codex/hero-banga-mountain-results]
    paths:
      - "index.html"
      - "favicon.png"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/climboria-http.log
          exit 1

      - name: Test landing screen, WebGL canvas, and level flow
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            try {
              const desktop = await browser.newPage({ viewport: { width: 1365, height: 900 } });
              desktop.on('pageerror', e => errors.push(e.message));
              const response = await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
              if (!response || !response.ok()) throw new Error('Homepage failed to load.');

              await desktop.locator('.hero').waitFor({ state: 'visible', timeout: 10000 });
              const actions = desktop.locator('#climboria-home-actions button');
              await actions.first().waitFor({ state: 'visible', timeout: 10000 });
              const labels = await actions.allTextContents();
              if (labels.length !== 3 || !labels[0].includes('PLAY') ||
                  !labels[1].includes('SWAP') || !labels[2].includes('LAUNCHPAD')) {
                throw new Error('Expected the three homepage CTAs (PLAY, SWAP/DEX, LAUNCHPAD): ' + JSON.stringify(labels));
              }
              for (let i = 0; i < 3; i++) {
                const box = await actions.nth(i).boundingBox();
                if (!box || box.width < 60 || box.height < 30) throw new Error('Homepage CTA ' + i + ' is not visibly rendered.');
              }
              await desktop.screenshot({ path: 'climboria-desktop-home.png', fullPage: true });

              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
              mobile.on('pageerror', e => errors.push('mobile: ' + e.message));
              await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
              await mobile.locator('#climboria-home-actions button').first().waitFor({ state: 'visible', timeout: 10000 });
              const mobileMetrics = await mobile.evaluate(() => ({
                viewport: document.documentElement.clientWidth,
                pageWidth: document.documentElement.scrollWidth,
                ctaCount: document.querySelectorAll('#climboria-home-actions button').length
              }));
              if (mobileMetrics.pageWidth > mobileMetrics.viewport + 2 || mobileMetrics.ctaCount !== 3) {
                throw new Error('Mobile homepage layout check failed: ' + JSON.stringify(mobileMetrics));
              }
              await mobile.screenshot({ path: 'climboria-mobile-home.png', fullPage: true });
              if (errors.length) throw new Error('Browser JavaScript errors: ' + errors.join(' | '));
              console.log('PASS: homepage loads; all three CTAs render on desktop and mobile; no mobile horizontal overflow.');
              console.log('Mobile metrics: ' + JSON.stringify(mobileMetrics));
              await mobile.close();
              await desktop.close();
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climboria-browser-smoke-screenshots
          path: |
            climboria-landing.png
            climboria-level-select.png
            climboria-gameplay.png
            climboria-mobile-level-select.png
            climboria-mobile-gameplay.png
          if-no-files-found: warn
          retention-days: 7
