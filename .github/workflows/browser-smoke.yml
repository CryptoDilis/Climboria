name: Climboria Browser Smoke Test

concurrency:
  group: climboria-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, codex/jarrell-natural-wilderness-pass, codex/mountain-stability-v2, codex/ten-summit-expedition, codex/hero-banga-mountain-results, fix/browser-smoke-homepage-check]
    paths:
      - "index.html"
      - "dex/**"
      - "swap/**"
      - "launchpad/**"
      - "climboria-favicon.png"
      - "game/assets/music/TRACK_01.mp3"
      - "game/play.html"
      - "game/index.html"
      - ".github/scripts/game-smoke.mjs"
      - ".github/scripts/dex-base-search-smoke.mjs"
      - ".github/scripts/dex-chart-selection-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "dex/**"
      - "swap/**"
      - "launchpad/**"
      - "swap-config.js"
      - "climboria-favicon.png"
      - "game/assets/music/TRACK_01.mp3"
      - "game/play.html"
      - ".github/scripts/game-smoke.mjs"
      - ".github/scripts/dex-base-search-smoke.mjs"
      - ".github/scripts/dex-chart-selection-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright
        timeout-minutes: 10
        run: |
          npm init -y
          timeout --signal=TERM --kill-after=20s 2m npm install --no-save playwright
          timeout --signal=TERM --kill-after=20s 4m npx playwright install chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/climboria-http.log
          exit 1

      - name: Test Supabase auth UI and cloud-save account isolation
        run: node .github/scripts/auth-cloud-save-smoke.mjs

      - name: Test homepage CTAs, DEX routing, and mobile navigation
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors=[];
            try {
              const page=await browser.newPage({viewport:{width:1365,height:900}});
              page.on('pageerror',e=>errors.push('PAGEERROR '+page.url()+' :: '+e.name+' :: '+e.message+' :: '+String(e.stack)));
              page.on('console',m=>{if(m.type()==='error'){const message=m.text();if(message.includes('pls.dexscreener.com/api/event')||m.location().url.includes('pls.dexscreener.com')||(m.location().url.startsWith('https://pumpdata.fun/graduations/')&&message.includes('404'))||message.includes('Permissions policy violation: unload is not allowed in this document'))return;errors.push('CONSOLE '+page.url()+' :: '+message+' :: '+JSON.stringify(m.location()));}});
              const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              if(!response?.ok()) throw new Error('Homepage HTTP load failed');
              const ctas=page.locator('.hero-buttons button');
              if(await ctas.count()!==3) throw new Error('Expected 3 hero CTA buttons');
              const labels=(await ctas.allTextContents()).map(s=>s.trim());
              if(!labels[0].includes('PLAY')||!labels[1].includes('DEX')||!labels[2].includes('LAUNCHPAD')) throw new Error('Unexpected hero CTA labels: '+JSON.stringify(labels));
              await page.screenshot({path:'climboria-desktop-home.png',fullPage:true});
              for (const selector of ['#dexNavLink','#mobileDexBtn']) {
                const href=await page.locator(selector).getAttribute('href');
                if(href!=='/dex/') throw new Error(selector+' must route to /dex/, got '+href);
              }
              await Promise.all([page.waitForURL('**/dex/'),page.locator('#swapBtn').click()]);
              if(new URL(page.url()).pathname!=='/dex/') throw new Error('Homepage DEX CTA did not navigate to /dex/');
              const dexPage=page;
              if(!await dexPage.locator('#markets').count()) throw new Error('DEX CTA did not open the market explorer');
              // Let the page's initial market bootstrap finish before the isolated search fixture.
              // Otherwise a late boot response can overwrite the search response in state.pairs.
              await dexPage.waitForFunction(() => {
                const status=document.querySelector('#status')?.textContent||'';
                return status==='Live provider connection · Solana pairs only' || status==='Market data temporarily unavailable';
              },null,{timeout:15000}).catch(async error=>{
                const diagnostics=await dexPage.evaluate(()=>({status:document.querySelector('#status')?.textContent,coverage:document.querySelector('#coverage')?.textContent,updated:document.querySelector('#updated')?.textContent}));
                throw new Error('DEX initial market bootstrap did not settle before search fixture: '+JSON.stringify(diagnostics)+' cause='+error.message);
              });
              // Verify live DEX search discovers tokens outside the boot-time market sample by name/symbol and exact mint.
              const dexMint='SysvarRent111111111111111111111111111111111';
              const dexPair={chainId:'solana',dexId:'search-fixture',pairAddress:'DexSearchPair11111111111111111111111111111',baseToken:{address:dexMint,symbol:'CLIMBTEST',name:'Climboria Search Fixture'},quoteToken:{address:'So11111111111111111111111111111111111111112',symbol:'SOL',name:'Solana'},priceUsd:'0.125',priceChange:{h24:4.2},volume:{h24:45678},liquidity:{usd:23456}};
              const dexSearchRequests=[];
              dexPage.on('request',request=>{if(request.url().includes('/latest/dex/search'))dexSearchRequests.push(request.url())});
              await dexPage.route(/https:\/\/api\.dexscreener\.com\/latest\/dex\/search(?:\?.*)?$/,async route=>{
                const url=new URL(route.request().url());
                if(url.searchParams.get('q')==='CLIMBTEST'){console.log('Intercepted DEX fixture search:',url.href);return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({pairs:[dexPair]})});}
                return route.continue();
              });
              await dexPage.route('https://api.dexscreener.com/latest/dex/tokens/**',async route=>{
                const mint=decodeURIComponent(new URL(route.request().url()).pathname.split('/').pop()||'');
                if(mint===dexMint)return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({pairs:[dexPair]})});
                return route.continue();
              });
              // Keep Pump metadata local to the browser fixture; production CORS must not be weakened for localhost tests.
              await dexPage.route('https://api.climboria.fun/api/pump/coin**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({mint:dexMint,name:'Climboria Search Fixture',symbol:'CLIMBTEST',complete:false,source:'browser-smoke-fixture'})}));
              await dexPage.locator('#search').fill('CLIMBTEST');
              const dexSearchResponse=await dexPage.waitForResponse(response=>{const url=new URL(response.url());return url.pathname==='/latest/dex/search'&&url.searchParams.get('q')==='CLIMBTEST'},{timeout:10000}).catch(()=>null);
              if(!dexSearchResponse){const diagnostics=await dexPage.evaluate(()=>({input:document.querySelector('#search')?.value,status:document.querySelector('#status')?.textContent,coverage:document.querySelector('#coverage')?.textContent,rows:document.querySelector('#rows')?.innerText,handler:typeof window.discoverDexSearch}));throw new Error('DEX name search request did not complete. Requests='+JSON.stringify(dexSearchRequests)+' UI='+JSON.stringify(diagnostics)+' pageErrors='+JSON.stringify(errors));}
              if(!dexSearchResponse.ok())throw new Error('DEX name search fixture returned HTTP '+dexSearchResponse.status());
              await dexPage.waitForFunction(()=>document.querySelector('#rows')?.innerText.includes('CLIMBTEST'),null,{timeout:5000}).catch(async error=>{const diagnostics=await dexPage.evaluate(()=>({input:document.querySelector('#search')?.value,status:document.querySelector('#status')?.textContent,coverage:document.querySelector('#coverage')?.textContent,rows:document.querySelector('#rows')?.innerText}));throw new Error('DEX name search response succeeded but row did not render. UI='+JSON.stringify(diagnostics)+' requests='+JSON.stringify(dexSearchRequests)+' cause='+error.message)});
              if(!(await dexPage.locator('#rows').innerText()).includes(dexMint.slice(0,5)))throw new Error('DEX name/symbol search did not return the provider-discovered token mint');
              await dexPage.locator('#search').fill(dexMint);
              await dexPage.waitForFunction(mint=>document.querySelector('#rows')?.innerText.includes(mint.slice(0,5)),dexMint,{timeout:12000});
              const exactRow=dexPage.locator('#rows button[data-mint="'+dexMint+'"]');
              if(await exactRow.count()!==1)throw new Error('DEX exact contract-address search did not return the exact base-token mint');
              await exactRow.click();
              await dexPage.waitForFunction(pair=>document.querySelector('#detailChart')?.src.includes(pair),dexPair.pairAddress,{timeout:12000});
              const chartUrl=new URL(await dexPage.locator('#detailChart').getAttribute('src'));
              if(chartUrl.searchParams.get('chartStyle')!=='1'||chartUrl.searchParams.get('interval')!=='15')throw new Error('DEX chart must default to visible 15-minute candlesticks: '+chartUrl.href);
              if(!(await dexPage.locator('#detailTitle').innerText()).includes('CLIMBTEST'))throw new Error('DEX chart detail did not match the exact searched token');
              await dexPage.goto('http://127.0.0.1:4173/swap/',{waitUntil:'domcontentloaded'});
              for (const selector of ['#connectWallet','#getQuote','#prepareSwap','#quoteAmount']) if(await page.locator(selector).count()!==1) throw new Error('Missing standalone Swap control: '+selector);
              // Major asset buttons must be plain clickable rows with no hover "SELECT" overlay.
              await page.goto('http://127.0.0.1:4173/swap/',{waitUntil:'domcontentloaded'});
              const swapViewport=await page.evaluate(()=>({width:innerWidth,mobile:matchMedia('(max-width:760px)').matches,workspace:document.querySelector('.premium-trade-layout')?.className,rail:getComputedStyle(document.querySelector('.market-rail')).display,nav:!!document.querySelector('#mobileWorkspaceTabs')&&getComputedStyle(document.querySelector('#mobileWorkspaceTabs')).display}));
              if(swapViewport.mobile)await page.locator('#mobileWorkspaceTabs [data-workspace-tab="market"]').click();
              try{await page.locator('#majorCoins .major-row').first().waitFor({state:'visible',timeout:15000});}
              catch(error){const state=await page.evaluate(()=>({width:innerWidth,mobile:matchMedia('(max-width:760px)').matches,workspace:document.querySelector('.premium-trade-layout')?.className,rail:getComputedStyle(document.querySelector('.market-rail')).display,major:getComputedStyle(document.querySelector('#majorCoins .major-row')).display,majorText:document.querySelector('#majorCoins')?.innerText}));throw new Error('Major asset market row failed to become visible. Initial='+JSON.stringify(swapViewport)+' current='+JSON.stringify(state)+' cause='+error.message)}
              const mockMint='SysvarRent111111111111111111111111111111111';
              const mockPair={chainId:'solana',dexId:'test-dex',pairAddress:'9xQeWvG816bUx9EPjHmaT23yvVM5d4X3q9hYkZ8f9xQe',baseToken:{address:mockMint,symbol:'BTC',name:'Bitcoin'},quoteToken:{address:'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',symbol:'USDC',name:'USD Coin'},priceUsd:'65000',priceChange:{h24:2.5},volume:{h24:123456},marketCap:1200000000,liquidity:{usd:100000}};
              const btcSearchFixture=[{id:mockMint,symbol:'BTC',name:'Bitcoin (wrapped representation)',decimals:8,isVerified:true},{id:'11111111111111111111111111111111',symbol:'BTC',name:'Alternate BTC representation',decimals:8,isVerified:false}];
              // Match the proxy endpoint independent of query-string ordering/encoding. The live config intentionally routes searches through Cloudflare.
              let btcProxySearchIntercepted=false;
              const btcSearchRequests=[];
              page.on('request',request=>{if(request.url().includes('/api/tokens/search')||request.url().includes('/tokens/v2/search'))btcSearchRequests.push(request.url());});
              await page.route('**/*tokens/search**',async route=>{
                const requestUrl=new URL(route.request().url());
                if(requestUrl.searchParams.get('query')!=='BTC')return route.continue();
                btcProxySearchIntercepted=true;
                console.log('Intercepted BTC token search:',requestUrl.origin+requestUrl.pathname);
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(btcSearchFixture)});
              });
              // Keep quote-preview requests deterministic and same-origin-safe in browser tests; production CORS is tested separately.
              await page.route('https://api.climboria.fun/api/swap/quote**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({inAmount:'10000000',outAmount:'1234567',priceImpactPct:0.001,feeBps:0,router:'Jupiter fixture'})}));
              // Direct Jupiter is only the fallback when the proxy is explicitly disabled.
              await page.route('https://api.jup.ag/tokens/v2/search**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(btcSearchFixture)}));
              const quoteOnlyMint='SysvarC1ock11111111111111111111111111111111';
              const quoteOnlyPair={...mockPair,pairAddress:'QuoteOnlyPair111111111111111111111111111111',baseToken:{address:'So11111111111111111111111111111111111111112',symbol:'SOL',name:'Solana'},quoteToken:{address:quoteOnlyMint,symbol:'QONLY',name:'Quote Only'},priceUsd:'1.25'};
              await page.route('https://api.dexscreener.com/latest/dex/tokens/**',async route=>{
                const requestedMint=decodeURIComponent(new URL(route.request().url()).pathname.split('/').pop()||'');
                if(requestedMint===quoteOnlyMint)return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({pairs:[quoteOnlyPair]})});
                if(requestedMint==='NoPoolMint11111111111111111111111111111111')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({pairs:[]})});
                if(requestedMint==='SlowAsset11111111111111111111111111111111') { await new Promise(resolve=>setTimeout(resolve,700)); return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({pairs:[{...mockPair,pairAddress:'SlowAssetPair111111111111111111111111111111',baseToken:{address:requestedMint,symbol:'SLOW',name:'Slow Asset'},priceUsd:'0.01'}]})}); }
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({pairs:[mockPair]})});
              });
              await page.route('https://api.mainnet-beta.solana.com',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({jsonrpc:'2.0',id:1,result:{value:{decimals:8,amount:'100000000'}}})}));
              await page.route('https://solana-rpc.publicnode.com',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({jsonrpc:'2.0',id:1,result:{value:{decimals:8,amount:'100000000'}}})}));
              await page.route('https://rpc.ankr.com/solana',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({jsonrpc:'2.0',id:1,result:{value:{decimals:8,amount:'100000000'}}})}));
              const btc=page.locator('#majorCoins .major-row[data-major-symbol="BTC"]');
              if(await btc.count()!==1) throw new Error('BTC major asset button missing');
              const hoverLabel=await btc.evaluate(el=>getComputedStyle(el,'::after').content);
              if(hoverLabel!=='none'&&hoverLabel!=='normal') throw new Error('Major asset hover overlay must be absent, got '+hoverLabel);
              await btc.click();
              try{await page.locator('#fromResults button[data-index="0"]').waitFor({state:'visible',timeout:10000});}catch(error){const diagnostics=await page.evaluate(()=>({input:document.querySelector('#quoteFromSearch')?.value,results:document.querySelector('#fromResults')?.innerText,config:window.CLIMBORIA_SWAP_CONFIG,selected:document.querySelector('#fromSelected')?.innerText}));throw new Error('BTC token candidates did not render. ProxyIntercepted='+btcProxySearchIntercepted+' requests='+JSON.stringify(btcSearchRequests)+' ui='+JSON.stringify(diagnostics)+' cause='+error.message);}
              if(!btcProxySearchIntercepted)throw new Error('BTC search did not use the configured Cloudflare proxy route; check swap-config.js and token-search URL selection.');
              const candidateUi=await page.locator('#fromResults button[data-index="0"]').evaluate(el=>({cursor:getComputedStyle(el).cursor,tabIndex:el.tabIndex,mintWrap:getComputedStyle(el.querySelector('small')).overflowWrap,cardWidth:el.getBoundingClientRect().width,listWidth:el.parentElement.getBoundingClientRect().width}));
              if(candidateUi.cursor!=='pointer'||candidateUi.tabIndex!==0||candidateUi.mintWrap!=='anywhere'||candidateUi.cardWidth>candidateUi.listWidth+1) throw new Error('Token candidate card accessibility/wrapping/overlap check failed: '+JSON.stringify(candidateUi));
              if(await page.locator('#quoteFromSearch').inputValue()!=='BTC') throw new Error('Clicking BTC did not open BTC input token candidates');
              if(new URL(page.url()).searchParams.get('from')==='') throw new Error('Swap URL lost its current input mint while candidates load');
              if(await page.locator('#fromResults button').count()!==2) throw new Error('Expected multiple explicit BTC representation choices');
              await page.waitForFunction(()=>document.querySelector('#fromSelected')?.textContent.includes('Selection required')&&document.querySelector('#selectedAssetTitle')?.textContent.startsWith('SOL'),null,{timeout:15000});
              const preChoice=await page.evaluate(()=>({input:document.querySelector('#quoteFromSearch')?.value,selected:document.querySelector('#fromSelected')?.textContent,chartTitle:document.querySelector('#selectedAssetTitle')?.textContent})); if(preChoice.input!=='BTC'||!preChoice.selected.includes('Selection required')||!preChoice.chartTitle.startsWith('SOL')) throw new Error('Ambiguous BTC candidate was silently selected without explicit mint choice: '+JSON.stringify(preChoice));
              await page.locator('#fromResults button[data-index="0"]').click();
              await page.waitForFunction(()=>new URL(location.href).searchParams.get('from')==='SysvarRent111111111111111111111111111111111',null,{timeout:10000});
              if(await page.locator('#quoteFromSearch').inputValue()!=='BTC') throw new Error('Explicit BTC token choice did not select BTC as the input asset');
              const selectedMint=new URL(page.url()).searchParams.get('from');
              if(selectedMint!==mockMint) throw new Error('Explicit BTC token choice did not persist the exact selected token mint URL');
              await page.waitForFunction(()=>document.querySelector('#selectedAssetChart')?.src.includes('9xQeWvG816bUx9EPjHmaT23yvVM5d4X3q9hYkZ8f9xQe'),null,{timeout:10000});
              if(!(await page.locator('#selectedAssetTitle').innerText()).startsWith('BTC')||!(await page.locator('#selectedAssetPrice').innerText()).includes('65,000')) throw new Error('Selected BTC chart title/price did not match the explicitly selected mint');
              // A pool where the selected mint is only the quote side must never show the base token's (e.g. SOL) chart or metrics.
              await page.evaluate(()=>window.updateSelectedAsset({id:'SysvarC1ock11111111111111111111111111111111',symbol:'QONLY',name:'Quote Only'}));
              await page.waitForFunction(()=>document.querySelector('#selectedAssetNote')?.textContent.includes('No Solana pool with this exact mint'),null,{timeout:10000});
              const quoteOnlyState=await page.evaluate(()=>({title:document.querySelector('#selectedAssetTitle')?.textContent,price:document.querySelector('#selectedAssetPrice')?.textContent,chart:document.querySelector('#selectedAssetChart')?.getAttribute('src'),emptyHidden:document.querySelector('#selectedChartEmpty')?.hidden}));
              if(!quoteOnlyState.title.startsWith('QONLY')||quoteOnlyState.price!=='—'||quoteOnlyState.chart||quoteOnlyState.emptyHidden) throw new Error('Quote-side-only pool incorrectly displayed another asset chart or stale metrics: '+JSON.stringify(quoteOnlyState));
              await page.evaluate(()=>window.updateSelectedAsset({id:'SysvarRent111111111111111111111111111111111',symbol:'BTC',name:'Bitcoin'}));
              await page.waitForFunction(()=>document.querySelector('#selectedAssetChart')?.src.includes('9xQeWvG816bUx9EPjHmaT23yvVM5d4X3q9hYkZ8f9xQe'),null,{timeout:10000});
              // A true no-pool response must clear every stale chart metric and iframe.
              await page.evaluate(()=>window.updateSelectedAsset({id:'NoPoolMint11111111111111111111111111111111',symbol:'NOPool',name:'No Pool Asset'}));
              await page.waitForFunction(()=>document.querySelector('#selectedAssetNote')?.textContent.includes('No Solana pool with this exact mint'),null,{timeout:10000});
              const noPoolState=await page.evaluate(()=>({title:document.querySelector('#selectedAssetTitle')?.textContent,price:document.querySelector('#selectedAssetPrice')?.textContent,change:document.querySelector('#selectedAssetChange')?.textContent,volume:document.querySelector('#selectedAssetVolume')?.textContent,mcap:document.querySelector('#selectedAssetMcap')?.textContent,liquidity:document.querySelector('#selectedAssetLiquidity')?.textContent,venue:document.querySelector('#selectedAssetVenue')?.textContent,chart:document.querySelector('#selectedAssetChart')?.getAttribute('src'),emptyHidden:document.querySelector('#selectedChartEmpty')?.hidden}));
              if(!noPoolState.title.startsWith('NOPool')||noPoolState.price!=='—'||noPoolState.change!=='—'||noPoolState.volume!=='—'||noPoolState.mcap!=='—'||noPoolState.liquidity!=='—'||noPoolState.venue!=='—'||noPoolState.chart||noPoolState.emptyHidden) throw new Error('No-pool selection retained stale chart data: '+JSON.stringify(noPoolState));
              await page.evaluate(()=>window.updateSelectedAsset({id:'SysvarRent111111111111111111111111111111111',symbol:'BTC',name:'Bitcoin'}));
              await page.waitForFunction(()=>document.querySelector('#selectedAssetChart')?.src.includes('9xQeWvG816bUx9EPjHmaT23yvVM5d4X3q9hYkZ8f9xQe'),null,{timeout:10000});
              // Rapid selection race: a slower earlier asset response must not overwrite the latest BTC selection.
              await page.evaluate(()=>window.updateSelectedAsset({id:'SlowAsset11111111111111111111111111111111',symbol:'SLOW',name:'Slow Asset'}));
              await page.evaluate(()=>window.updateSelectedAsset({id:'SysvarRent111111111111111111111111111111111',symbol:'BTC',name:'Bitcoin'}));
              await page.waitForFunction(()=>document.querySelector('#selectedAssetChart')?.src.includes('9xQeWvG816bUx9EPjHmaT23yvVM5d4X3q9hYkZ8f9xQe'),null,{timeout:10000});
              await page.waitForTimeout(850);
              const rapidSelectionState=await page.evaluate(()=>({title:document.querySelector('#selectedAssetTitle')?.textContent,price:document.querySelector('#selectedAssetPrice')?.textContent,chart:document.querySelector('#selectedAssetChart')?.getAttribute('src')}));
              if(!rapidSelectionState.title.startsWith('BTC')||!rapidSelectionState.price.includes('65,000')||!rapidSelectionState.chart?.includes('9xQeWvG816bUx9EPjHmaT23yvVM5d4X3q9hYkZ8f9xQe')) throw new Error('A stale slow asset response overwrote the latest BTC chart/metrics: '+JSON.stringify(rapidSelectionState));
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('#quoteFromSearch')?.value==='BTC',null,{timeout:10000});
              if(await page.locator('#quoteFromSearch').inputValue()!=='BTC'||new URL(page.url()).searchParams.get('from')!==selectedMint) throw new Error('Selected major asset did not restore after page refresh');
              // Exercise the same popstate restoration handler deterministically; third-party chart loads must not affect browser history timing.
              await page.evaluate(()=>{const u=new URL(location.href);u.searchParams.set('from','So11111111111111111111111111111111111111112');history.pushState({climboriaSwap:true},'',u);dispatchEvent(new PopStateEvent('popstate'));});
              await page.waitForFunction(()=>document.querySelector('#quoteFromSearch')?.value==='SOL'&&new URL(location.href).searchParams.get('from')==='So11111111111111111111111111111111111111112',null,{timeout:15000});
              if(await page.locator('#quoteFromSearch').inputValue()!=='SOL') throw new Error('Swap popstate restoration did not restore SOL input');
              await page.evaluate(mint=>{const u=new URL(location.href);u.searchParams.set('from',mint);history.pushState({climboriaSwap:true},'',u);dispatchEvent(new PopStateEvent('popstate'));},selectedMint);
              await page.waitForFunction(mint=>document.querySelector('#quoteFromSearch')?.value==='BTC'&&new URL(location.href).searchParams.get('from')===mint,selectedMint,{timeout:15000});
              if(await page.locator('#quoteFromSearch').inputValue()!=='BTC'||new URL(page.url()).searchParams.get('from')!==selectedMint) throw new Error('Swap popstate restoration did not restore selected exact BTC mint');
              // Real mobile touch acceptance: every Major Asset stays visible, has no SELECT overlay, and BTC responds to a tap.
              const mobileSwap=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              mobileSwap.on('pageerror',e=>errors.push('MOBILE SWAP PAGEERROR '+mobileSwap.url()+' :: '+e.name+' :: '+e.message+' :: '+String(e.stack)));
              mobileSwap.on('console',m=>{if(m.type()==='error'){const message=m.text();if(message.includes('pls.dexscreener.com/api/event')||m.location().url.includes('pls.dexscreener.com')||(m.location().url.startsWith('https://pumpdata.fun/graduations/')&&message.includes('404'))||message.includes('Permissions policy violation: unload is not allowed in this document'))return;errors.push('MOBILE SWAP CONSOLE '+mobileSwap.url()+' :: '+message+' :: '+JSON.stringify(m.location()));}});
