              await empty.waitForFunction(()=>document.querySelector('#premiumTrendingGrid .premium-trending-empty')?.textContent.includes('No eligible Solana tokens'),null,{timeout:10000});
              await empty.close();
              console.log('PASS live profile/boost discovery, batched pair validation, volume ranking, token navigation, provider outage and true-empty behavior.');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
