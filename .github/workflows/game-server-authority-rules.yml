name: Game Server Authority Rules

on:
  pull_request:
    branches: [main]
    paths:
      - "game/multiplayer/server-authority-rules.mjs"
      - "game/multiplayer/server-authority-rules.test.mjs"
      - "game/multiplayer/world-drop-claim-preview.mjs"
      - "game/multiplayer/world-drop-claim-preview.test.mjs"
      - "game/multiplayer/server-combat-state.mjs"
      - "game/multiplayer/server-combat-state.test.mjs"
      - "game/multiplayer/presence-room.mjs"
      - "game/multiplayer/presence-room.test.mjs"
      - "game/multiplayer/open-world-melee-policy.mjs"
      - "game/multiplayer/open-world-melee-policy.test.mjs"
      - "game/multiplayer/server-collision-region.mjs"
      - "game/multiplayer/server-collision-region.test.mjs"
      - "game/multiplayer/jarrell-cave-wall-inventory.mjs"
      - "game/multiplayer/jarrell-cave-wall-inventory.test.mjs"
      - "game/multiplayer/jarrell-terrain-reference.mjs"
      - "game/multiplayer/jarrell-terrain-reference.test.mjs"
      - "game/multiplayer/server-ground-movement.mjs"
      - "game/multiplayer/server-ground-movement.test.mjs"
      - "game/multiplayer/server-hp-lifecycle.mjs"
      - "game/multiplayer/server-hp-lifecycle.test.mjs"
      - "game/multiplayer/server-combat-checkpoint.mjs"
      - "game/multiplayer/server-combat-checkpoint.test.mjs"
      - "game/multiplayer/jarrell-cave-wall-sweep.mjs"
      - "game/multiplayer/jarrell-cave-wall-sweep.test.mjs"
      - "game/multiplayer/jarrell-ceiling-geometry.mjs"
      - "game/multiplayer/jarrell-ceiling-geometry.test.mjs"
      - "game/multiplayer/jarrell-dry-region-prototype.mjs"
      - "game/multiplayer/jarrell-dry-region-prototype.test.mjs"
      - "game/multiplayer/transactional-room-prototype.mjs"
      - "game/multiplayer/transactional-room-prototype.test.mjs"
      - "game/multiplayer/worker/transactional-gateway-preview.mjs"
      - "game/multiplayer/worker/transactional-gateway-preview.test.mjs"
      - "game/multiplayer/worker/preview-ticket-store.mjs"
      - "game/multiplayer/worker/preview-ticket-store.test.mjs"
      - "game/multiplayer/worker/preview-worker.mjs"
      - "game/multiplayer/worker/preview-worker.test.mjs"
      - "game/multiplayer/worker/wrangler.preview.toml"
      - "game/multiplayer/worker/preview-websocket-lifecycle.test.mjs"
      - "game/play.html"
      - ".github/workflows/game-server-authority-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-policy-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert no client-authoritative combat/loot or unsafe spawn PvP
        run: node --test game/multiplayer/*.test.mjs game/multiplayer/worker/transactional-gateway-preview.test.mjs game/multiplayer/worker/preview-ticket-store.test.mjs game/multiplayer/worker/preview-worker.test.mjs game/multiplayer/worker/preview-websocket-lifecycle.test.mjs
