name: Game wallet ownership offline proof
on:
  push:
    paths: ['game/wallet-proof/**','.github/workflows/game-wallet-proof.yml']
  pull_request:
    paths: ['game/wallet-proof/**','.github/workflows/game-wallet-proof.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact direct test dependencies without lifecycle scripts
        run: npm install --prefix game/wallet-proof --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ethers@6.11.1 siwe@3.0.0
      - name: Run isolated signed-message and durable replay tests
        run: node --test game/wallet-proof/offline-store.test.mjs
