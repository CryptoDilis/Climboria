name: CLIMB Bridge Read-Only Safety Tests
on:
  pull_request:
    paths:
      - 'token/climb-bridge/**'
      - '.github/workflows/climb-bridge-safety-tests.yml'
  push:
    branches: [main]
    paths:
      - 'token/climb-bridge/**'
      - '.github/workflows/climb-bridge-safety-tests.yml'
permissions:
  contents: read
jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate no-deploy rules, dual-RPC mint fixtures and BigInt accounting
        run: node --test token/climb-bridge/*.test.mjs
