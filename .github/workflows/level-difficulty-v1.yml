name: Climboria Level Difficulty V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  difficulty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install difficulty engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          if 'id="climboria-difficulty-v1"' in html:
              print("Difficulty V1 already installed.")
              raise SystemExit(0)

          target = "function createGrips(){"

          if target not in html:
              raise SystemExit(
                  "ERROR: createGrips() not found."
              )

          difficulty = r"""
          /*
           * ==========================================================
           * CLIMBORIA PROGRESSIVE DIFFICULTY ENGINE V1
           * ==========================================================
           */

          if(typeof window.climboriaLevel==="undefined"){
            window.climboriaLevel=1;
          }

          function getClimbDifficulty(){

            const level=Math.max(
              1,
              Number(window.climboriaLevel||1)
            );

            /*
             * Level 1 = 0 difficulty
             * Level 20+ approaches maximum difficulty.
             */
            const intensity=
              THREE.MathUtils.clamp(
                (level-1)/19,
                0,
                1
              );

            return {

              level:level,

              intensity:intensity,

              /*
               * Horizontal grip difficulty.
               */
              horizontalSpread:
                THREE.MathUtils.lerp(
                  .85,
                  1.35,
                  intensity
                ),

              /*
               * Vertical gap difficulty.
               */
              verticalSpacing:
                THREE.MathUtils.lerp(
                  2.0,
                  3.25,
                  intensity
                ),

              /*
               * Recovery probability.
               *
               * Early game:
               * 100% recovery factor
               *
               * High levels:
               * approaches 25%
               */
              recovery:
                THREE.MathUtils.lerp(
                  1.0,
                  .25,
                  intensity
                )
            };
          }

          window.getClimbDifficulty=
            getClimbDifficulty;

          function updateClimboriaDifficulty(){

            const d=
              getClimbDifficulty();

            console.log(
              "CLIMBORIA LEVEL:",
              d.level
            );

            console.log(
              "DIFFICULTY:",
              Math.round(
                d.intensity*100
              )+"%"
            );

            console.log(
              "RECOVERY:",
              Math.round(
                d.recovery*100
              )+"%"
            );
          }
          """

          html = html.replace(
              target,
              difficulty + "\n\n" + target,
              1
          )

          marker = """
          <style id="climboria-difficulty-v1">
          /* Climboria Progressive Difficulty V1 */
          </style>
          """

          if "</head>" not in html:
              raise SystemExit(
                  "ERROR: </head> not found."
              )

          html = html.replace(
              "</head>",
              marker + "\n</head>",
              1
          )

          file.write_text(
              html,
              encoding="utf-8"
          )

          print("Climboria Difficulty V1 installed.")

          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(
              encoding="utf-8"
          )

          required = [
              'id="climboria-difficulty-v1"',
              'function getClimbDifficulty(){',
              'window.getClimbDifficulty',
              'horizontalSpread',
              'verticalSpacing',
              'recovery'
          ]

          for item in required:
              if item not in html:
                  raise SystemExit(
                      "VALIDATION FAILED: " + item
                  )

          print("VALIDATION PASSED.")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add Climboria progressive difficulty engine"
          git push
