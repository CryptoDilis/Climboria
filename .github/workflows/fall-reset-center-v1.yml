```yaml
name: Climboria Fall Reset Center V5

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fall-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install fall reset safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          marker = "climboria-fall-reset-center-v5"

          if marker in html:
              print("Fall Reset V5 already installed.")
              raise SystemExit(0)

          # Find the main animation/game loop.
          patterns = [
              r'function\s+animate\s*\([^)]*\)\s*\{',
              r'function\s+loop\s*\([^)]*\)\s*\{',
              r'function\s+gameLoop\s*\([^)]*\)\s*\{'
          ]

          loop_match = None

          for pattern in patterns:
              loop_match = re.search(pattern, html)
              if loop_match:
                  print("Game loop found:", pattern)
                  break

          if not loop_match:
              raise SystemExit(
                  "ERROR: Could not find the main game loop."
              )

          # Insert an independent safety check immediately
          # after the game-loop opening brace.
          insert_at = loop_match.end()

          safety = r'''
          /* climboria-fall-reset-center-v5 */
          if(typeof hero!=="undefined" &&
             hero &&
             typeof resetPlayer==="function" &&
             hero.position.y < -2){
            resetPlayer();
          }
          '''

          html = (
              html[:insert_at]
              + safety
              + html[insert_at:]
          )

          file.write_text(html, encoding="utf-8")

          print("Fall Reset Center V5 installed successfully.")
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          if "climboria-fall-reset-center-v5" not in html:
              raise SystemExit(
                  "VALIDATION FAILED: V5 marker missing."
              )

          if not re.search(
              r'hero\.position\.y\s*<\s*-2',
              html
          ):
              raise SystemExit(
                  "VALIDATION FAILED: fall threshold missing."
              )

          if not re.search(
              r'resetPlayer\s*\(\s*\)',
              html
          ):
              raise SystemExit(
                  "VALIDATION FAILED: resetPlayer missing."
              )

          print("VALIDATION PASSED.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add independent fall reset safety"
          git push
```
