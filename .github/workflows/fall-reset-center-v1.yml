name: Climboria Fall Reset Center V3

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fall-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix bottom fall reset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          marker = 'id="climboria-fall-reset-center-v3"'

          if marker in html:
              print("Fall Reset Center V3 already installed.")
              raise SystemExit(0)

          pattern = re.compile(
              r'const groundY\s*=\s*\.82\s*;'
              r'\s*'
              r'if\s*\(\s*hero\.position\.y\s*<\s*groundY\s*\)\s*\{'
              r'.*?'
              r'\}'
              r'\s*'
              r'if\s*\(\s*hero\.position\.y\s*<\s*-10\s*\)'
              r'\s*resetPlayer\s*\(\s*\)\s*;',
              re.DOTALL
          )

          match = pattern.search(html)

          if not match:
              raise SystemExit(
                  "ERROR: Actual ground/fall block was not found."
              )

          replacement = """const groundY=.82;

          if(hero.position.y<groundY){
            resetPlayer();
            return;
          }"""

          html = (
              html[:match.start()]
              + replacement
              + html[match.end():]
          )

          marker_block = """
          <style id="climboria-fall-reset-center-v3">
          /* Climboria Fall Reset Center V3 */
          </style>
          """

          if "</head>" not in html:
              raise SystemExit("ERROR: </head> not found.")

          html = html.replace(
              "</head>",
              marker_block + "\\n</head>",
              1
          )

          file.write_text(html, encoding="utf-8")

          print("Fall Reset Center V3 installed successfully.")
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(
              encoding="utf-8"
          )

          if 'id="climboria-fall-reset-center-v3"' not in html:
              raise SystemExit(
                  "VALIDATION FAILED: V3 marker missing."
              )

          if "if(hero.position.y<groundY){\n            resetPlayer();" not in html:
              raise SystemExit(
                  "VALIDATION FAILED: center reset logic missing."
              )

          print("Fall Reset Center V3 validation passed.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix bottom fall reset to center"
          git push
