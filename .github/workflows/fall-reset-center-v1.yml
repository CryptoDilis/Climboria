```yaml
name: Climboria Fall Reset Center V4

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fall-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add center reset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          marker = 'id="climboria-fall-reset-center-v4"'

          if marker in html:
              print("V4 already installed.")
              raise SystemExit(0)

          # Find the existing resetPlayer call used by the
          # bottom-fall protection and make sure it resets
          # to the real starting position.
          pattern = re.compile(
              r'(if\s*\(\s*hero\.position\.y\s*<\s*-10\s*\)'
              r'\s*(?:\{\s*)?'
              r'resetPlayer\s*\(\s*\)\s*;?'
              r'(?:\s*\})?)',
              re.DOTALL
          )

          match = pattern.search(html)

          if match:
              old = match.group(1)

              new = """if(hero.position.y<-10){
                resetPlayer();
              }"""

              html = html[:match.start()] + new + html[match.end():]
              print("Existing bottom reset condition updated.")
          else:
              # If the source clamps at groundY before reaching -10,
              # modify that ground reset instead.
              ground_pattern = re.compile(
                  r'if\s*\(\s*hero\.position\.y\s*<\s*groundY\s*\)\s*\{',
                  re.DOTALL
              )

              ground_match = ground_pattern.search(html)

              if not ground_match:
                  raise SystemExit(
                      "ERROR: Could not locate ground reset logic."
                  )

              start = ground_match.start()
              brace = html.find("{", ground_match.start())

              depth = 0
              end = None

              for i in range(brace, len(html)):
                  if html[i] == "{":
                      depth += 1
                  elif html[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not determine ground reset block."
                  )

              new = """if(hero.position.y<groundY){
                resetPlayer();
              }"""

              html = html[:start] + new + html[end:]
              print("Ground reset logic updated.")

          marker_block = """
          <style id="climboria-fall-reset-center-v4">
          /* Climboria Fall Reset Center V4 */
          </style>
          """

          if "</head>" not in html:
              raise SystemExit("ERROR: </head> not found.")

          html = html.replace(
              "</head>",
              marker_block + "\\n</head>",
              1
          )

          file.write_text(html, encoding="utf-8")
          print("Fall Reset Center V4 installed.")
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          if 'id="climboria-fall-reset-center-v4"' not in html:
              raise SystemExit("VALIDATION FAILED: V4 marker missing.")

          if not re.search(r'hero\.position\.y\s*<\s*groundY', html):
              raise SystemExit("VALIDATION FAILED: ground condition missing.")

          if not re.search(r'resetPlayer\s*\(\s*\)', html):
              raise SystemExit("VALIDATION FAILED: resetPlayer call missing.")

          print("VALIDATION PASSED.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Climboria fall reset center"
          git push
```
