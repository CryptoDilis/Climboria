name: Climboria Fall Reset Center V2

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fall-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add fall reset to center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          marker = 'id="climboria-fall-reset-center-v2"'

          if marker in html:
              print("Fall Reset Center V2 already installed.")
              raise SystemExit(0)

          # Locate the existing bottom-fall condition.
          match = re.search(
              r'if\s*\(\s*hero\.position\.y\s*<\s*-10\s*\)\s*\{.*?\}',
              html,
              re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: Bottom fall-reset block not found."
              )

          old_block = match.group(0)

          # Keep the existing fall trigger, but reset the hero
          # to the center starting position.
          new_block = """if(hero.position.y<-10){
              hero.position.x=0;
              hero.position.y=.82;
              velocityX=0;
              velocityY=0;
              grabbed=null;
              cameraShake=.12;
              if(typeof nextGripIndex!=="undefined"){
                nextGripIndex=0;
              }
              if(running){
                setStatus("RESET","#55ff70");
              }
            }"""

          html = (
              html[:match.start()]
              + new_block
              + html[match.end():]
          )

          marker_block = """
          <style id="climboria-fall-reset-center-v2">
          /* Climboria Fall Reset Center V2 */
          </style>
          """

          if "</head>" not in html:
              raise SystemExit(
                  "ERROR: </head> not found."
              )

          html = html.replace(
              "</head>",
              marker_block + "\n</head>",
              1
          )

          file.write_text(
              html,
              encoding="utf-8"
          )

          print("Fall Reset Center V2 installed.")
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(
              encoding="utf-8"
          )

          if 'id="climboria-fall-reset-center-v2"' not in html:
              raise SystemExit(
                  "VALIDATION FAILED: V2 marker missing."
              )

          checks = [
              r'hero\.position\.x\s*=\s*0',
              r'hero\.position\.y\s*=\s*\.82',
              r'velocityX\s*=\s*0',
              r'velocityY\s*=\s*0'
          ]

          for pattern in checks:
              if not re.search(pattern, html):
                  raise SystemExit(
                      "VALIDATION FAILED: " + pattern
                  )

          print("Fall Reset Center V2 validation passed.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Reset fallen hero to center V2"
          git push
