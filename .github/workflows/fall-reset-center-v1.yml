name: Climboria Fall Reset Center

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Reset
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); marker='CLIMBORIA_FALL_RESET_CENTER'; code='''<script>/* CLIMBORIA_FALL_RESET_CENTER */</script>'''; p.write_text(s.replace('</body>',code+'</body>',1))"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add fall reset center"
          git push
