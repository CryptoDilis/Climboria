name: Deploy Jupiter Runtime Status (disabled safety release)

on:
  # Only a reviewed change to the dedicated runtime-status Worker or this
  # workflow deploys it. Never trigger from a docs-only or gameplay change.
  push:
    branches: [main]
    paths:
      - 'dex/runtime-status/**'
      - '.github/workflows/deploy-jupiter-runtime-status.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'dex/runtime-status/**'
      - '.github/workflows/deploy-jupiter-runtime-status.yml'

permissions:
  contents: read

concurrency:
  group: deploy-jupiter-runtime-status
  cancel-in-progress: false

jobs:
  verify-disabled:
    name: Check disabled Jupiter status Worker without deploying
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate runtime-status Worker source and narrow Cloudflare route
        working-directory: dex/runtime-status
        run: |
          set -euo pipefail
          node --test test/*.test.mjs
          node --check index.mjs
          grep -Fqx 'name = "climboria-swap-runtime-status"' wrangler.toml
          grep -Fqx 'main = "index.mjs"' wrangler.toml
          grep -Fqx 'workers_dev = false' wrangler.toml
          grep -Fqx 'preview_urls = false' wrangler.toml
          grep -Fqx 'routes = [{ pattern = "climboria.fun/swap-runtime-status.json", zone_name = "climboria.fun" }]' wrangler.toml

  deploy-disabled:
    name: Verify and deploy disabled Jupiter UI release switch
    needs: verify-disabled
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove that provider launch status is still disabled and fail-closed
        working-directory: dex/runtime-status
        run: |
          set -euo pipefail
          node --test test/*.test.mjs
          node --check index.mjs
          grep -Fqx 'name = "climboria-swap-runtime-status"' wrangler.toml
          grep -Fqx 'main = "index.mjs"' wrangler.toml
          grep -Fqx 'workers_dev = false' wrangler.toml
          grep -Fqx 'preview_urls = false' wrangler.toml
          grep -Fqx 'routes = [{ pattern = "climboria.fun/swap-runtime-status.json", zone_name = "climboria.fun" }]' wrangler.toml

      - name: Validate existing Cloudflare deployment credentials (never log secrets)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN Actions secret is required for this existing Cloudflare account."
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID Actions secret must be a 32-character hex account ID."
            exit 1
          fi

      - name: Deploy only the explicit disabled Jupiter runtime-status Worker
        working-directory: dex/runtime-status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler@4.36.0 deploy; then
            echo "::error title=Jupiter runtime route deployment failed::Cloudflare upload does not prove that climboria.fun/swap-runtime-status.json is routed. If Wrangler reports 'No access to the specified resource' for /workers/scripts/climboria-swap-runtime-status/routes, grant the GitHub Actions API token zone-scoped Workers Routes Edit and Zone Read for climboria.fun while retaining account Workers Scripts Edit, then retry. See docs/DEX_SWAP_JUPITER_ROUTE_ACCESS_RECOVERY_2026-11-17.md. Never treat this partial upload as live or remove the runtime gate."
            exit 1
          fi

      - name: Verify exact public status and no-store cache headers
        shell: bash
        run: |
          set -euo pipefail
          url="https://climboria.fun/swap-runtime-status.json"
          for attempt in $(seq 1 15); do
            response="$(curl --fail --silent --show-error --max-time 8 --dump-header /tmp/jupiter-runtime-headers "$url" || true)"
            if [[ "$response" == '{"enabled":false}' ]] &&
               grep -Eiq '^cache-control:.*no-store' /tmp/jupiter-runtime-headers; then
              echo "PASS: independently routed Jupiter provider runtime is disabled with no-store."
              exit 0
            fi
            echo "Jupiter runtime status not yet at disabled/no-store (attempt $attempt/15)."
            sleep 3
          done
          echo "::error::Jupiter runtime status deployment did not verify disabled/no-store."
          exit 1
