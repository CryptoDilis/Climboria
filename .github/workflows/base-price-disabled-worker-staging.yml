name: Base DEX Disabled Worker Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm hostname is available and both namespace IDs reserved: DEPLOY_BASE_PRICE_DISABLED"
        required: true
        type: string
      ip_namespace:
        description: "Account-unique Base per-IP rate limit namespace ID"
        required: true
        type: string
      shared_namespace:
        description: "Different account-unique Base shared rate limit namespace ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: base-price-disabled-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_BASE_PRICE_DISABLED' }}
    environment: base-price-provider-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate isolated disabled source and generate exact staging config
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BASE_IP_NAMESPACE: ${{ inputs.ip_namespace }}
          BASE_SHARED_NAMESPACE: ${{ inputs.shared_namespace }}
          EXISTING_SOLANA_NAMESPACE: ${{ vars.CLOUDFLARE_RATE_LIMIT_NAMESPACE_ID }}
        run: |
          node --test .github/scripts/base-0x-indicative-price.test.mjs .github/scripts/base-price-worker.test.mjs .github/scripts/base-price-budget.test.mjs
          node .github/scripts/base-price-disabled-staging-config.mjs
      - name: Install Wrangler and validate bundle
        run: |
          npm init -y
          npm install --no-save wrangler@4
          npx wrangler deploy --dry-run --config dex/base-price-provider/wrangler.staging.generated.toml
      - name: Check existing Worker domain ownership without changing account resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          const {CLOUDFLARE_API_TOKEN:token,CLOUDFLARE_ACCOUNT_ID:id}=process.env;
          if(!token||!/^[a-fA-F0-9]{32}$/.test(id||""))throw Error("Missing Cloudflare deployment credentials");
          const url=new URL("https://api.cloudflare.com/client/v4/accounts/"+id+"/workers/domains");
          url.searchParams.set("hostname","base-price.climboria.fun");
          const res=await fetch(url,{headers:{Authorization:"Bearer "+token},redirect:"error",signal:AbortSignal.timeout(15000)});
          if(!res.ok)throw Error("Unable to verify domain ownership: HTTP "+res.status);
          const body=await res.json();
          if(body.success!==true||!Array.isArray(body.result))throw Error("Invalid domain inventory");
          if(body.result_info?.total_pages>1||body.result_info?.total_count>body.result.length)throw Error("Incomplete domain inventory");
          for(const item of body.result){
            if(item.hostname==="base-price.climboria.fun"&&item.service!=="climboria-base-price-preview")throw Error("Domain is already assigned to another Worker");
          }
          console.log("PASS: no conflicting Worker domain returned");
          NODE
      - name: Deploy only disabled Base Worker (no provider secret or upstream calls)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dex/base-price-provider/wrangler.staging.generated.toml
      - name: Verify actual deployed revision, CORS and disabled price route
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: node .github/scripts/base-price-disabled-staging-smoke.mjs
