name: CLIMB Verified Static Supply Snapshot

# GitHub Pages is static. Fetch finalized Solana supply from GitHub Actions,
# not from visitor browsers. Fail closed; never publish guessed numbers.
on:
  push:
    branches: [main]
    paths:
      - "site/supply-worker/publish-static.mjs"
      - ".github/workflows/climb-supply-static-snapshot.yml"
      - "climb-token-supply.js"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: climb-static-supply-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify publisher contract offline
        run: |
          node --check site/supply-worker/publish-static.mjs
          node --test site/supply-worker/publish-static.test.mjs
      - name: Fetch finalized CLIMB supply from Solana mainnet RPC
        env:
          # Optional. Public Solana mainnet RPC is used if not connected.
          # Never put private provider tokens in source files or issue comments.
          SOLANA_RPC_URL: ${{ secrets.CLIMB_SUPPLY_RPC_URL }}
        run: node site/supply-worker/publish-static.mjs
      - name: Commit only verified static snapshot to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/climb-supply.json
          if git diff --cached --quiet; then
            echo "No new verified supply snapshot to publish"
            exit 0
          fi
          git commit -m "data(site): refresh verified CLIMB mint supply [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# No Cloudflare, DEX, Swap, Game, wallet or trade execution deployments.
