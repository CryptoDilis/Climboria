```yaml
name: Climboria Mountain Graphics V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mountain-graphics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade mountain graphics
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          marker = "CLIMBORIA_MOUNTAIN_GRAPHICS_V2"

          if marker in html:
              print("Already installed.")
              raise SystemExit(0)

          code = r'''
          /* CLIMBORIA_MOUNTAIN_GRAPHICS_V2 */

          const mountainVisualGroup = new THREE.Group();

          function addMountainFace(points, color, z) {
            const geometry = new THREE.BufferGeometry();

            const vertices = new Float32Array([
              points[0][0], points[0][1], z,
              points[1][0], points[1][1], z,
              points[2][0], points[2][1], z
            ]);

            geometry.setAttribute(
              "position",
              new THREE.BufferAttribute(vertices, 3)
            );

            geometry.computeVertexNormals();

            const material =
              new THREE.MeshStandardMaterial({
                color: color,
                roughness: 1,
                metalness: 0
              });

            const mesh =
              new THREE.Mesh(
                geometry,
                material
              );

            mountainVisualGroup.add(mesh);
          }

          addMountainFace(
            [[-9,0],[0,62],[-2,0]],
            0x252c30,
            -3.2
          );

          addMountainFace(
            [[-2,0],[0,62],[2,0]],
            0x4b5559,
            -3.1
          );

          addMountainFace(
            [[2,0],[0,62],[9,0]],
            0x252c30,
            -3.2
          );

          const mountainEdgeMaterial =
            new THREE.MeshBasicMaterial({
              color: 0x9ba6a8,
              transparent: true,
              opacity: 0.22
            });

          const mountainEdges = [
            [-5.5,10,3.0,-0.16],
            [5.0,17,3.4,0.15],
            [-5.0,25,3.8,-0.14],
            [4.8,34,3.6,0.13],
            [-4.2,43,3.4,-0.12],
            [3.8,51,3.0,0.11]
          ];

          mountainEdges.forEach(function(p) {

            const edge =
              new THREE.Mesh(
                new THREE.BoxGeometry(
                  p[2],
                  0.055,
                  0.04
                ),
                mountainEdgeMaterial
              );

            edge.position.set(
              p[0],
              p[1],
              -2.95
            );

            edge.rotation.z = p[3];

            mountainVisualGroup.add(edge);
          });

          scene.add(mountainVisualGroup);

          const mountainLight =
            new THREE.PointLight(
              0x789097,
              1.3,
              28
            );

          mountainLight.position.set(
            0,
            42,
            4
          );

          scene.add(mountainLight);

          '''
          
          anchor = "</script>"

          if anchor not in html:
              raise SystemExit(
                  "ERROR: script closing tag not found."
              )

          html = html.replace(
              anchor,
              code + "\n" + anchor,
              1
          )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "Mountain Graphics V2 installed."
          )
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve mountain graphics"
          git push
```
