name: Game wallet PostgreSQL revocation race
on:
  push:
    paths: ['game/wallet-proof/postgres-fixture/**','.github/workflows/game-wallet-postgres-revocation.yml']
  pull_request:
    paths: ['game/wallet-proof/postgres-fixture/**','.github/workflows/game-wallet-postgres-revocation.yml']
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: wallet_fixture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wallet_fixture_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply and test only in disposable PostgreSQL
        env:
          PGPASSWORD: synthetic-fixture-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d wallet_fixture_test -f game/wallet-proof/postgres-fixture/schema.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d wallet_fixture_test -f game/wallet-proof/postgres-fixture/acceptance.sql
          python3 game/wallet-proof/postgres-fixture/revocation-race.py
