name: CLIMB Historical Boundary Block Evidence
on:
  workflow_dispatch:
    inputs:
      evidence_mode:
        description: 'Explicit read-only evidence mode (no automatic fallback)'
        type: choice
        options:
          - full
          - signatures-only
        default: full
        required: true
  pull_request:
    paths:
      - 'base/inventory-probe/boundary-blocks*.mjs'
      - '.github/workflows/climb-historical-boundary-blocks.yml'
permissions:
  contents: read
concurrency:
  group: climb-historical-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test base/inventory-probe/boundary-blocks.test.mjs
  observe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare pinned boundary blocks (read only)
        env:
          EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          CLIMB_SOLANA_RPC_A_URL: ${{ secrets.CLIMBORIA_SOLANA_RPC_URL }}
          CLIMB_SOLANA_RPC_B_URL: ${{ secrets.CLIMBORIA_SOLANA_RPC_URL_SECONDARY }}
        run: |
          set -euo pipefail
          case "$EVIDENCE_MODE" in
            full) node base/inventory-probe/boundary-blocks-cli.mjs > "$RUNNER_TEMP/climb-boundary-blocks.json" ;;
            signatures-only) node base/inventory-probe/boundary-blocks-cli.mjs --signatures-only > "$RUNNER_TEMP/climb-boundary-blocks.json" ;;
            *) exit 1 ;;
          esac
          # Ordered public signatures remain in the evidence artifact, not logs.
          node -e 'const x=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({...x,blocks:x.blocks.map(({orderedSignatures,...b})=>b)},null,2))' "$RUNNER_TEMP/climb-boundary-blocks.json"
      - uses: actions/upload-artifact@v4
        with:
          name: climb-historical-boundary-blocks
          path: ${{ runner.temp }}/climb-boundary-blocks.json
          retention-days: 7
          if-no-files-found: error
