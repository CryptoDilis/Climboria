name: CLIMB Base Synthetic Claim Authorization
on:
  pull_request:
    paths:
      - 'base/claim-auth/**'
      - '.github/workflows/climb-base-claim-auth.yml'
  push:
    branches: [main]
    paths:
      - 'base/claim-auth/**'
      - '.github/workflows/climb-base-claim-auth.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test base/claim-auth/authorization.test.mjs base/claim-auth/recovery.test.mjs
