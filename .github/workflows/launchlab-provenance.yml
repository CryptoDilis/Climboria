name: LaunchLab Live Provenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/launchlab-provenance.mjs"
      - ".github/scripts/launchlab-provenance.test.mjs"
      - ".github/scripts/launchlab-sdk-idl-check.mjs"
      - ".github/scripts/launchlab-onchain-idl-check.mjs"
      - ".github/scripts/launchlab-api-config-check.mjs"
      - ".github/scripts/launchlab-api-config-check.test.mjs"
      - ".github/scripts/launchlab-prepare-devnet.mjs"
      - ".github/scripts/launchlab-prepare-devnet.test.mjs"
      - ".github/scripts/launchlab-devnet-builder-smoke.mjs"
      - ".github/scripts/launchlab-devnet-simulation-preflight.mjs"
      - ".github/scripts/launchlab-devnet-simulation-preflight.test.mjs"
      - ".github/scripts/launchlab-devnet-approval-packet.mjs"
      - ".github/scripts/launchlab-devnet-approval-packet.test.mjs"
      - ".github/scripts/launchlab-devnet-rent-layouts.mjs"
      - ".github/scripts/launchlab-devnet-rent-layouts.test.mjs"
      - ".github/scripts/launchlab-metaplex-deployment-probe.mjs"
      - ".github/scripts/launchlab-metaplex-deployment-probe.test.mjs"
      - ".github/scripts/launchlab-metaplex-deployment-smoke.mjs"
      - ".github/scripts/launchlab-lock-idl-check.mjs"
      - ".github/scripts/launchlab-lock-idl-check.test.mjs"
      - ".github/workflows/launchlab-provenance.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/launchlab-provenance.mjs"
      - ".github/scripts/launchlab-provenance.test.mjs"
      - ".github/scripts/launchlab-sdk-idl-check.mjs"
      - ".github/scripts/launchlab-onchain-idl-check.mjs"
      - ".github/scripts/launchlab-api-config-check.mjs"
      - ".github/scripts/launchlab-api-config-check.test.mjs"
      - ".github/scripts/launchlab-prepare-devnet.mjs"
      - ".github/scripts/launchlab-prepare-devnet.test.mjs"
      - ".github/scripts/launchlab-devnet-builder-smoke.mjs"
      - ".github/scripts/launchlab-devnet-simulation-preflight.mjs"
      - ".github/scripts/launchlab-devnet-simulation-preflight.test.mjs"
      - ".github/scripts/launchlab-devnet-approval-packet.mjs"
      - ".github/scripts/launchlab-devnet-approval-packet.test.mjs"
      - ".github/scripts/launchlab-devnet-rent-layouts.mjs"
      - ".github/scripts/launchlab-devnet-rent-layouts.test.mjs"
      - ".github/scripts/launchlab-metaplex-deployment-probe.mjs"
      - ".github/scripts/launchlab-metaplex-deployment-probe.test.mjs"
      - ".github/scripts/launchlab-metaplex-deployment-smoke.mjs"
      - ".github/scripts/launchlab-lock-idl-check.mjs"
      - ".github/scripts/launchlab-lock-idl-check.test.mjs"
      - ".github/workflows/launchlab-provenance.yml"

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test read-only probe and fail-closed behavior
        run: node --test .github/scripts/launchlab-provenance.test.mjs
      - name: Fetch pinned official SDK and LaunchLab IDL sources
        run: |
          mkdir -p /tmp/launchlab-provenance
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-sdk-V2/1cf5bb129dbbb1c76dab67819c3d478349c8ed25/package.json -o /tmp/launchlab-provenance/package.json
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-sdk-V2/1cf5bb129dbbb1c76dab67819c3d478349c8ed25/src/raydium/launchpad/instrument.ts -o /tmp/launchlab-provenance/instrument.ts
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-sdk-V2/1cf5bb129dbbb1c76dab67819c3d478349c8ed25/src/raydium/launchpad/layout.ts -o /tmp/launchlab-provenance/layout.ts
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-sdk-V2/1cf5bb129dbbb1c76dab67819c3d478349c8ed25/src/raydium/launchpad/launchpad.ts -o /tmp/launchlab-provenance/launchpad.ts
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-sdk-V2/1cf5bb129dbbb1c76dab67819c3d478349c8ed25/src/raydium/launchpad/pda.ts -o /tmp/launchlab-provenance/pda.ts
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-idl/e7e0c96fe77bcf6a020b84a44c47a722aac8e359/raydium_launchpad/raydium_launchpad.json -o /tmp/launchlab-provenance/launchpad-idl.json
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-idl/e7e0c96fe77bcf6a020b84a44c47a722aac8e359/raydium_cpmm/raydium_cp_swap.json -o /tmp/launchlab-provenance/cp-swap-idl.json
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-sdk-V2/1cf5bb129dbbb1c76dab67819c3d478349c8ed25/src/common/programId.ts -o /tmp/launchlab-provenance/programId.ts
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-cp-swap/3d69122790e97cd6aff24e8ba95940793773f58c/programs/cp-swap/src/lib.rs -o /tmp/launchlab-provenance/cp-swap-lib.rs
          curl -fsSL https://raw.githubusercontent.com/raydium-io/raydium-cp-swap/3d69122790e97cd6aff24e8ba95940793773f58c/programs/cp-swap/src/instructions/initialize_v2.rs -o /tmp/launchlab-provenance/cp-swap-initialize-v2.rs
      - name: Report downloaded artifact SHA-256 digests
        run: sha256sum /tmp/launchlab-provenance/package.json /tmp/launchlab-provenance/launchpad-idl.json /tmp/launchlab-provenance/instrument.ts /tmp/launchlab-provenance/layout.ts /tmp/launchlab-provenance/launchpad.ts /tmp/launchlab-provenance/pda.ts /tmp/launchlab-provenance/cp-swap-idl.json /tmp/launchlab-provenance/programId.ts /tmp/launchlab-provenance/cp-swap-lib.rs /tmp/launchlab-provenance/cp-swap-initialize-v2.rs
      - name: Verify pinned SDK, IDL hashes and instruction discriminators
        run: node .github/scripts/launchlab-sdk-idl-check.mjs /tmp/launchlab-provenance/package.json /tmp/launchlab-provenance/launchpad-idl.json /tmp/launchlab-provenance/instrument.ts /tmp/launchlab-provenance/layout.ts /tmp/launchlab-provenance/launchpad.ts /tmp/launchlab-provenance/pda.ts /tmp/launchlab-provenance/cp-swap-idl.json /tmp/launchlab-provenance/programId.ts /tmp/launchlab-provenance/cp-swap-lib.rs /tmp/launchlab-provenance/cp-swap-initialize-v2.rs
      - name: Install temporary Solana RPC client dependency
        run: npm install --prefix /tmp/launchlab-tools --no-save @solana/web3.js@1.98.4 @raydium-io/raydium-sdk-v2@0.2.84-alpha
      - name: Test LP Lock IDL account and PDA validation
        run: node --test .github/scripts/launchlab-lock-idl-check.test.mjs
      - name: Test live Launch Config parameter validation
        run: node --test .github/scripts/launchlab-api-config-check.test.mjs
      - name: Test fail-closed Devnet transaction preparation (no signing or submission)
        run: node --test .github/scripts/launchlab-prepare-devnet.test.mjs
      - name: Test approval-gated unsigned Devnet simulation preflight (mock RPC only)
        run: node --test .github/scripts/launchlab-devnet-simulation-preflight.test.mjs
      - name: Test read-only Devnet owner approval packet builder (mock RPC only)
        run: node --test .github/scripts/launchlab-devnet-approval-packet.test.mjs
      - name: Test source-backed Devnet rent account layouts (offline fixtures only)
        run: node --test .github/scripts/launchlab-devnet-rent-layouts.test.mjs
      - name: Test read-only Metaplex Devnet deployment provenance parser (mock RPC only)
        run: node --test .github/scripts/launchlab-metaplex-deployment-probe.test.mjs
      - name: Checkout Metaplex source at Devnet deployment-era candidate commit
        uses: actions/checkout@v4
        with:
          repository: metaplex-foundation/mpl-token-metadata
          ref: 23aee718e723578ee5df411f045184e0ac9a9e63
          path: metaplex-source
          fetch-depth: 1
          submodules: recursive
      - name: Install historical Metaplex Rust toolchain
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: 1.79.0
      - name: Install historical Metaplex Solana build tools
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: 2.0.9
          cache: true
      - name: Rebuild deployment-era Metaplex Token Metadata program
        working-directory: metaplex-source/programs/token-metadata/program
        run: |
          mkdir -p "$RUNNER_TEMP/metaplex-build"
          cargo build-sbf --sbf-out-dir "$RUNNER_TEMP/metaplex-build"
          test -s "$RUNNER_TEMP/metaplex-build/token_metadata.so"
          sha256sum "$RUNNER_TEMP/metaplex-build/token_metadata.so"
      - name: Capture and compare canonical Metaplex Devnet deployment provenance (read-only RPC)
        env:
          METAPLEX_BUILD_ARTIFACT_PATH: ${{ runner.temp }}/metaplex-build/token_metadata.so
          METAPLEX_SOURCE_COMMIT: 23aee718e723578ee5df411f045184e0ac9a9e63
        run: node .github/scripts/launchlab-metaplex-deployment-smoke.mjs
      - name: Build and inspect real pinned-SDK Devnet transactions (no signing or submission)
        env:
          LAUNCHLAB_TOOLS_PREFIX: /tmp/launchlab-tools
        run: node .github/scripts/launchlab-devnet-builder-smoke.mjs
      - name: Validate live Mainnet and Devnet Launch Config API defaults against on-chain state
        env:
          LAUNCHLAB_TOOLS_PREFIX: /tmp/launchlab-tools
        run: node .github/scripts/launchlab-api-config-check.mjs
      - name: Compare live Mainnet and Devnet Anchor IDLs
        env:
          LAUNCHLAB_TOOLS_PREFIX: /tmp/launchlab-tools
        run: node --experimental-default-type=module .github/scripts/launchlab-onchain-idl-check.mjs /tmp/launchlab-provenance/launchpad-idl.json /tmp/launchlab-provenance/layout.ts
      - name: Query live Raydium APIs and finalized Solana program accounts
        run: node .github/scripts/launchlab-provenance.mjs
      - name: Verify Mainnet LP Lock IDL and report Devnet IDL publication status
        env:
          LAUNCHLAB_TOOLS_PREFIX: /tmp/launchlab-tools
        run: node .github/scripts/launchlab-lock-idl-check.mjs
