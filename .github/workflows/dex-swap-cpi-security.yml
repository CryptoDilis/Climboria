name: DEX Swap CPI Security

on:
  pull_request:
    branches: [main]
    paths:
      - 'dex/swap-proxy/src/**'
      - 'dex/swap-proxy/test/**'
      - '.github/workflows/dex-swap-cpi-security.yml'
  push:
    branches: [main]
    paths:
      - 'dex/swap-proxy/src/**'
      - 'dex/swap-proxy/test/**'
      - '.github/workflows/dex-swap-cpi-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-swap-cpi-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpi-policy:
    name: Fail-closed V6 CPI policy and Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Worker security module syntax and all isolated tests
        run: |
          node --check dex/swap-proxy/src/index.mjs
          node --check dex/swap-proxy/src/jupiter-v6-policy.mjs
          node --check dex/swap-proxy/src/jupiter-v6-cpi-review.mjs
          node --test dex/swap-proxy/test/*.test.mjs
      - name: Verify deliberate source-level release gates remain locked
        run: |
          grep -Fqx 'const SIGNABLE_ORDER_SECURITY_REVIEW_COMPLETE = false;' dex/swap-proxy/src/index.mjs
          grep -Fqx 'const EXECUTION_SECURITY_REVIEW_COMPLETE = false;' dex/swap-proxy/src/index.mjs
          grep -Fqx 'EXECUTION_ENABLED = "false"' dex/swap-proxy/wrangler.toml
          grep -Eq '^[[:space:]]*enabled:[[:space:]]*false' swap-config.js
      - name: Bundle exact Worker source and Durable Object config (dry run only)
        working-directory: dex/swap-proxy
        run: npx wrangler@4.36.0 deploy --dry-run --outdir /tmp/climboria-swap-cpi-dry-run
