name: DEX Swap Production Quote Browser Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/dex-swap-production-quote-smoke.mjs"
      - ".github/workflows/dex-swap-production-quote.yml"
  # Avoid workflow_run on GitHub's built-in Pages dynamic workflow: actual
  # Pages successes have not emitted that trigger in this repository.
  push:
    branches: [main]
    paths:
      - "dex/**"
      - "swap/**"
      - "swap-config.js"
      - ".github/scripts/dex-swap-production-quote-smoke.mjs"
      - ".github/workflows/dex-swap-production-quote.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dex-swap-production-quote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Validate read-only browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate smoke syntax
        run: node --check .github/scripts/dex-swap-production-quote-smoke.mjs

  production-browser:
    name: Verify deployed DEX and Swap Jupiter quote UI
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for successful Pages deployment containing this DEX/Swap commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A newer main commit can cancel Pages for the original SHA while
          # still containing this DEX/Swap fix. Accept only a successful Pages
          # build at the same SHA OR a GitHub-verified descendant of it.
          # Actual production browser assertions must still pass afterwards.
          for attempt in $(seq 1 30); do
            mapfile -t deployed_shas < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .conclusion == "success") | .head_sha] | .[:15] | .[]')
            for deployed_sha in "${deployed_shas[@]}"; do
              if ! [[ "$deployed_sha" =~ ^[a-f0-9]{40}$ ]]; then
                continue
              fi
              if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
                echo "Pages successfully deployed exact DEX/Swap SHA ${GITHUB_SHA}."
                exit 0
              fi
              relation="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${deployed_sha}" --jq '[.status,.behind_by] | @tsv' 2>/dev/null || true)"
              if [[ "$relation" == $'ahead\t0' || "$relation" == $'identical\t0' ]]; then
                echo "Pages deployed verified descendant ${deployed_sha} containing DEX/Swap SHA ${GITHUB_SHA}."
                exit 0
              fi
            done
            echo "No successful exact-or-descendant Pages release yet for ${GITHUB_SHA} (check ${attempt}/30)."
            sleep 10
          done
          echo "::error::No successful Pages release containing DEX/Swap SHA ${GITHUB_SHA}."
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check production desktop/mobile Swap and diagnostic DEX quotes
        run: node .github/scripts/dex-swap-production-quote-smoke.mjs
