name: Climboria Level 3 V1

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  level3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Level 3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          if 'id="climboria-level-3-v1"' in html:
              print("Level 3 V1 already installed.")
              raise SystemExit(0)

          # Enable Level 3.
          old = '''3:{
           name:"BITCOIN BLOCK",
           reward:200,
           playable:false
          }'''

          new = '''3:{
           name:"BITCOIN BLOCK",
           reward:200,
           playable:true
          }'''

          if old not in html:
              raise SystemExit(
                  "ERROR: Level 3 definition not found."
              )

          html = html.replace(old, new, 1)

          # Add marker only.
          marker = '''
          <style id="climboria-level-3-v1">
          /* Climboria Level 3 - Bitcoin Block */
          </style>
          '''

          if "</head>" not in html:
              raise SystemExit(
                  "ERROR: </head> not found."
              )

          html = html.replace(
              "</head>",
              marker + "\n</head>",
              1
          )

          file.write_text(
              html,
              encoding="utf-8"
          )

          print("Level 3 enabled successfully.")
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(
              encoding="utf-8"
          )

          checks = [
              'id="climboria-level-3-v1"',
              'name:"BITCOIN BLOCK"',
              'playable:true'
          ]

          for item in checks:
              if item not in html:
                  raise SystemExit(
                      "VALIDATION FAILED: " + item
                  )

          print("Validation passed.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Enable Climboria Level 3"
          git push
