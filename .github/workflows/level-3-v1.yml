name: Climboria Level 3 V1

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  level3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Level 3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          if 'id="climboria-level-3-v1"' in html:
              print("Level 3 V1 already installed.")
              raise SystemExit(0)

          # Find Level 3 regardless of spacing/indentation.
          pattern = re.compile(
              r'(3\s*:\s*\{\s*'
              r'name\s*:\s*"BITCOIN BLOCK"\s*,\s*'
              r'reward\s*:\s*200\s*,\s*'
              r'playable\s*:\s*)false',
              re.MULTILINE
          )

          match = pattern.search(html)

          if not match:
              raise SystemExit(
                  "ERROR: Level 3 definition not found."
              )

          replacement = match.group(1) + "true"

          html = (
              html[:match.start()]
              + replacement
              + html[match.end():]
          )

          # Add installation marker.
          marker = '''
          <style id="climboria-level-3-v1">
          /* Climboria Level 3 - Bitcoin Block */
          </style>
          '''

          if "</head>" not in html:
              raise SystemExit(
                  "ERROR: </head> not found."
              )

          html = html.replace(
              "</head>",
              marker + "\n</head>",
              1
          )

          file.write_text(
              html,
              encoding="utf-8"
          )

          print("Level 3 enabled successfully.")
          PY

      - name: Validate Level 3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(
              encoding="utf-8"
          )

          if 'id="climboria-level-3-v1"' not in html:
              raise SystemExit(
                  "VALIDATION FAILED: Level 3 marker missing."
              )

          pattern = re.compile(
              r'3\s*:\s*\{\s*'
              r'name\s*:\s*"BITCOIN BLOCK"\s*,\s*'
              r'reward\s*:\s*200\s*,\s*'
              r'playable\s*:\s*true',
              re.MULTILINE
          )

          if not pattern.search(html):
              raise SystemExit(
                  "VALIDATION FAILED: Level 3 is not enabled."
              )

          print("Level 3 validation passed.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Enable Climboria Level 3"
          git push
