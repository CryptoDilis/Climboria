name: Base DEX Observed Firm Quote Target Provenance
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/base-observed-quote-target-provenance.yml"
      - ".github/scripts/base-settler-deployment-revision.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check .github/scripts/base-settler-deployment-revision.mjs
      - name: Observe quoted target registry relation and historical GitCommit (no provider request)
        run: node .github/scripts/base-settler-deployment-revision.mjs --observed-quote-target
