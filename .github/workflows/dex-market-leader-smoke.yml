name: DEX Market Leader Visual Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "dex/**"
      - ".github/scripts/dex-market-leader-smoke.mjs"
      - ".github/workflows/dex-market-leader-smoke.yml"
  push:
    branches: [main]
    paths:
      - "dex/**"
      - ".github/scripts/dex-market-leader-smoke.mjs"
      - ".github/workflows/dex-market-leader-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-market-leader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dex-market-leader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-dex-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/dex/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/climboria-dex-http.log
          exit 1
      - name: Check desktop and mobile Market Leader presentation
        run: node .github/scripts/dex-market-leader-smoke.mjs
      - name: Upload DEX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-market-leader-visuals
          path: climboria-dex-market-leader-*.png
          if-no-files-found: warn
          retention-days: 7
