name: CLIMB Base Fixed Burn Prototype - Offline Tests
on:
  workflow_dispatch:
    inputs:
      payer:
        description: 'Dedicated Base Sepolia public EOA address (read-only simulation)'
        required: true
        type: string
      token:
        description: 'Optional deployed test-only token address (verification only)'
        required: false
        type: string
      creation_tx:
        description: 'Optional finalized creation transaction hash (verification only)'
        required: false
        type: string
      burn_tx:
        description: 'Optional finalized first 10-test-token burn transaction hash'
        required: false
        type: string
  pull_request:
    paths:
      - 'base/token-testnet/**'
      - '.github/workflows/climb-base-burn-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'base/token-testnet/**'
      - '.github/workflows/climb-base-burn-prototype.yml'
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: base/token-testnet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.5.0
          cache: false
      - name: Fetch pinned OpenZeppelin source
        run: |
          set -euo pipefail
          mkdir -p lib/openzeppelin-contracts
          git -C lib/openzeppelin-contracts init
          git -C lib/openzeppelin-contracts fetch --depth=1 https://github.com/OpenZeppelin/openzeppelin-contracts.git dc44c9f1a4c3b10af99492eed84f83ed244203f6
          git -C lib/openzeppelin-contracts checkout --detach FETCH_HEAD
          test "$(git -C lib/openzeppelin-contracts rev-parse HEAD)" = dc44c9f1a4c3b10af99492eed84f83ed244203f6
      - name: Run exact offline prototype tests
        run: |
          set -euo pipefail
          forge test --match-contract ClimbBurnPrototypeTest -vv | tee "$RUNNER_TEMP/climb-burn-tests.log"
          grep -Eq '8 tests passed, 0 failed, 0 skipped \(8 total tests\)' "$RUNNER_TEMP/climb-burn-tests.log"
          for t in testFixedInitialSupply testRejectMainnet testTransferNoTax testHolderBurnAndEvent testRejectBurnBeyondOwnBalance testNoMintOrForcedBurnSelector testAllowanceTransferNoTaxAndNoImplicitBurn testRepeatedAndFullBurnNoReissue; do
            grep -Fq "[PASS] ${t}()" "$RUNNER_TEMP/climb-burn-tests.log"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test strict build manifest validator
        run: node --test build-manifest.test.mjs
      - name: Fingerprint actual compiled test prototype
        run: |
          set -euo pipefail
          node build-manifest.mjs out/ClimbBurnPrototype.sol/ClimbBurnPrototype.json src/ClimbBurnPrototype.sol "$GITHUB_SHA" "$RUNNER_TEMP/climb-burn-build-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: climb-burn-build-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/climb-burn-build-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Test read-only creation simulator
        run: node --test simulate-creation.test.mjs
      - name: Test read-only finalized creation verifier
        run: node --test verify-creation.test.mjs
      - name: Test unsigned handoff binding
        run: node --test unsigned-handoff.test.mjs
      - name: Test finalized first burn verifier
        run: node --test verify-burn.test.mjs
      - name: Validate manual burn inputs
        if: github.event_name == 'workflow_dispatch' && inputs.burn_tx != ''
        env:
          TEST_TOKEN: ${{ inputs.token }}
          TEST_CREATION_TX: ${{ inputs.creation_tx }}
        run: |
          set -euo pipefail
          test -n "$TEST_TOKEN" && test -n "$TEST_CREATION_TX"
      - name: Simulate exact compiled test-only creation
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.token == '' && inputs.creation_tx == ''
        env:
          TEST_PAYER: ${{ inputs.payer }}
        run: |
          set -euo pipefail
          node simulate-creation.mjs out/ClimbBurnPrototype.sol/ClimbBurnPrototype.json src/ClimbBurnPrototype.sol "$GITHUB_SHA" "$TEST_PAYER" > "$RUNNER_TEMP/climb-burn-creation-estimate.json"
          cat "$RUNNER_TEMP/climb-burn-creation-estimate.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.token == '' && inputs.creation_tx == ''
        with:
          name: climb-burn-creation-estimate-${{ github.sha }}
          path: ${{ runner.temp }}/climb-burn-creation-estimate.json
          retention-days: 7
          if-no-files-found: error
      - name: Prepare unsigned creation handoff for review
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.token == '' && inputs.creation_tx == ''
        env:
          TEST_PAYER: ${{ inputs.payer }}
        run: |
          set -euo pipefail
          node unsigned-handoff.mjs out/ClimbBurnPrototype.sol/ClimbBurnPrototype.json src/ClimbBurnPrototype.sol "$GITHUB_SHA" "$RUNNER_TEMP/climb-burn-creation-estimate.json" "$TEST_PAYER" "$RUNNER_TEMP/climb-burn-unsigned-handoff.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.token == '' && inputs.creation_tx == ''
        with:
          name: climb-burn-unsigned-handoff-${{ github.sha }}
          path: ${{ runner.temp }}/climb-burn-unsigned-handoff.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify finalized test-only creation
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.token != '' || inputs.creation_tx != '')
        env:
          TEST_PAYER: ${{ inputs.payer }}
          TEST_TOKEN: ${{ inputs.token }}
          TEST_CREATION_TX: ${{ inputs.creation_tx }}
        run: |
          set -euo pipefail
          node verify-creation.mjs out/ClimbBurnPrototype.sol/ClimbBurnPrototype.json src/ClimbBurnPrototype.sol "$GITHUB_SHA" "$TEST_PAYER" "$TEST_TOKEN" "$TEST_CREATION_TX" > "$RUNNER_TEMP/climb-burn-creation-evidence.json"
          cat "$RUNNER_TEMP/climb-burn-creation-evidence.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.token != '' || inputs.creation_tx != '')
        with:
          name: climb-burn-creation-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/climb-burn-creation-evidence.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify finalized first 10-test-token burn
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.burn_tx != ''
        env:
          TEST_PAYER: ${{ inputs.payer }}
          TEST_TOKEN: ${{ inputs.token }}
          TEST_CREATION_TX: ${{ inputs.creation_tx }}
          TEST_BURN_TX: ${{ inputs.burn_tx }}
        run: |
          set -euo pipefail
          node verify-burn.mjs out/ClimbBurnPrototype.sol/ClimbBurnPrototype.json src/ClimbBurnPrototype.sol "$GITHUB_SHA" "$TEST_PAYER" "$TEST_TOKEN" "$TEST_CREATION_TX" "$TEST_BURN_TX" > "$RUNNER_TEMP/climb-burn-first-burn-evidence.json"
          cat "$RUNNER_TEMP/climb-burn-first-burn-evidence.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.burn_tx != ''
        with:
          name: climb-burn-first-burn-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/climb-burn-first-burn-evidence.json
          retention-days: 7
          if-no-files-found: error
