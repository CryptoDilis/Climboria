name: Base DEX Candidate Uniswap V3 Pool Observation
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/base-univ3-candidate-pool-observation.mjs"
      - ".github/workflows/base-univ3-candidate-pool-observation.yml"
      - "dex/base-execution/univ3-action-policy.mjs"
      - "dex/base-execution/intent-policy.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Offline syntax and route regression
        run: |
          node --check .github/scripts/base-univ3-candidate-pool-observation.mjs
          node --test .github/scripts/base-univ3-action-policy.test.mjs
          grep -Fqx 'export const BASE_EXECUTION_ENABLED=false;' dex/base-execution/intent-policy.mjs
      - name: Corroborate candidate pool using public read-only RPCs
        run: node .github/scripts/base-univ3-candidate-pool-observation.mjs
