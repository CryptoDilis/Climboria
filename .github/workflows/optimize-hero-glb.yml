name: Build Optimized Hero GLB

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/optimize-hero-glb.yml'
      - '.github/scripts/optimize_hero_glb.py'
      - '.github/scripts/verify_hero_optimization.py'
      - 'assets/characters/Climboria_Hero.glb'

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install 'Pillow>=11,<13'
      - name: Optimize GLB textures without modifying animation buffers
        run: |
          python .github/scripts/optimize_hero_glb.py assets/characters/Climboria_Hero.glb Climboria_Hero_mobile_optimized.glb
          python .github/scripts/verify_hero_optimization.py assets/characters/Climboria_Hero.glb Climboria_Hero_mobile_optimized.glb
      - name: Upload optimized GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Climboria_Hero_mobile_optimized
          path: Climboria_Hero_mobile_optimized.glb
          if-no-files-found: error
          retention-days: 14
