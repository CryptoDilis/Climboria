name: Climboria Chest Rarity and Map Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "game/play.html"
      - "assets/chests/**"
      - ".github/scripts/game-chest-rarity-smoke.mjs"
      - ".github/workflows/game-chest-rarity-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climboria-chest-rarity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-chest-reward-map:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test harness
        timeout-minutes: 8
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/climboria-chests-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/game/play.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/climboria-chests-http.log
          exit 1
      - name: Verify real-world chest loot visibility and map
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m node .github/scripts/game-chest-rarity-smoke.mjs
      - name: Preserve world preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climboria-rarity-chest-world-preview
          path: climboria-rarity-chest-world-preview.png
          if-no-files-found: warn
          retention-days: 7
