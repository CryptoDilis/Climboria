[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 1
evm_version = "paris"
allow_paths = ["../v3-testnet"]
remappings = ["safe-contracts/=lib/safe-contracts/contracts/", "openzeppelin-contracts/=lib/openzeppelin-contracts/", "v3-src/=../v3-testnet/src/"]
