<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CLIMBOUND TEST</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070a;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud{
  position:fixed;
  top:20px;
  left:20px;
  z-index:20;
  color:white;
  pointer-events:none;
}

#title{
  font-size:28px;
  font-weight:900;
  letter-spacing:5px;
}

#status{
  margin-top:10px;
  display:inline-block;
  padding:10px 14px;
  background:rgba(0,0,0,.75);
  border-radius:8px;
  font-size:13px;
}

#statusText{
  color:#55ff70;
  font-weight:bold;
}

#help{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  color:white;
  background:rgba(0,0,0,.8);
  padding:12px 18px;
  border-radius:8px;
  text-align:center;
}

#error{
  display:none;
  position:fixed;
  left:20px;
  right:20px;
  bottom:80px;
  z-index:100;
  padding:18px;
  background:#5b1111;
  border:2px solid #ff4444;
  color:white;
  border-radius:10px;
  font-family:monospace;
  white-space:pre-wrap;
}

#start{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#05070a;
}

#panel{
  width:min(90%,500px);
  padding:40px;
  text-align:center;
  color:white;
  background:#0d1217;
  border:1px solid #55ff70;
  border-radius:18px;
}

#panel h1{
  margin:0 0 15px;
  font-size:44px;
  letter-spacing:6px;
}

#panel p{
  color:#aaa;
  line-height:1.6;
}

#startButton{
  margin-top:15px;
  padding:15px 30px;
  border:0;
  border-radius:8px;
  background:#55ff70;
  color:#031006;
  font-weight:900;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="title">CLIMBOUND</div>

  <div id="status">
    SYSTEM:
    <span id="statusText">LOADING...</span>
  </div>
</div>

<div id="help">
  🪣 HERO &nbsp;&nbsp; 🔨 HAMMER &nbsp;&nbsp;
  <b>🟢 GREEN = GRIP</b>
</div>

<div id="error"></div>

<div id="start">
  <div id="panel">
    <h1>CLIMBOUND</h1>

    <p>
      3D climbing prototype.<br>
      This is the visual foundation test.
    </p>

    <button id="startButton">
      START CLIMBING
    </button>
  </div>
</div>

<script type="module">

/* =====================================================
   THREE.JS
===================================================== */

import * as THREE from
"https://esm.sh/three@0.180.0";


/* =====================================================
   VARIABLES
===================================================== */

let scene;
let camera;
let renderer;

let hero;
let hammer;

let running=false;

const grips=[];

const mouse={
  x:0,
  y:0
};


/* =====================================================
   ERROR DISPLAY
===================================================== */

function showError(message){

  const box=
    document.getElementById("error");

  box.style.display="block";

  box.textContent=
    "CLIMBOUND ERROR\n\n"+message;

  document.getElementById("statusText")
    .textContent="ERROR";

  document.getElementById("statusText")
    .style.color="#ff4444";
}


/* =====================================================
   INIT
===================================================== */

function init(){

  try{

    document.getElementById("statusText")
      .textContent="THREE.JS LOADED";


    /* SCENE */

    scene=new THREE.Scene();

    scene.background=
      new THREE.Color(0x071018);


    /* CAMERA */

    camera=
      new THREE.PerspectiveCamera(
        60,
        window.innerWidth/
        window.innerHeight,
        0.1,
        200
      );

    camera.position.set(
      0,
      7,
      25
    );


    /* RENDERER */

    renderer=
      new THREE.WebGLRenderer({
        antialias:true
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document
      .getElementById("game")
      .appendChild(
        renderer.domElement
      );


    /* LIGHT */

    const ambient=
      new THREE.AmbientLight(
        0xffffff,
        2
      );

    scene.add(ambient);


    const light=
      new THREE.DirectionalLight(
        0xffffff,
        3
      );

    light.position.set(
      5,
      15,
      20
    );

    scene.add(light);


    /* CREATE WORLD */

    createMountain();

    createHero();

    createHammer();

    createGrips();


    /* INPUT */

    window.addEventListener(
      "mousemove",
      mouseMove
    );

    window.addEventListener(
      "mousedown",
      mouseDown
    );

    window.addEventListener(
      "mouseup",
      mouseUp
    );

    window.addEventListener(
      "resize",
      resize
    );


    document
      .getElementById("startButton")
      .addEventListener(
        "click",
        startGame
      );


    document.getElementById("statusText")
      .textContent="READY";


    animate();

  }catch(error){

    showError(
      error.stack ||
      error.message ||
      String(error)
    );
  }
}


/* =====================================================
   MOUNTAIN
===================================================== */

function createMountain(){

  const mountain=
    new THREE.Mesh(

      new THREE.ConeGeometry(
        18,
        65,
        8
      ),

      new THREE.MeshStandardMaterial({
        color:0x303b43,
        roughness:1
      })
    );


  mountain.position.set(
    0,
    31,
    -8
  );


  mountain.scale.z=0.7;


  scene.add(mountain);
}


/* =====================================================
   HERO
===================================================== */

function createHero(){

  hero=
    new THREE.Group();


  /* POT */

  const pot=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        1,
        1.25,
        1.5,
        24
      ),

      new THREE.MeshStandardMaterial({
        color:0xd4773d
      })
    );


  hero.add(pot);


  /* HEAD */

  const head=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.65,
        24,
        24
      ),

      new THREE.MeshStandardMaterial({
        color:0xe0a17a
      })
    );


  head.position.y=1.1;

  hero.add(head);


  /* HAT */

  const hat=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        0.75,
        0.55,
        0.3,
        20
      ),

      new THREE.MeshStandardMaterial({
        color:0x222831
      })
    );


  hat.position.y=1.65;

  hero.add(hat);


  /* HERO POSITION */

  hero.position.set(
    0,
    2,
    3
  );


  scene.add(hero);
}


/* =====================================================
   HAMMER
===================================================== */

function createHammer(){

  hammer=
    new THREE.Group();


  const handle=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        0.09,
        0.09,
        3.5,
        12
      ),

      new THREE.MeshStandardMaterial({
        color:0x8b542d
      })
    );


  handle.rotation.z=
    Math.PI/2;


  hammer.add(handle);


  const head=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        0.5,
        0.5,
        1.4
      ),

      new THREE.MeshStandardMaterial({
        color:0xcfd6da,
        metalness:.8,
        roughness:.2
      })
    );


  head.position.x=1.7;

  hammer.add(head);


  /* BRIGHT TIP */

  const tip=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.28,
        16,
        16
      ),

      new THREE.MeshBasicMaterial({
        color:0xffff00
      })
    );


  tip.position.x=2.3;

  hammer.add(tip);


  hammer.userData.tip=tip;


  hammer.position.set(
    3,
    3,
    4
  );


  scene.add(hammer);
}


/* =====================================================
   GRIPS
===================================================== */

function createGrips(){

  const positions=[
    [-5,4],
    [4,6],
    [-3,9],
    [5,12],
    [0,15],
    [-5,18],
    [3,21],
    [-2,24],
    [5,27],
    [0,30],
    [-4,33],
    [3,36],
    [-2,39],
    [4,42],
    [0,45],
    [-4,48],
    [3,51],
    [0,54]
  ];


  positions.forEach(
    ([x,y])=>{

      const group=
        new THREE.Group();


      /* HUGE GREEN GLOW */

      const glow=
        new THREE.Mesh(

          new THREE.SphereGeometry(
            1.3,
            16,
            16
          ),

          new THREE.MeshBasicMaterial({
            color:0x00ff44,
            transparent:true,
            opacity:.22
          })
        );


      group.add(glow);


      /* RING */

      const ring=
        new THREE.Mesh(

          new THREE.TorusGeometry(
            .8,
            .18,
            16,
            32
          ),

          new THREE.MeshBasicMaterial({
            color:0x00ff44
          })
        );


      group.add(ring);


      /* CENTER */

      const center=
        new THREE.Mesh(

          new THREE.SphereGeometry(
            .35,
            16,
            16
          ),

          new THREE.MeshBasicMaterial({
            color:0xffffff
          })
        );


      group.add(center);


      group.position.set(
        x,
        y,
        3
      );


      scene.add(group);


      grips.push({
        group,
        x,
        y
      });
    }
  );
}


/* =====================================================
   MOUSE
===================================================== */

function mouseMove(event){

  mouse.x=
    event.clientX/
    window.innerWidth*
    2-1;


  mouse.y=
    -(event.clientY/
    window.innerHeight)*
    2+1;
}


/* =====================================================
   HAMMER UPDATE
===================================================== */

function updateHammer(){

  const targetX=
    hero.position.x+
    mouse.x*6;


  const targetY=
    hero.position.y+
    mouse.y*5;


  hammer.position.x+=
    (targetX-
     hammer.position.x)*.2;


  hammer.position.y+=
    (targetY-
     hammer.position.y)*.2;


  hammer.position.z=4;
}


/* =====================================================
   GRAB TEST
===================================================== */

function mouseDown(event){

  if(!running)return;

  if(event.button!==0)return;


  const tip=
    new THREE.Vector3();


  hammer.userData.tip
    .getWorldPosition(tip);


  let nearest=null;

  let distance=Infinity;


  grips.forEach(
    grip=>{

      const p=
        new THREE.Vector3(
          grip.x,
          grip.y,
          3
        );


      const d=
        tip.distanceTo(p);


      if(d<distance){

        distance=d;

        nearest=grip;
      }
    }
  );


  if(nearest && distance<3){

    document.getElementById(
      "statusText"
    ).textContent=
      "GRIP LOCKED";

    document.getElementById(
      "statusText"
    ).style.color=
      "#55ff70";


    nearest.group.scale.setScalar(1.5);

  }else{

    document.getElementById(
      "statusText"
    ).textContent=
      "MISSED";

    document.getElementById(
      "statusText"
    ).style.color=
      "#ff4444";
  }
}


/* =====================================================
   MOUSE UP
===================================================== */

function mouseUp(){

  grips.forEach(
    grip=>{
      grip.group.scale.setScalar(1);
    }
  );


  if(running){

    document.getElementById(
      "statusText"
    ).textContent=
      "READY";

    document.getElementById(
      "statusText"
    ).style.color=
      "#55ff70";
  }
}


/* =====================================================
   START
===================================================== */

function startGame(){

  document.getElementById(
    "start"
  ).style.display="none";


  running=true;


  document.getElementById(
    "statusText"
  ).textContent=
    "READY";
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  camera.aspect=
    window.innerWidth/
    window.innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}


/* =====================================================
   LOOP
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(running){

    updateHammer();

  }


  renderer.render(
    scene,
    camera
  );
}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
