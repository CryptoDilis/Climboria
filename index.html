<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIMBOUND — Genesis Summit</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07111d;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 20%, #294d70 0%, #102238 38%, #050b13 100%);
}

/* CAMERA WORLD */
#camera {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

#world {
  position: absolute;
  width: 100%;
  height: 9000px;
  left: 0;
  top: 0;
  transition: transform 0.04s linear;
}

/* MOUNTAIN */
#mountain {
  position: absolute;
  width: min(760px, 86vw);
  height: 9000px;
  left: 50%;
  transform: translateX(-50%);
  background:
    linear-gradient(
      90deg,
      #172839 0%,
      #263e53 28%,
      #344f66 50%,
      #243b50 72%,
      #142534 100%
    );
  clip-path: polygon(
    17% 100%,
    8% 85%,
    15% 73%,
    6% 61%,
    17% 49%,
    9% 37%,
    20% 25%,
    12% 14%,
    25% 0%,
    75% 0%,
    88% 14%,
    80% 25%,
    91% 37%,
    83% 49%,
    94% 61%,
    85% 73%,
    92% 85%,
    83% 100%
  );
  box-shadow: 0 0 80px rgba(0,0,0,.6);
}

/* SNOW */
#snow {
  position: absolute;
  width: min(760px, 86vw);
  height: 9000px;
  left: 50%;
  transform: translateX(-50%);
  background:
    linear-gradient(
      110deg,
      transparent 0 18%,
      rgba(255,255,255,.16) 18% 24%,
      transparent 24% 45%,
      rgba(255,255,255,.10) 45% 51%,
      transparent 51% 72%,
      rgba(255,255,255,.13) 72% 78%,
      transparent 78%
    );
  clip-path: polygon(
    25% 0,
    75% 0,
    67% 8%,
    58% 15%,
    67% 23%,
    55% 31%,
    63% 40%,
    50% 48%,
    59% 58%,
    46% 67%,
    56% 76%,
    43% 85%,
    52% 94%,
    45% 100%,
    55% 100%,
    0 100%,
    10% 85%,
    6% 70%,
    16% 55%,
    8% 40%,
    18% 25%,
    12% 12%
  );
  opacity: .5;
}

/* ROUTE */
#route {
  position: absolute;
  width: min(620px, 72vw);
  height: 9000px;
  left: 50%;
  transform: translateX(-50%);
}

/* GRIPS */
.grip {
  position: absolute;
  width: 28px;
  height: 18px;
  border-radius: 50%;
  background: linear-gradient(#e7c878, #8f6b27);
  box-shadow:
    0 0 8px rgba(255,205,80,.35),
    inset 0 2px 2px rgba(255,255,255,.3);
  transform: rotate(-15deg);
}

.grip::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  left: 9px;
  top: 5px;
  border-radius: 50%;
  background: #263b4c;
}

/* SUMMIT */
#summit {
  position: absolute;
  width: min(620px, 72vw);
  height: 150px;
  left: 50%;
  transform: translateX(-50%);
  top: 20px;
  border: 3px solid rgba(255,216,90,.9);
  background: linear-gradient(
    rgba(255,215,70,.22),
    rgba(255,215,70,.04)
  );
  box-shadow: 0 0 45px rgba(255,215,70,.2);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 25px;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 8px;
  color: #ffe98a;
}

/* PLAYER */
#player {
  position: absolute;
  width: 76px;
  height: 105px;
  z-index: 20;
  pointer-events: none;
}

/* POT */
#pot {
  position: absolute;
  width: 58px;
  height: 48px;
  left: 8px;
  top: 43px;
  background: linear-gradient(145deg, #d5d9dd, #727a82 60%, #424950);
  border-radius: 8px 8px 24px 24px;
  border: 3px solid #252b30;
  box-shadow:
    inset 0 5px 5px rgba(255,255,255,.25),
    0 5px 10px rgba(0,0,0,.5);
}

#pot::before {
  content: "";
  position: absolute;
  width: 63px;
  height: 13px;
  left: -5px;
  top: -6px;
  border-radius: 50%;
  background: #8d969e;
  border: 3px solid #252b30;
}

#pot::after {
  content: "";
  position: absolute;
  width: 25px;
  height: 12px;
  left: 13px;
  bottom: 7px;
  border-radius: 50%;
  background: rgba(0,0,0,.18);
}

/* HEAD */
#head {
  position: absolute;
  width: 34px;
  height: 34px;
  left: 20px;
  top: 14px;
  border-radius: 50%;
  background: #e9b88e;
  border: 3px solid #573b2c;
  z-index: 3;
}

#head::before {
  content: "";
  position: absolute;
  width: 38px;
  height: 13px;
  left: -5px;
  top: -5px;
  border-radius: 50% 50% 20% 20%;
  background: #30343a;
}

/* BODY */
#body {
  position: absolute;
  width: 24px;
  height: 27px;
  left: 25px;
  top: 42px;
  border-radius: 8px;
  background: #c46b32;
  border: 2px solid #613719;
  z-index: 2;
}

/* HAMMER */
#hammer {
  position: absolute;
  width: 100px;
  height: 100px;
  left: 25px;
  top: 18px;
  transform-origin: 10px 80px;
  transform: rotate(-48deg);
  z-index: 10;
}

#hammerHandle {
  position: absolute;
  width: 9px;
  height: 76px;
  left: 9px;
  top: 18px;
  border-radius: 8px;
  background: linear-gradient(90deg, #6f4528, #d29a57, #65401f);
  box-shadow: 2px 3px 4px rgba(0,0,0,.4);
}

#hammerHead {
  position: absolute;
  width: 38px;
  height: 22px;
  left: -5px;
  top: 2px;
  border-radius: 5px;
  background: linear-gradient(#9ca5ac, #4c555d);
  border: 3px solid #252a2e;
}

/* UI */
#hud {
  position: fixed;
  z-index: 100;
  left: 18px;
  right: 18px;
  top: 15px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
}

.panel {
  padding: 11px 14px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 12px;
  background: rgba(5,12,20,.72);
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 30px rgba(0,0,0,.2);
}

.title {
  font-size: 12px;
  letter-spacing: 3px;
  color: #9fb7cc;
}

.value {
  font-size: 21px;
  font-weight: 900;
  margin-top: 3px;
}

#heightValue {
  color: #ffd95c;
}

#staminaBar {
  width: 150px;
  height: 8px;
  margin-top: 7px;
  background: #182432;
  border-radius: 99px;
  overflow: hidden;
}

#staminaFill {
  width: 100%;
  height: 100%;
  background: #6de29a;
  transition: width .1s linear;
}

#instructions {
  position: fixed;
  z-index: 100;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #aabed0;
  font-size: 13px;
  background: rgba(4,10,17,.72);
  padding: 10px 15px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.1);
}

#startScreen,
#gameOver {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(3,8,14,.86);
  backdrop-filter: blur(8px);
}

.modal {
  width: min(440px, 90vw);
  text-align: center;
  padding: 35px 25px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(13,25,39,.94);
  box-shadow: 0 30px 100px rgba(0,0,0,.5);
}

.logo {
  font-size: 42px;
  font-weight: 1000;
  letter-spacing: 8px;
}

.subtitle {
  margin-top: 10px;
  color: #9eb3c7;
  letter-spacing: 3px;
}

button {
  margin-top: 25px;
  padding: 15px 28px;
  border: 0;
  border-radius: 12px;
  background: #e6b93d;
  color: #101820;
  font-weight: 900;
  letter-spacing: 2px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #ffd75d;
}

.hidden {
  display: none !important;
}

/* MOBILE */
#mobileControls {
  position: fixed;
  z-index: 150;
  left: 15px;
  right: 15px;
  bottom: 65px;
  display: none;
  justify-content: space-between;
  pointer-events: none;
}

.mobileGroup {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.mobileBtn {
  width: 58px;
  height: 58px;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  background: rgba(10,20,30,.78);
  color: white;
  border: 1px solid rgba(255,255,255,.2);
  font-size: 22px;
}

@media (max-width: 700px) {
  #mobileControls {
    display: flex;
  }

  #instructions {
    display: none;
  }

  .logo {
    font-size: 32px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="camera">
    <div id="world">

      <div id="mountain"></div>
      <div id="snow"></div>

      <div id="summit">
        SUMMIT
      </div>

      <div id="route"></div>

      <div id="player">
        <div id="head"></div>
        <div id="body"></div>
        <div id="pot"></div>

        <div id="hammer">
          <div id="hammerHead"></div>
          <div id="hammerHandle"></div>
        </div>
      </div>

    </div>
  </div>

  <div id="hud">

    <div class="panel">
      <div class="title">CLIMBOUND</div>
      <div class="value">GENESIS SUMMIT</div>
    </div>

    <div class="panel">
      <div class="title">HEIGHT</div>
      <div class="value">
        <span id="heightValue">0</span>m
      </div>
    </div>

    <div class="panel">
      <div class="title">STAMINA</div>
      <div id="staminaBar">
        <div id="staminaFill"></div>
      </div>
    </div>

  </div>

  <div id="instructions">
    A / D or ← / → Move &nbsp; • &nbsp;
    W / ↑ Climb &nbsp; • &nbsp;
    Shift = Boost
  </div>

  <div id="mobileControls">
    <div class="mobileGroup">
      <button class="mobileBtn" id="leftBtn">←</button>
      <button class="mobileBtn" id="rightBtn">→</button>
    </div>

    <div class="mobileGroup">
      <button class="mobileBtn" id="upBtn">↑</button>
    </div>
  </div>

  <div id="startScreen">
    <div class="modal">
      <div class="logo">CLIMBOUND</div>
      <div class="subtitle">GENESIS SUMMIT</div>
      <p style="margin-top:20px;color:#a8b8c8;line-height:1.6;">
        The mountain is waiting.<br>
        Climb higher. Reach the summit.
      </p>
      <button id="startBtn">BEGIN EXPEDITION</button>
    </div>
  </div>

  <div id="gameOver" class="hidden">
    <div class="modal">
      <div class="logo" style="font-size:30px;">EXPEDITION ENDED</div>
      <div class="subtitle">
        HEIGHT: <span id="finalHeight">0</span>m
      </div>
      <button id="restartBtn">TRY AGAIN</button>
    </div>
  </div>

</div>

<script>
const world = document.getElementById("world");
const route = document.getElementById("route");
const player = document.getElementById("player");
const hammer = document.getElementById("hammer");

const heightValue = document.getElementById("heightValue");
const staminaFill = document.getElementById("staminaFill");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");
const finalHeight = document.getElementById("finalHeight");

const SUMMIT = 8500;
const WORLD_HEIGHT = 9000;

let running = false;
let lastTime = 0;

let x = 0;
let y = WORLD_HEIGHT - 180;

let velocityY = 0;
let cameraY = 0;

let stamina = 100;
let height = 0;

let keys = {
  left: false,
  right: false,
  up: false,
  down: false,
  boost: false
};

let grips = [];

/* BUILD HANDHOLDS */
function buildGrips() {
  route.innerHTML = "";
  grips = [];

  let currentY = WORLD_HEIGHT - 220;

  while (currentY > 170) {

    const center = route.clientWidth / 2;

    const spread =
      Math.sin(currentY * 0.018) * 150 +
      Math.sin(currentY * 0.047) * 70;

    const gx = center + spread;

    const grip = document.createElement("div");

    grip.className = "grip";

    grip.style.left = `${gx}px`;
    grip.style.top = `${currentY}px`;

    route.appendChild(grip);

    grips.push({
      x: gx,
      y: currentY,
      element: grip
    });

    currentY -= 145 + Math.random() * 85;
  }
}

/* KEYBOARD */
window.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
    keys.left = true;
  }

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
    keys.right = true;
  }

  if (
    e.key === "ArrowUp" ||
    e.key.toLowerCase() === "w" ||
    e.key === " "
  ) {
    keys.up = true;
  }

  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
    keys.down = true;
  }

  if (e.key === "Shift") {
    keys.boost = true;
  }
});

window.addEventListener("keyup", e => {

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
    keys.left = false;
  }

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
    keys.right = false;
  }

  if (
    e.key === "ArrowUp" ||
    e.key.toLowerCase() === "w" ||
    e.key === " "
  ) {
    keys.up = false;
  }

  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
    keys.down = false;
  }

  if (e.key === "Shift") {
    keys.boost = false;
  }
});

/* MOBILE BUTTONS */
function holdButton(id, key) {

  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
  });

  btn.addEventListener("pointerup", e => {
    e.preventDefault();
    keys[key] = false;
  });

  btn.addEventListener("pointercancel", () => {
    keys[key] = false;
  });

  btn.addEventListener("pointerleave", () => {
    keys[key] = false;
  });
}

holdButton("leftBtn", "left");
holdButton("rightBtn", "right");
holdButton("upBtn", "up");

/* START */
function startGame() {

  buildGrips();

  const width = route.clientWidth;

  x = width / 2;
  y = WORLD_HEIGHT - 180;

  velocityY = 0;
  cameraY = 0;

  stamina = 100;
  height = 0;

  running = true;

  startScreen.classList.add("hidden");
  gameOver.classList.add("hidden");

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

/* UPDATE */
function update(dt) {

  const horizontalSpeed = keys.boost ? 430 : 280;

  if (keys.left) {
    x -= horizontalSpeed * dt;
    hammer.style.transform = "rotate(-72deg)";
  }

  if (keys.right) {
    x += horizontalSpeed * dt;
    hammer.style.transform = "rotate(-25deg)";
  }

  if (!keys.left && !keys.right) {
    hammer.style.transform = "rotate(-48deg)";
  }

  /* CLIMB */
  if (keys.up && stamina > 0) {

    velocityY = keys.boost ? -330 : -210;

    stamina -= (keys.boost ? 20 : 12) * dt;

  } else if (keys.down) {

    velocityY = 170;

  } else {

    /* slow falling */
    velocityY += 220 * dt;
  }

  y += velocityY * dt;

  /* BOUNDS */

  const width = route.clientWidth;

  x = Math.max(30, Math.min(width - 30, x));

  y = Math.max(80, Math.min(WORLD_HEIGHT - 100, y));

  /* STAMINA */

  if (!keys.up) {
    stamina += 18 * dt;
  }

  stamina = Math.max(0, Math.min(100, stamina));

  staminaFill.style.width = `${stamina}%`;

  /* HEIGHT */

  height = Math.max(
    0,
    Math.floor(
      ((WORLD_HEIGHT - y) /
      (WORLD_HEIGHT - SUMMIT)) * SUMMIT
    )
  );

  height = Math.min(SUMMIT, height);

  heightValue.textContent = height;

  /* CAMERA FOLLOW */

  const screenHeight = window.innerHeight;

  const desiredCamera =
    y - screenHeight * 0.58;

  cameraY +=
    (desiredCamera - cameraY) *
    Math.min(1, dt * 7);

  cameraY = Math.max(
    0,
    Math.min(
      WORLD_HEIGHT - screenHeight,
      cameraY
    )
  );

  world.style.transform =
    `translate3d(0, ${-cameraY}px, 0)`;

  /* PLAYER */

  player.style.left =
    `${(window.innerWidth - route.clientWidth) / 2 + x - 38}px`;

  player.style.top =
    `${y - 55}px`;

  /* SUMMIT */

  if (y <= SUMMIT) {
    finishGame();
  }
}

/* LOOP */
function loop(now) {

  if (!running) return;

  const dt =
    Math.min(0.033, (now - lastTime) / 1000);

  lastTime = now;

  update(dt);

  requestAnimationFrame(loop);
}

/* FINISH */
function finishGame() {

  running = false;

  finalHeight.textContent = height;

  gameOver.classList.remove("hidden");
}

/* BUTTONS */
document.getElementById("startBtn")
  .addEventListener("click", startGame);

document.getElementById("restartBtn")
  .addEventListener("click", startGame);
</script>

</body>
</html>
