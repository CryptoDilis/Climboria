<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIMBOUND</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      z-index: 10;
      top: 18px;
      left: 18px;
      color: white;
      pointer-events: none;
      text-shadow: 0 2px 5px black;
    }

    #title {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    #status {
      margin-top: 10px;
      padding: 9px 13px;
      display: inline-block;
      border-radius: 7px;
      background: rgba(0,0,0,.65);
      border: 1px solid rgba(255,255,255,.2);
      font-size: 12px;
    }

    #instructions {
      position: fixed;
      z-index: 10;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      color: white;
      background: rgba(0,0,0,.7);
      border-radius: 9px;
      text-align: center;
      font-size: 13px;
      pointer-events: none;
    }

    #instructions b {
      color: #52ff6a;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2,5,8,.94);
    }

    #panel {
      width: min(90%, 500px);
      padding: 40px;
      color: white;
      text-align: center;
      border-radius: 18px;
      background: #0b1014;
      border: 1px solid rgba(82,255,106,.35);
    }

    #panel h1 {
      margin: 0 0 12px;
      font-size: 44px;
      letter-spacing: 6px;
    }

    #panel p {
      color: #aeb8bc;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    #startButton {
      padding: 15px 30px;
      border: 0;
      border-radius: 9px;
      background: #52ff6a;
      color: #031006;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="title">CLIMBOUND</div>
  <div id="status">HAMMER: <span id="statusText">FREE</span></div>
</div>

<div id="instructions">
  Move the mouse to control the <b>HAMMER</b>.<br>
  Put the hammer on a <b>GREEN GRIP</b> and hold LEFT CLICK.
</div>

<div id="start">
  <div id="panel">
    <h1>CLIMBOUND</h1>

    <p>
      Physics climbing prototype.<br>
      Grab the green handholds and pull yourself upward.
    </p>

    <button id="startButton">
      START CLIMBING
    </button>
  </div>
</div>


<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import * as CANNON from "https://esm.sh/cannon-es@0.20.0";


/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;
let world;

let hero;
let heroBody;

let hammer;
let hammerTip;

let running = false;
let grabbedGrip = null;

const grips = [];

const mouse = {
  x: 0,
  y: 0
};

const clock = new THREE.Clock();


/* =========================================================
   INITIALIZE
========================================================= */

function init() {

  /* SCENE */

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x05080c);

  scene.fog =
    new THREE.Fog(
      0x05080c,
      20,
      90
    );


  /* CAMERA */

  camera =
    new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );

  camera.position.set(
    0,
    7,
    25
  );


  /* RENDERER */

  renderer =
    new THREE.WebGLRenderer({
      antialias: true
    });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.shadowMap.enabled = true;

  document
    .getElementById("game")
    .appendChild(renderer.domElement);


  /* LIGHTING */

  const ambient =
    new THREE.HemisphereLight(
      0xffffff,
      0x11151a,
      2.5
    );

  scene.add(ambient);


  const light =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  light.position.set(
    -10,
    20,
    20
  );

  light.castShadow = true;

  scene.add(light);


  /* PHYSICS */

  world =
    new CANNON.World();

  world.gravity.set(
    0,
    -12,
    0
  );


  createMountain();

  createHero();

  createHammer();

  createGrips();

  createGround();


  /* EVENTS */

  window.addEventListener(
    "mousemove",
    mouseMove
  );

  window.addEventListener(
    "mousedown",
    mouseDown
  );

  window.addEventListener(
    "mouseup",
    mouseUp
  );

  window.addEventListener(
    "resize",
    resize
  );


  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      startGame
    );


  animate();
}


/* =========================================================
   MOUNTAIN
========================================================= */

function createMountain() {

  const geometry =
    new THREE.ConeGeometry(
      25,
      75,
      8,
      8
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0x252d33,
      roughness: 1
    });

  const mountain =
    new THREE.Mesh(
      geometry,
      material
    );

  mountain.position.set(
    0,
    35,
    -7
  );

  mountain.scale.z =
    0.8;

  mountain.rotation.y =
    0.3;

  mountain.receiveShadow = true;

  scene.add(mountain);


  /* Rocks */

  for (
    let i = 0;
    i < 30;
    i++
  ) {

    const rock =
      new THREE.Mesh(
        new THREE.DodecahedronGeometry(1),
        new THREE.MeshStandardMaterial({
          color: 0x161d22,
          roughness: 1
        })
      );

    const side =
      Math.random() > .5
        ? 1
        : -1;

    rock.position.set(
      side *
        (4 + Math.random() * 9),
      Math.random() * 60,
      0
    );

    rock.scale.set(
      1 + Math.random() * 3,
      1 + Math.random() * 3,
      1 + Math.random() * 2
    );

    rock.rotation.set(
      Math.random(),
      Math.random(),
      Math.random()
    );

    rock.receiveShadow = true;

    scene.add(rock);
  }
}


/* =========================================================
   HERO
========================================================= */

function createHero() {

  /*
     PHYSICS BODY
  */

  heroBody =
    new CANNON.Body({
      mass: 5,
      shape:
        new CANNON.Sphere(1),
      linearDamping: 0.15,
      angularDamping: 0.5
    });

  heroBody.position.set(
    0,
    1.2,
    3
  );

  world.addBody(
    heroBody
  );


  /*
     VISUAL HERO
  */

  hero =
    new THREE.Group();


  /* POT */

  const pot =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.85,
        1.1,
        1.35,
        24
      ),
      new THREE.MeshStandardMaterial({
        color: 0xc8793d,
        roughness: .75
      })
    );

  pot.castShadow = true;

  hero.add(pot);


  /* HEAD */

  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.58,
        24,
        24
      ),
      new THREE.MeshStandardMaterial({
        color: 0xdba17c,
        roughness: .8
      })
    );

  head.position.y =
    1.0;

  head.castShadow = true;

  hero.add(head);


  /* HAT */

  const hat =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.65,
        0.5,
        0.25,
        20
      ),
      new THREE.MeshStandardMaterial({
        color: 0x20252a
      })
    );

  hat.position.y =
    1.48;

  hat.castShadow = true;

  hero.add(hat);


  /*
     LITTLE EYES
  */

  const eyeMaterial =
    new THREE.MeshBasicMaterial({
      color: 0x111111
    });

  const eye1 =
    new THREE.Mesh(
      new THREE.SphereGeometry(.055, 8, 8),
      eyeMaterial
    );

  eye1.position.set(
    -.18,
    1.05,
    -.54
  );

  hero.add(eye1);


  const eye2 =
    eye1.clone();

  eye2.position.x =
    .18;

  hero.add(eye2);


  scene.add(hero);
}


/* =========================================================
   HAMMER
========================================================= */

function createHammer() {

  hammer =
    new THREE.Group();


  /* HANDLE */

  const handle =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .09,
        .09,
        3.4,
        12
      ),
      new THREE.MeshStandardMaterial({
        color: 0x6b3b1f
      })
    );

  handle.rotation.z =
    Math.PI / 2;

  hammer.add(handle);


  /* HEAD */

  const head =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .5,
        .5,
        1.25
      ),
      new THREE.MeshStandardMaterial({
        color: 0xc7d0d4,
        metalness: .8,
        roughness: .2
      })
    );

  head.position.x =
    1.65;

  hammer.add(head);


  /* TIP */

  hammerTip =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .18,
        16,
        16
      ),
      new THREE.MeshBasicMaterial({
        color: 0xffff00
      })
    );

  hammerTip.position.x =
    2.2;

  hammer.add(
    hammerTip
  );

  scene.add(hammer);
}


/* =========================================================
   GREEN GRIPS
========================================================= */

function createGrips() {

  const locations = [

    [-4, 4],
    [2, 6],
    [-2, 8],
    [4, 10],
    [0, 12],
    [-4, 15],
    [2, 18],
    [5, 21],
    [0, 24],
    [-4, 27],
    [2, 30],
    [-2, 33],
    [4, 36],
    [0, 39],
    [-4, 42],
    [2, 45],
    [-2, 48],
    [4, 51],
    [0, 54]
  ];


  locations.forEach(
    ([x, y], index) => {

      const group =
        new THREE.Group();


      /*
        OUTER GLOW
      */

      const glow =
        new THREE.Mesh(
          new THREE.SphereGeometry(
            1.25,
            20,
            20
          ),
          new THREE.MeshBasicMaterial({
            color: 0x00ff44,
            transparent: true,
            opacity: .15,
            depthWrite: false
          })
        );

      group.add(glow);


      /*
        BIG GREEN RING
      */

      const ring =
        new THREE.Mesh(
          new THREE.TorusGeometry(
            .75,
            .16,
            16,
            32
          ),
          new THREE.MeshBasicMaterial({
            color: 0x00ff44
          })
        );

      ring.rotation.x =
        Math.PI / 2;

      group.add(ring);


      /*
        CENTER
      */

      const center =
        new THREE.Mesh(
          new THREE.SphereGeometry(
            .32,
            16,
            16
          ),
          new THREE.MeshBasicMaterial({
            color: 0x8cff9a
          })
        );

      group.add(center);


      /*
        CROSS
      */

      const crossMaterial =
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        });

      const horizontal =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1.8,
            .08,
            .08
          ),
          crossMaterial
        );

      const vertical =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .08,
            1.8,
            .08
          ),
          crossMaterial
        );

      group.add(horizontal);
      group.add(vertical);


      /*
        POSITION
      */

      group.position.set(
        x,
        y,
        2
      );


      scene.add(group);


      grips.push({
        group,
        ring,
        glow,
        x,
        y,
        z: 2,
        index
      });

    }
  );
}


/* =========================================================
   GROUND
========================================================= */

function createGround() {

  const body =
    new CANNON.Body({
      mass: 0,
      shape:
        new CANNON.Box(
          new CANNON.Vec3(
            20,
            1,
            5
          )
        )
    });

  body.position.set(
    0,
    -1.5,
    0
  );

  world.addBody(body);


  const ground =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        40,
        2,
        10
      ),
      new THREE.MeshStandardMaterial({
        color: 0x12181c
      })
    );

  ground.position.set(
    0,
    -1.5,
    0
  );

  ground.receiveShadow = true;

  scene.add(ground);
}


/* =========================================================
   MOUSE
========================================================= */

function mouseMove(event) {

  mouse.x =
    event.clientX /
    window.innerWidth *
    2 -
    1;

  mouse.y =
    -(event.clientY /
      window.innerHeight) *
    2 +
    1;
}


function updateHammer() {

  if (!heroBody)
    return;


  /*
     Hammer follows mouse
     around hero.
  */

  const targetX =
    heroBody.position.x +
    mouse.x * 6;

  const targetY =
    heroBody.position.y +
    mouse.y * 5;


  hammer.position.x +=
    (targetX -
      hammer.position.x) *
    .25;

  hammer.position.y +=
    (targetY -
      hammer.position.y) *
    .25;

  hammer.position.z =
    3;


  const dx =
    mouse.x * 6;

  const dy =
    mouse.y * 5;

  hammer.rotation.z =
    -Math.atan2(
      dy,
      dx
    );
}


/* =========================================================
   FIND GRIP
========================================================= */

function getNearestGrip() {

  const tip =
    new THREE.Vector3();

  hammerTip.getWorldPosition(
    tip
  );


  let nearest = null;
  let distance = Infinity;


  grips.forEach(
    grip => {

      const gp =
        new THREE.Vector3(
          grip.x,
          grip.y,
          grip.z
        );

      const d =
        tip.distanceTo(gp);

      if (
        d < distance
      ) {

        distance = d;
        nearest = grip;

      }
    }
  );


  return {
    grip: nearest,
    distance
  };
}


/* =========================================================
   MOUSE DOWN
========================================================= */

function mouseDown(event) {

  if (!running)
    return;

  if (event.button !== 0)
    return;


  const result =
    getNearestGrip();


  if (
    result.grip &&
    result.distance < 2.3
  ) {

    grabbedGrip =
      result.grip;


    heroBody.velocity.set(
      0,
      0,
      0
    );


    document
      .getElementById("statusText")
      .textContent =
      "GRIP LOCKED";

    document
      .getElementById("statusText")
      .style.color =
      "#52ff6a";


    grabbedGrip.ring.scale.setScalar(
      1.35
    );

    grabbedGrip.glow.scale.setScalar(
      1.5
    );

    hammerTip.material.color.set(
      0xffffff
    );

  } else {

    document
      .getElementById("statusText")
      .textContent =
      "MISSED";

    document
      .getElementById("statusText")
      .style.color =
      "#ff5555";
  }
}


/* =========================================================
   MOUSE UP
========================================================= */

function mouseUp() {

  grabbedGrip = null;

  hammerTip.material.color.set(
    0xffff00
  );

  document
    .getElementById("statusText")
    .textContent =
    "FREE";

  document
    .getElementById("statusText")
    .style.color =
    "#52ff6a";
}


/* =========================================================
   CLIMB FORCE
========================================================= */

function climb() {

  if (
    !grabbedGrip ||
    !heroBody
  )
    return;


  const dx =
    grabbedGrip.x -
    heroBody.position.x;

  const dy =
    grabbedGrip.y -
    heroBody.position.y;


  /*
     Pull toward grip.
  */

  heroBody.applyForce(
    new CANNON.Vec3(
      dx * 65,
      dy * 65,
      0
    ),
    heroBody.position
  );


  /*
     Small upward assistance.
  */

  heroBody.applyForce(
    new CANNON.Vec3(
      0,
      8,
      0
    ),
    heroBody.position
  );
}


/* =========================================================
   SYNC HERO
========================================================= */

function syncHero() {

  hero.position.set(
    heroBody.position.x,
    heroBody.position.y,
    heroBody.position.z
  );

  hero.quaternion.set(
    heroBody.quaternion.x,
    heroBody.quaternion.y,
    heroBody.quaternion.z,
    heroBody.quaternion.w
  );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

  const targetY =
    heroBody.position.y + 5;


  camera.position.y +=
    (
      targetY -
      camera.position.y
    ) * .06;


  camera.lookAt(
    heroBody.position.x,
    camera.position.y,
    0
  );
}


/* =========================================================
   GRIP ANIMATION
========================================================= */

function animateGrips(time) {

  grips.forEach(
    (grip, index) => {

      const pulse =
        1 +
        Math.sin(
          time * .004 +
          index
        ) *
        .12;


      if (
        grip !== grabbedGrip
      ) {

        grip.ring.scale.setScalar(
          pulse
        );

        grip.glow.scale.setScalar(
          pulse
        );
      }
    }
  );
}


/* =========================================================
   START
========================================================= */

function startGame() {

  document
    .getElementById("start")
    .style.display =
    "none";

  running = true;

  heroBody.position.set(
    0,
    1.2,
    3
  );

  heroBody.velocity.set(
    0,
    0,
    0
  );
}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}


/* =========================================================
   LOOP
========================================================= */

function animate(time = 0) {

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );


  if (running) {

    updateHammer();

    climb();


    world.step(
      1 / 60,
      dt,
      3
    );


    syncHero();

    updateCamera();


    /*
       Reset if fallen.
    */

    if (
      heroBody.position.y <
      -7
    ) {

      heroBody.position.set(
        0,
        1.2,
        3
      );

      heroBody.velocity.set(
        0,
        0,
        0
      );

      grabbedGrip = null;
    }


    /*
       Highlight nearest grip.
    */

    const result =
      getNearestGrip();


    grips.forEach(
      grip => {

        if (
          grip === result.grip &&
          result.distance < 2.5
        ) {

          grip.ring.scale.setScalar(
            1.3
          );

          grip.glow.scale.setScalar(
            1.4
          );

        }
      }
    );
  }


  animateGrips(time);


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   START ENGINE
========================================================= */

init();

</script>

</body>
</html>
