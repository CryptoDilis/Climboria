<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIMBOUND — V0.1</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080b10;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 10;
  pointer-events: none;
}

.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 4px;
}

.version {
  margin-top: 3px;
  font-size: 11px;
  opacity: .55;
  letter-spacing: 2px;
}

#status {
  margin-top: 16px;
  padding: 9px 13px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(8px);
  border-radius: 8px;
  font-size: 12px;
}

#help {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  z-index: 10;
  padding: 10px 16px;
  background: rgba(0,0,0,.5);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px;
  font-size: 12px;
  text-align: center;
  opacity: .8;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at center, rgba(30,50,70,.55), rgba(3,6,10,.96));
}

.panel {
  width: min(430px, calc(100% - 32px));
  padding: 32px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(7,10,15,.88);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  box-shadow: 0 20px 80px rgba(0,0,0,.5);
}

.panel h1 {
  margin: 0;
  font-size: 38px;
  letter-spacing: 7px;
}

.panel .sub {
  margin-top: 8px;
  opacity: .55;
  font-size: 11px;
  letter-spacing: 3px;
}

.panel p {
  margin: 24px 0;
  line-height: 1.7;
  color: #cbd2da;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 13px 25px;
  background: white;
  color: #080b10;
  font-weight: 900;
  letter-spacing: 2px;
  cursor: pointer;
}

button:hover {
  transform: translateY(-1px);
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div id="hud">
  <div class="logo">CLIMBOUND</div>
  <div class="version">V0.1 // PHYSICS PROTOTYPE</div>
  <div id="status">HAMMER: FREE</div>
</div>

<div id="help">
  MOVE MOUSE • HOLD LEFT CLICK TO GRAB • DRAG HAMMER TO PULL
</div>

<div id="start">
  <div class="panel">
    <h1>CLIMBOUND</h1>
    <div class="sub">THE MOUNTAIN DOES NOT FORGIVE</div>

    <p>
      Your character is controlled by physics.<br>
      Use the hammer to catch the green grips.<br>
      Pull yourself upward instead of simply walking.
    </p>

    <button id="startBtn">START CLIMBING</button>
  </div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import * as CANNON from "https://esm.sh/cannon-es@0.20.0";

/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x070b11);

scene.fog = new THREE.FogExp2(
  0x070b11,
  0.018
);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

camera.position.set(
  0,
  4,
  16
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.HemisphereLight(
  0x9fb7d0,
  0x111111,
  2.2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  -10,
  20,
  12
);

sun.castShadow = true;

scene.add(sun);

/* =========================================================
   PHYSICS WORLD
========================================================= */

const world = new CANNON.World({
  gravity: new CANNON.Vec3(
    0,
    -12,
    0
  )
});

world.broadphase = new CANNON.SAPBroadphase(world);

world.allowSleep = false;

/* =========================================================
   MATERIALS
========================================================= */

const playerMaterial = new CANNON.Material("player");

const rockMaterial = new CANNON.Material("rock");

const playerRockContact =
  new CANNON.ContactMaterial(
    playerMaterial,
    rockMaterial,
    {
      friction: 0.75,
      restitution: 0.05
    }
  );

world.addContactMaterial(
  playerRockContact
);

/* =========================================================
   MOUNTAIN
========================================================= */

function createRock(
  x,
  y,
  z,
  sx,
  sy,
  sz,
  color = 0x303943
) {

  const geometry =
    new THREE.DodecahedronGeometry(
      1,
      1
    );

  const material =
    new THREE.MeshStandardMaterial({
      color,
      roughness: 1
    });

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.scale.set(
    sx,
    sy,
    sz
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  const shape =
    new CANNON.Box(
      new CANNON.Vec3(
        sx * .78,
        sy * .78,
        sz * .78
      )
    );

  const body =
    new CANNON.Body({
      mass: 0,
      material: rockMaterial,
      shape
    });

  body.position.set(
    x,
    y,
    z
  );

  world.addBody(body);

  return {
    mesh,
    body
  };
}

/* mountain wall */

createRock(
  -6,
  1,
  0,
  5,
  8,
  3
);

createRock(
  6,
  6,
  0,
  5,
  12,
  3
);

createRock(
  0,
  -5,
  0,
  12,
  2,
  3
);

/* scattered climbing rocks */

const rocks = [
  [-3, 1, -1, 2.2, 1.5, 1.7],
  [2.5, 3, -1, 2, 1.3, 1.5],
  [-2, 5.5, -1, 2.4, 1.4, 1.7],
  [2.8, 8, -1, 2.2, 1.4, 1.5],
  [-1.5, 10.5, -1, 2.5, 1.3, 1.6],
  [2.5, 13, -1, 2.3, 1.5, 1.7],
  [-2.5, 16, -1, 2.2, 1.5, 1.6],
  [1.5, 19, -1, 2.5, 1.4, 1.6],
  [-2, 22, -1, 2.2, 1.5, 1.6]
];

for (const r of rocks) {
  createRock(...r);
}

/* =========================================================
   PLAYER
========================================================= */

const playerGroup =
  new THREE.Group();

scene.add(playerGroup);

/* pot */

const potGeometry =
  new THREE.CylinderGeometry(
    .65,
    .8,
    1.15,
    24
  );

const potMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xb86b35,
    roughness: .75,
    metalness: .05
  });

const potMesh =
  new THREE.Mesh(
    potGeometry,
    potMaterial
  );

potMesh.castShadow = true;

playerGroup.add(potMesh);

/* head */

const headGeometry =
  new THREE.SphereGeometry(
    .46,
    20,
    20
  );

const headMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xf0b27a
  });

const head =
  new THREE.Mesh(
    headGeometry,
    headMaterial
  );

head.position.y = .78;

head.castShadow = true;

playerGroup.add(head);

/* body */

const bodyGeometry =
  new THREE.BoxGeometry(
    .65,
    .55,
    .5
  );

const bodyMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x202832
  });

const bodyMesh =
  new THREE.Mesh(
    bodyGeometry,
    bodyMaterial
  );

bodyMesh.position.y = .15;

bodyMesh.castShadow = true;

playerGroup.add(bodyMesh);

/* physics player */

const playerBody =
  new CANNON.Body({
    mass: 1.8,
    material: playerMaterial,
    linearDamping: .08,
    angularDamping: .7
  });

const playerShape =
  new CANNON.Sphere(.68);

playerBody.addShape(
  playerShape
);

playerBody.position.set(
  0,
  1.2,
  2
);

world.addBody(
  playerBody
);

/* =========================================================
   HAMMER
========================================================= */

const hammer =
  new THREE.Group();

scene.add(hammer);

/* handle */

const handleGeometry =
  new THREE.CylinderGeometry(
    .075,
    .075,
    2.5,
    12
  );

const handleMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x8b5a32
  });

const handle =
  new THREE.Mesh(
    handleGeometry,
    handleMaterial
  );

handle.position.y = -1.25;

handle.castShadow = true;

hammer.add(handle);

/* head */

const hammerHeadGeometry =
  new THREE.BoxGeometry(
    .9,
    .25,
    .25
  );

const hammerHeadMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x8f969e,
    metalness: .8,
    roughness: .3
  });

const hammerHead =
  new THREE.Mesh(
    hammerHeadGeometry,
    hammerHeadMaterial
  );

hammerHead.castShadow = true;

hammer.add(hammerHead);

hammer.position.set(
  1,
  2,
  1
);

/* hammer tip */

const tip =
  new THREE.Object3D();

tip.position.set(
  0,
  -2.45,
  0
);

hammer.add(tip);

/* =========================================================
   GRIPS
========================================================= */

const grips = [];

const gripPositions = [
  [-2.8, 1.8, 0],
  [2.7, 3.6, 0],
  [-2.1, 5.9, 0],
  [2.4, 8.5, 0],
  [-1.7, 10.9, 0],
  [2.2, 13.4, 0],
  [-2.2, 16.5, 0],
  [1.8, 19.6, 0],
  [-1.5, 22.6, 0]
];

for (
  let i = 0;
  i < gripPositions.length;
  i++
) {

  const p =
    gripPositions[i];

  const geometry =
    new THREE.SphereGeometry(
      .18,
      16,
      16
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0x42ff9b,
      emissive: 0x0d7f49,
      emissiveIntensity: 1.5
    });

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    p[0],
    p[1],
    p[2]
  );

  mesh.castShadow = true;

  scene.add(mesh);

  grips.push({
    mesh,
    position:
      new THREE.Vector3(
        p[0],
        p[1],
        p[2]
      ),
    grabbed: false
  });
}

/* =========================================================
   MOUSE
========================================================= */

const mouse =
  new THREE.Vector2();

const raycaster =
  new THREE.Raycaster();

let mouseDown = false;

let grabbedGrip = null;

let lastHammerPosition =
  new THREE.Vector3();

function updateMouse(
  event
) {

  mouse.x =
    (event.clientX /
      window.innerWidth) * 2 - 1;

  mouse.y =
    -(event.clientY /
      window.innerHeight) * 2 + 1;
}

window.addEventListener(
  "pointermove",
  updateMouse
);

window.addEventListener(
  "pointerdown",
  event => {

    if (
      event.button !== 0
    ) return;

    mouseDown = true;

    findGrip();

    lastHammerPosition.copy(
      hammer.position
    );
  }
);

window.addEventListener(
  "pointerup",
  () => {

    mouseDown = false;

    if (grabbedGrip) {

      grabbedGrip.grabbed =
        false;

      grabbedGrip.mesh.scale.setScalar(1);

      grabbedGrip = null;

      document.getElementById(
        "status"
      ).textContent =
        "HAMMER: FREE";
    }
  }
);

/* =========================================================
   HAMMER AIM
========================================================= */

const aimPlane =
  new THREE.Plane(
    new THREE.Vector3(
      0,
      0,
      1
    ),
    0
  );

const aimPoint =
  new THREE.Vector3();

function updateHammer() {

  raycaster.setFromCamera(
    mouse,
    camera
  );

  raycaster.ray.intersectPlane(
    aimPlane,
    aimPoint
  );

  const playerPosition =
    new THREE.Vector3(
      playerBody.position.x,
      playerBody.position.y,
      0
    );

  const direction =
    aimPoint
      .clone()
      .sub(playerPosition);

  direction.z = 0;

  if (
    direction.lengthSq() < .001
  ) return;

  direction.normalize();

  const hammerDistance =
    2.5;

  const target =
    playerPosition
      .clone()
      .add(
        direction.multiplyScalar(
          hammerDistance
        )
      );

  hammer.position.lerp(
    target,
    .35
  );

  hammer.lookAt(
    aimPoint.x,
    aimPoint.y,
    0
  );

  hammer.rotateX(
    Math.PI / 2
  );
}

/* =========================================================
   GRIP DETECTION
========================================================= */

function getTipWorldPosition() {

  const worldTip =
    new THREE.Vector3();

  tip.getWorldPosition(
    worldTip
  );

  return worldTip;
}

function findGrip() {

  const tipPosition =
    getTipWorldPosition();

  let nearest = null;

  let nearestDistance =
    Infinity;

  for (
    const grip of grips
  ) {

    const distance =
      tipPosition.distanceTo(
        grip.position
      );

    if (
      distance < .65 &&
      distance < nearestDistance
    ) {

      nearest =
        grip;

      nearestDistance =
        distance;
    }
  }

  if (nearest) {

    grabbedGrip = nearest;

    nearest.grabbed =
      true;

    nearest.mesh.scale.setScalar(
      1.7
    );

    document.getElementById(
      "status"
    ).textContent =
      "HAMMER: GRABBED";

  } else {

    document.getElementById(
      "status"
    ).textContent =
      "HAMMER: MISSED";
  }
}

/* =========================================================
   CLIMB FORCE
========================================================= */

const previousPlayer =
  new THREE.Vector3();

function applyClimbForce() {

  if (
    !mouseDown ||
    !grabbedGrip
  ) return;

  const tipPosition =
    getTipWorldPosition();

  /*
    Pull the player toward the opposite
    direction of hammer movement.

    This is the foundation of the
    Getting Over It style mechanic.
  */

  const hammerMovement =
    hammer.position
      .clone()
      .sub(lastHammerPosition);

  if (
    hammerMovement.lengthSq() >
    0.000001
  ) {

    const impulse =
      hammerMovement
        .clone()
        .multiplyScalar(-7.5);

    playerBody.applyImpulse(
      new CANNON.Vec3(
        impulse.x,
        impulse.y,
        0
      ),
      playerBody.position
    );
  }

  /* spring toward actual grip */

  const anchor =
    grabbedGrip.position;

  const playerPos =
    playerBody.position;

  const dx =
    anchor.x - playerPos.x;

  const dy =
    anchor.y - playerPos.y;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (
    distance > 2
  ) {

    const strength =
      Math.min(
        distance * 3,
        12
      );

    playerBody.applyForce(
      new CANNON.Vec3(
        dx * strength,
        dy * strength,
        0
      ),
      playerBody.position
    );
  }

  lastHammerPosition.copy(
    hammer.position
  );
}

/* =========================================================
   PLAYER VISUAL SYNC
========================================================= */

function syncPlayer() {

  playerGroup.position.set(
    playerBody.position.x,
    playerBody.position.y,
    playerBody.position.z
  );

  playerGroup.quaternion.set(
    playerBody.quaternion.x,
    playerBody.quaternion.y,
    playerBody.quaternion.z,
    playerBody.quaternion.w
  );
}

/* =========================================================
   CAMERA
========================================================= */

const cameraTarget =
  new THREE.Vector3();

function updateCamera() {

  cameraTarget.set(
    playerBody.position.x,
    playerBody.position.y + 1.5,
    15
  );

  camera.position.lerp(
    cameraTarget,
    .06
  );

  camera.lookAt(
    playerBody.position.x,
    playerBody.position.y + 1,
    0
  );
}

/* =========================================================
   START
========================================================= */

let running = false;

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "start"
    ).classList.add("hidden");

    running = true;
  }
);

/* =========================================================
   LOOP
========================================================= */

const clock =
  new THREE.Clock();

function animate() {

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );

  if (running) {

    updateHammer();

    applyClimbForce();

    world.step(
      1 / 60,
      dt,
      3
    );

    syncPlayer();

    updateCamera();

    /* keep player from drifting into deep Z */

    playerBody.position.z =
      THREE.MathUtils.lerp(
        playerBody.position.z,
        2,
        .08
      );

    /* reset if player falls */

    if (
      playerBody.position.y < -12
    ) {

      playerBody.position.set(
        0,
        1.2,
        2
      );

      playerBody.velocity.set(
        0,
        0,
        0
      );

      playerBody.angularVelocity.set(
        0,
        0,
        0
      );
    }
  }

  renderer.render(
    scene,
    camera
  );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>

</body>
</html>
