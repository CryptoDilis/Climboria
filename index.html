<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CLIMBOUND</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071018;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  z-index:20;
  top:18px;
  left:18px;
  color:white;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

#title{
  font-size:27px;
  font-weight:900;
  letter-spacing:5px;
}

#status{
  margin-top:9px;
  display:inline-block;
  padding:9px 13px;
  background:rgba(0,0,0,.72);
  border-radius:7px;
  font-size:12px;
}

#statusText{
  color:#55ff70;
  font-weight:bold;
}

#help{
  position:fixed;
  z-index:20;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.75);
  padding:11px 17px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  pointer-events:none;
}

#start{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#05080c;
}

#panel{
  width:min(90%,500px);
  padding:40px;
  text-align:center;
  color:white;
  background:#0c1318;
  border:1px solid rgba(85,255,112,.5);
  border-radius:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}

#panel h1{
  margin:0 0 12px;
  font-size:44px;
  letter-spacing:6px;
}

#panel p{
  color:#aab4ba;
  line-height:1.6;
}

#startButton{
  margin-top:15px;
  padding:15px 30px;
  border:0;
  border-radius:9px;
  background:#55ff70;
  color:#031006;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="title">CLIMBOUND</div>

  <div id="status">
    HAMMER:
    <span id="statusText">FREE</span>
  </div>
</div>

<div id="help">
  Move mouse = hammer &nbsp; | &nbsp;
  <b>CLICK GREEN GRIPS</b>
</div>

<div id="start">
  <div id="panel">
    <h1>CLIMBOUND</h1>

    <p>
      Climb the mountain using your hammer.<br>
      Green markers are climbing grips.
    </p>

    <button id="startButton">
      START CLIMBING
    </button>
  </div>
</div>

<script type="module">

import * as THREE from
"https://esm.sh/three@0.180.0";


/* =====================================================
   VARIABLES
===================================================== */

let scene;
let camera;
let renderer;

let hero;
let hammer;

let running=false;
let grabbed=null;

const grips=[];

const mouse={
  x:0,
  y:0
};


/* =====================================================
   INIT
===================================================== */

function init(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x071018);


  scene.fog=
    new THREE.Fog(
      0x071018,
      35,
      120
    );


  /* CAMERA */

  camera=
    new THREE.PerspectiveCamera(
      55,
      window.innerWidth/
      window.innerHeight,
      .1,
      200
    );

  camera.position.set(
    0,
    7,
    28
  );


  /* RENDERER */

  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.shadowMap.enabled=true;

  document
    .getElementById("game")
    .appendChild(
      renderer.domElement
    );


  /* LIGHTING */

  const ambient=
    new THREE.HemisphereLight(
      0xbfd7e6,
      0x111820,
      2.2
    );

  scene.add(ambient);


  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  sun.position.set(
    -12,
    25,
    25
  );

  sun.castShadow=true;

  scene.add(sun);


  /* WORLD */

  createSky();

  createMountain();

  createRocks();

  createHero();

  createHammer();

  createGrips();


  /* INPUT */

  window.addEventListener(
    "mousemove",
    mouseMove
  );

  window.addEventListener(
    "mousedown",
    mouseDown
  );

  window.addEventListener(
    "mouseup",
    mouseUp
  );

  window.addEventListener(
    "resize",
    resize
  );


  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      startGame
    );


  animate();
}


/* =====================================================
   SKY
===================================================== */

function createSky(){

  const sky=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        90,
        32,
        32
      ),

      new THREE.MeshBasicMaterial({
        color:0x0a1720,
        side:THREE.BackSide
      })
    );

  scene.add(sky);
}


/* =====================================================
   MOUNTAIN / ROCK CLIFF
===================================================== */

function createMountain(){

  /*
    Main cliff body.
    NOT a cone.
  */

  const cliffGeometry=
    new THREE.BoxGeometry(
      22,
      70,
      7
    );


  const cliffMaterial=
    new THREE.MeshStandardMaterial({
      color:0x39434a,
      roughness:1
    });


  const cliff=
    new THREE.Mesh(
      cliffGeometry,
      cliffMaterial
    );


  cliff.position.set(
    0,
    34,
    -7
  );


  cliff.rotation.y=-0.04;

  cliff.receiveShadow=true;

  scene.add(cliff);


  /*
    Irregular rock faces.
  */

  const rockMaterial=
    new THREE.MeshStandardMaterial({
      color:0x4a555b,
      roughness:1
    });


  const ledges=[
    [-8,5,1.5,2],
    [7,8,2,1.5],
    [-6,12,2.5,2],
    [6,16,2,2],
    [-8,21,2.5,1.5],
    [7,25,2.5,2],
    [-6,30,2,2],
    [8,35,3,2],
    [-7,40,2,2],
    [6,45,3,2],
    [-5,51,2.5,2],
    [7,57,2.5,2]
  ];


  ledges.forEach(
    data=>{

      const [
        x,
        y,
        sx,
        sy
      ]=data;


      const rock=
        new THREE.Mesh(

          new THREE.DodecahedronGeometry(
            1.5,
            1
          ),

          rockMaterial
        );


      rock.position.set(
        x,
        y,
        -3.5
      );


      rock.scale.set(
        sx,
        sy,
        1.4
      );


      rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
      );


      rock.castShadow=true;
      rock.receiveShadow=true;

      scene.add(rock);
    }
  );
}


/* =====================================================
   SIDE ROCKS
===================================================== */

function createRocks(){

  const material=
    new THREE.MeshStandardMaterial({
      color:0x202b31,
      roughness:1
    });


  for(
    let i=0;
    i<45;
    i++
  ){

    const rock=
      new THREE.Mesh(

        new THREE.DodecahedronGeometry(
          1,
          0
        ),

        material
      );


    const side=
      Math.random()>.5
      ?1
      :-1;


    rock.position.set(

      side*
      (
        12+
        Math.random()*7
      ),

      Math.random()*70,

      -2+
      Math.random()*3
    );


    const s=
      .5+
      Math.random()*2.5;


    rock.scale.set(
      s,
      s*
      (0.6+
      Math.random()),
      s
    );


    rock.rotation.set(
      Math.random()*3,
      Math.random()*3,
      Math.random()*3
    );


    scene.add(rock);
  }
}


/* =====================================================
   HERO
===================================================== */

function createHero(){

  hero=
    new THREE.Group();


  /*
    POT
  */

  const pot=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        1.0,
        1.35,
        1.5,
        28
      ),

      new THREE.MeshStandardMaterial({
        color:0xd17a3e,
        roughness:.7
      })
    );


  pot.castShadow=true;

  hero.add(pot);


  /*
    POT RIM
  */

  const rim=
    new THREE.Mesh(

      new THREE.TorusGeometry(
        1.03,
        .12,
        12,
        28
      ),

      new THREE.MeshStandardMaterial({
        color:0xa8562b
      })
    );


  rim.rotation.x=
    Math.PI/2;


  rim.position.y=.68;

  hero.add(rim);


  /*
    HEAD
  */

  const head=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .68,
        28,
        28
      ),

      new THREE.MeshStandardMaterial({
        color:0xe0a17a,
        roughness:.8
      })
    );


  head.position.y=1.35;

  head.castShadow=true;

  hero.add(head);


  /*
    HELMET
  */

  const helmet=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .78,
        24,
        16,
        0,
        Math.PI*2,
        0,
        Math.PI/2
      ),

      new THREE.MeshStandardMaterial({
        color:0x252c33,
        roughness:.6
      })
    );


  helmet.position.y=1.62;

  helmet.castShadow=true;

  hero.add(helmet);


  /*
    EYES
  */

  const eyeMaterial=
    new THREE.MeshBasicMaterial({
      color:0x111111
    });


  const eye1=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .075,
        12,
        12
      ),
      eyeMaterial
    );


  eye1.position.set(
    -.2,
    1.35,
    -.63
  );


  hero.add(eye1);


  const eye2=
    eye1.clone();


  eye2.position.x=.2;

  hero.add(eye2);


  /*
    NOSE
  */

  const nose=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .08,
        10,
        10
      ),

      new THREE.MeshBasicMaterial({
        color:0xb86e50
      })
    );


  nose.position.set(
    0,
    1.25,
    -.68
  );


  hero.add(nose);


  /*
    HERO POSITION
    Clearly in front
    of mountain.
  */

  hero.position.set(
    0,
    2,
    3.5
  );


  scene.add(hero);
}


/* =====================================================
   HAMMER
===================================================== */

function createHammer(){

  hammer=
    new THREE.Group();


  const handle=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .09,
        .09,
        3.8,
        14
      ),

      new THREE.MeshStandardMaterial({
        color:0x80502d
      })
    );


  handle.rotation.z=
    Math.PI/2;


  hammer.add(handle);


  const head=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        .55,
        .55,
        1.5
      ),

      new THREE.MeshStandardMaterial({
        color:0xd4d9dc,
        metalness:.85,
        roughness:.18
      })
    );


  head.position.x=1.8;

  hammer.add(head);


  /*
    Bright yellow hammer tip
  */

  const tip=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .25,
        18,
        18
      ),

      new THREE.MeshBasicMaterial({
        color:0xffff00
      })
    );


  tip.position.x=2.4;

  hammer.add(tip);


  hammer.userData.tip=tip;


  hammer.position.set(
    3,
    3,
    4
  );


  scene.add(hammer);
}


/* =====================================================
   GRIPS
===================================================== */

function createGrips(){

  const positions=[

    [-4,4],
    [2,6],
    [-2,9],
    [4,12],
    [0,15],
    [-4,18],
    [2,21],
    [5,24],
    [0,27],
    [-4,30],
    [2,33],
    [-2,36],
    [4,39],
    [0,42],
    [-4,45],
    [2,48],
    [-2,51],
    [4,54],
    [0,57],
    [-3,60]

  ];


  positions.forEach(
    ([x,y],index)=>{

      const group=
        new THREE.Group();


      /*
        GLOW
      */

      const glow=
        new THREE.Mesh(

          new THREE.SphereGeometry(
            1.2,
            20,
            20
          ),

          new THREE.MeshBasicMaterial({
            color:0x00ff44,
            transparent:true,
            opacity:.2
          })
        );


      group.add(glow);


      /*
        RING
      */

      const ring=
        new THREE.Mesh(

          new THREE.TorusGeometry(
            .72,
            .17,
            16,
            32
          ),

          new THREE.MeshBasicMaterial({
            color:0x00ff44
          })
        );


      group.add(ring);


      /*
        CENTER
      */

      const center=
        new THREE.Mesh(

          new THREE.SphereGeometry(
            .3,
            16,
            16
          ),

          new THREE.MeshBasicMaterial({
            color:0xffffff
          })
        );


      group.add(center);


      /*
        IMPORTANT:
        Put grips in front
        of the cliff.
      */

      group.position.set(
        x,
        y,
        3.1
      );


      scene.add(group);


      grips.push({
        group,
        ring,
        glow,
        x,
        y,
        index
      });

    }
  );
}


/* =====================================================
   MOUSE
===================================================== */

function mouseMove(event){

  mouse.x=
    event.clientX/
    window.innerWidth*
    2-1;


  mouse.y=
    -(event.clientY/
    window.innerHeight)*
    2+1;
}


/* =====================================================
   HAMMER MOVEMENT
===================================================== */

function updateHammer(){

  const targetX=
    hero.position.x+
    mouse.x*6;


  const targetY=
    hero.position.y+
    mouse.y*5;


  hammer.position.x+=
    (
      targetX-
      hammer.position.x
    )*.18;


  hammer.position.y+=
    (
      targetY-
      hammer.position.y
    )*.18;


  hammer.position.z=4;


  hammer.rotation.z=
    -Math.atan2(
      mouse.y*5,
      mouse.x*6
    );
}


/* =====================================================
   GRIP DETECTION
===================================================== */

function nearestGrip(){

  const tip=
    new THREE.Vector3();


  hammer.userData.tip
    .getWorldPosition(tip);


  let best=null;
  let bestDistance=Infinity;


  grips.forEach(
    grip=>{

      const p=
        new THREE.Vector3(
          grip.x,
          grip.y,
          3.1
        );


      const d=
        tip.distanceTo(p);


      if(d<bestDistance){

        bestDistance=d;
        best=grip;
      }
    }
  );


  return{
    grip:best,
    distance:bestDistance
  };
}


/* =====================================================
   CLICK
===================================================== */

function mouseDown(event){

  if(!running)return;

  if(event.button!==0)return;


  const result=
    nearestGrip();


  if(
    result.grip &&
    result.distance<2.5
  ){

    grabbed=result.grip;


    document.getElementById(
      "statusText"
    ).textContent=
      "GRIP LOCKED";


    document.getElementById(
      "statusText"
    ).style.color=
      "#55ff70";


    grabbed.group
      .scale
      .setScalar(1.5);

  }else{

    document.getElementById(
      "statusText"
    ).textContent=
      "MISSED";


    document.getElementById(
      "statusText"
    ).style.color=
      "#ff4444";
  }
}


/* =====================================================
   RELEASE
===================================================== */

function mouseUp(){

  if(grabbed){

    grabbed.group
      .scale
      .setScalar(1);
  }


  grabbed=null;


  if(running){

    document.getElementById(
      "statusText"
    ).textContent=
      "FREE";


    document.getElementById(
      "statusText"
    ).style.color=
      "#55ff70";
  }
}


/* =====================================================
   SIMPLE CLIMB
===================================================== */

function climb(){

  if(!grabbed)return;


  const dx=
    grabbed.x-
    hero.position.x;


  const dy=
    grabbed.y-
    hero.position.y;


  hero.position.x+=
    dx*.025;


  hero.position.y+=
    dy*.035;
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  const targetY=
    hero.position.y+5;


  camera.position.y+=
    (
      targetY-
      camera.position.y
    )*.05;


  camera.lookAt(
    hero.position.x,
    camera.position.y,
    0
  );
}


/* =====================================================
   GRIP ANIMATION
===================================================== */

function animateGrips(time){

  grips.forEach(
    grip=>{

      if(grip===grabbed)return;


      const pulse=
        1+
        Math.sin(
          time*.004+
          grip.index
        )*.12;


      grip.ring
        .scale
        .setScalar(pulse);


      grip.glow
        .scale
        .setScalar(pulse);
    }
  );
}


/* =====================================================
   START
===================================================== */

function startGame(){

  document.getElementById(
    "start"
  ).style.display="none";


  running=true;
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  camera.aspect=
    window.innerWidth/
    window.innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}


/* =====================================================
   LOOP
===================================================== */

function animate(time=0){

  requestAnimationFrame(
    animate
  );


  if(running){

    updateHammer();

    climb();

    updateCamera();
  }


  animateGrips(time);


  renderer.render(
    scene,
    camera
  );
}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
