<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CLIMBOUND</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071018;
  font-family:Arial,sans-serif;
}

#game{position:fixed;inset:0}
canvas{display:block}

#hud{
  position:fixed;
  z-index:20;
  top:18px;
  left:18px;
  color:white;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

#title{
  font-size:27px;
  font-weight:900;
  letter-spacing:5px;
}

#status{
  margin-top:9px;
  display:inline-block;
  padding:9px 13px;
  background:rgba(0,0,0,.72);
  border-radius:7px;
  font-size:12px;
}

#statusText{
  color:#55ff70;
  font-weight:bold;
}

#height{
  margin-top:7px;
  font-size:13px;
  color:#fff;
}

#help{
  position:fixed;
  z-index:20;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.75);
  padding:11px 17px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  pointer-events:none;
}

#start{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#05080c;
}

#panel{
  width:min(90%,500px);
  padding:40px;
  text-align:center;
  color:white;
  background:#0c1318;
  border:1px solid rgba(85,255,112,.5);
  border-radius:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}

#panel h1{
  margin:0 0 12px;
  font-size:44px;
  letter-spacing:6px;
}

#panel p{
  color:#aab4ba;
  line-height:1.6;
}

#startButton{
  margin-top:15px;
  padding:15px 30px;
  border:0;
  border-radius:9px;
  background:#55ff70;
  color:#031006;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="title">CLIMBOUND</div>

  <div id="status">
    HAMMER:
    <span id="statusText">FREE</span>
  </div>

  <div id="height">
    HEIGHT: <span id="heightText">0</span>m
  </div>
</div>

<div id="help">
  Move cursor = hammer tip &nbsp; | &nbsp;
  <b>CLICK + HOLD GREEN GRIP</b> &nbsp; | &nbsp;
  Move around grip = swing &nbsp; | &nbsp; Release = let go
</div>

<div id="start">
  <div id="panel">
    <h1>CLIMBOUND</h1>

    <p>
      Grab the green grips with your hammer.<br>
      Pull the hammer away to climb.
    </p>

    <button id="startButton">
      START CLIMBING
    </button>
  </div>
</div>

<script type="module">

import * as THREE from
"https://esm.sh/three@0.180.0";


/* =====================================================
   VARIABLES
===================================================== */

let scene;
let camera;
let renderer;

let hero;
let hammer;

let running=false;
let grabbed=null;

let velocityX=0;
let velocityY=0;

let lastTime=performance.now();

const gravity=-18;
const maxSpeed=18;
const airDrag=0.992;
const swingStrength=26;
const anchorPull=18;

const grips=[];

const mouse={
  x:0,
  y:0
};

const cursorWorld=new THREE.Vector3();
const raycaster=new THREE.Raycaster();
const cursorPlane=new THREE.Plane(
  new THREE.Vector3(0,0,1),
  -4
);

let anchorWorld=new THREE.Vector3();
let ropeLength=0;


/* =====================================================
   INIT
===================================================== */

function init(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x071018);

  scene.fog=
    new THREE.Fog(
      0x071018,
      35,
      120
    );


  camera=
    new THREE.PerspectiveCamera(
      55,
      window.innerWidth/
      window.innerHeight,
      .1,
      200
    );

  camera.position.set(
    0,
    7,
    28
  );


  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.shadowMap.enabled=true;

  document
    .getElementById("game")
    .appendChild(
      renderer.domElement
    );


  const ambient=
    new THREE.HemisphereLight(
      0xbfd7e6,
      0x111820,
      2.2
    );

  scene.add(ambient);


  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  sun.position.set(
    -12,
    25,
    25
  );

  sun.castShadow=true;

  scene.add(sun);


  createSky();
  createMountain();
  createRocks();
  createHero();
  createHammer();
  createGrips();


  window.addEventListener(
    "mousemove",
    mouseMove
  );

  window.addEventListener(
    "mousedown",
    mouseDown
  );

  window.addEventListener(
    "mouseup",
    mouseUp
  );

  window.addEventListener(
    "resize",
    resize
  );


  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      startGame
    );


  animate();
}


/* =====================================================
   SKY
===================================================== */

function createSky(){

  const sky=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        90,
        32,
        32
      ),

      new THREE.MeshBasicMaterial({
        color:0x0a1720,
        side:THREE.BackSide
      })
    );

  scene.add(sky);
}


/* =====================================================
   MOUNTAIN
===================================================== */

function createMountain(){

  const cliff=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        22,
        70,
        7
      ),

      new THREE.MeshStandardMaterial({
        color:0x39434a,
        roughness:1
      })
    );

  cliff.position.set(
    0,
    34,
    -7
  );

  cliff.rotation.y=-0.04;

  cliff.receiveShadow=true;

  scene.add(cliff);


  const rockMaterial=
    new THREE.MeshStandardMaterial({
      color:0x4a555b,
      roughness:1
    });


  const ledges=[
    [-8,5,1.5,2],
    [7,8,2,1.5],
    [-6,12,2.5,2],
    [6,16,2,2],
    [-8,21,2.5,1.5],
    [7,25,2.5,2],
    [-6,30,2,2],
    [8,35,3,2],
    [-7,40,2,2],
    [6,45,3,2],
    [-5,51,2.5,2],
    [7,57,2.5,2]
  ];


  ledges.forEach(
    data=>{

      const [
        x,
        y,
        sx,
        sy
      ]=data;


      const rock=
        new THREE.Mesh(

          new THREE.DodecahedronGeometry(
            1.5,
            1
          ),

          rockMaterial
        );


      rock.position.set(
        x,
        y,
        -3.5
      );


      rock.scale.set(
        sx,
        sy,
        1.4
      );


      rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
      );


      rock.castShadow=true;
      rock.receiveShadow=true;

      scene.add(rock);
    }
  );
}


/* =====================================================
   SIDE ROCKS
===================================================== */

function createRocks(){

  const material=
    new THREE.MeshStandardMaterial({
      color:0x202b31,
      roughness:1
    });


  for(let i=0;i<45;i++){

    const rock=
      new THREE.Mesh(

        new THREE.DodecahedronGeometry(
          1,
          0
        ),

        material
      );


    const side=
      Math.random()>.5 ? 1 : -1;


    rock.position.set(

      side*
      (
        12+
        Math.random()*7
      ),

      Math.random()*70,

      -2+
      Math.random()*3
    );


    const s=
      .5+
      Math.random()*2.5;


    rock.scale.set(
      s,
      s*(.6+Math.random()),
      s
    );


    rock.rotation.set(
      Math.random()*3,
      Math.random()*3,
      Math.random()*3
    );


    scene.add(rock);
  }
}


/* =====================================================
   HERO
===================================================== */

function createHero(){

  hero=new THREE.Group();


  const pot=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        1.0,
        1.35,
        1.5,
        28
      ),

      new THREE.MeshStandardMaterial({
        color:0xd17a3e,
        roughness:.7
      })
    );

  pot.castShadow=true;

  hero.add(pot);


  const rim=
    new THREE.Mesh(

      new THREE.TorusGeometry(
        1.03,
        .12,
        12,
        28
      ),

      new THREE.MeshStandardMaterial({
        color:0xa8562b
      })
    );

  rim.rotation.x=
    Math.PI/2;

  rim.position.y=.68;

  hero.add(rim);


  const head=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .68,
        28,
        28
      ),

      new THREE.MeshStandardMaterial({
        color:0xe0a17a,
        roughness:.8
      })
    );

  head.position.y=1.35;

  head.castShadow=true;

  hero.add(head);


  const helmet=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .78,
        24,
        16,
        0,
        Math.PI*2,
        0,
        Math.PI/2
      ),

      new THREE.MeshStandardMaterial({
        color:0x252c33,
        roughness:.6
      })
    );

  helmet.position.y=1.62;

  helmet.castShadow=true;

  hero.add(helmet);


  const eyeMaterial=
    new THREE.MeshBasicMaterial({
      color:0x111111
    });


  const eye1=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .075,
        12,
        12
      ),
      eyeMaterial
    );

  eye1.position.set(
    -.2,
    1.35,
    -.63
  );

  hero.add(eye1);


  const eye2=eye1.clone();

  eye2.position.x=.2;

  hero.add(eye2);


  const nose=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .08,
        10,
        10
      ),

      new THREE.MeshBasicMaterial({
        color:0xb86e50
      })
    );

  nose.position.set(
    0,
    1.25,
    -.68
  );

  hero.add(nose);


  hero.position.set(
    0,
    2,
    3.5
  );

  scene.add(hero);
}


/* =====================================================
   HAMMER
===================================================== */

function createHammer(){

  hammer=new THREE.Group();

  /*
    IMPORTANT:
    The hammer group's ORIGIN is now the actual yellow tip.
    That means group.position can be set directly to the
    cursor's world position with no offset.
  */

  const handle=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .09,
        .09,
        3.8,
        14
      ),
      new THREE.MeshStandardMaterial({
        color:0x80502d
      })
    );

  handle.rotation.z=Math.PI/2;
  handle.position.x=-1.9;
  hammer.add(handle);


  const head=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .55,
        .55,
        1.5
      ),
      new THREE.MeshStandardMaterial({
        color:0xd4d9dc,
        metalness:.85,
        roughness:.18
      })
    );

  head.position.x=-.65;
  hammer.add(head);


  const tip=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .25,
        18,
        18
      ),
      new THREE.MeshBasicMaterial({
        color:0xffff00
      })
    );

  tip.position.set(0,0,0);
  hammer.add(tip);

  hammer.userData.tip=tip;

  hammer.position.set(
    3,
    3,
    4
  );

  scene.add(hammer);
}


/* =====================================================
   GRIPS
===================================================== */

function createGrips(){

  const positions=[
    [-4,4],
    [2,6],
    [-2,9],
    [4,12],
    [0,15],
    [-4,18],
    [2,21],
    [5,24],
    [0,27],
    [-4,30],
    [2,33],
    [-2,36],
    [4,39],
    [0,42],
    [-4,45],
    [2,48],
    [-2,51],
    [4,54],
    [0,57],
    [-3,60]
  ];


  positions.forEach(
    ([x,y],index)=>{

      const group=
        new THREE.Group();


      const glow=
        new THREE.Mesh(

          new THREE.SphereGeometry(
            1.2,
            20,
            20
          ),

          new THREE.MeshBasicMaterial({
            color:0x00ff44,
            transparent:true,
            opacity:.2
          })
        );

      group.add(glow);


      const ring=
        new THREE.Mesh(

          new THREE.TorusGeometry(
            .72,
            .17,
            16,
            32
          ),

          new THREE.MeshBasicMaterial({
            color:0x00ff44
          })
        );

      group.add(ring);


      const center=
        new THREE.Mesh(

          new THREE.SphereGeometry(
            .3,
            16,
            16
          ),

          new THREE.MeshBasicMaterial({
            color:0xffffff
          })
        );

      group.add(center);


      group.position.set(
        x,
        y,
        3.1
      );


      scene.add(group);


      grips.push({
        group,
        ring,
        glow,
        x,
        y,
        index
      });
    }
  );
}


/* =====================================================
   MOUSE
===================================================== */

function mouseMove(event){

  mouse.x=
    event.clientX/
    window.innerWidth*
    2-1;

  mouse.y=
    -(event.clientY/
    window.innerHeight)*
    2+1;

  updateCursorWorld();
}


function updateCursorWorld(){

  raycaster.setFromCamera(
    new THREE.Vector2(mouse.x,mouse.y),
    camera
  );

  const hit=
    raycaster.ray.intersectPlane(
      cursorPlane,
      cursorWorld
    );

  if(!hit)return;

  /*
    Keep the hammer in the playable vertical area.
  */

  cursorWorld.x=
    THREE.MathUtils.clamp(
      cursorWorld.x,
      -10,
      10
    );

  cursorWorld.y=
    THREE.MathUtils.clamp(
      cursorWorld.y,
      -2,
      70
    );
}


/* =====================================================
   HAMMER
===================================================== */

function updateHammer(){

  updateCursorWorld();

  /*
    FREE:
    The yellow tip follows the exact world-space cursor.

    GRABBED:
    The hammer tip stays physically locked to the grip.
    The cursor still controls the direction of the hammer.
  */

  if(grabbed){

    hammer.position.copy(anchorWorld);

    const dx=
      cursorWorld.x-anchorWorld.x;

    const dy=
      cursorWorld.y-anchorWorld.y;

    if(Math.abs(dx)+Math.abs(dy)>.001){

      hammer.rotation.z=
        -Math.atan2(dy,dx);
    }

  }else{

    hammer.position.copy(cursorWorld);

    const dx=
      cursorWorld.x-hero.position.x;

    const dy=
      cursorWorld.y-hero.position.y;

    if(Math.abs(dx)+Math.abs(dy)>.001){

      hammer.rotation.z=
        -Math.atan2(dy,dx);
    }
  }

  hammer.position.z=4;
}


/* =====================================================
   FIND GRIP
===================================================== */

function nearestGrip(){

  let best=null;
  let bestDistance=Infinity;


  grips.forEach(
    grip=>{

      const dx=
        cursorWorld.x-grip.x;

      const dy=
        cursorWorld.y-grip.y;

      const d=
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      if(d<bestDistance){

        bestDistance=d;
        best=grip;
      }
    }
  );


  return{
    grip:best,
    distance:bestDistance
  };
}


/* =====================================================
   GRAB
===================================================== */

function mouseDown(event){

  if(!running)return;

  if(event.button!==0)return;


  const result=
    nearestGrip();


  /*
    The cursor itself must be close to the grip.
    The hammer tip is already exactly underneath
    the cursor, so there is no visual mismatch.
  */

  if(
    result.grip &&
    result.distance<1.15
  ){

    grabbed=result.grip;

    anchorWorld.set(
      grabbed.x,
      grabbed.y,
      4
    );


    /*
      Remember the player's current distance
      from the anchor. This creates a real
      pivot/rope constraint.
    */

    const dx=
      hero.position.x-anchorWorld.x;

    const dy=
      hero.position.y-anchorWorld.y;

    ropeLength=
      Math.max(
        2.0,
        Math.sqrt(
          dx*dx+
          dy*dy
        )
      );


    velocityX=0;
    velocityY=0;


    setStatus(
      "GRIP LOCKED",
      "#55ff70"
    );


    grabbed.group
      .scale
      .setScalar(1.55);

  }else{

    setStatus(
      "MOVE CLOSER",
      "#ffcc33"
    );
  }
}


/* =====================================================
   RELEASE
===================================================== */

function mouseUp(){

  if(grabbed){

    grabbed.group
      .scale
      .setScalar(1);


    /*
      Keep momentum when the player lets go.
    */

    velocityX*=1.15;
    velocityY*=1.15;
  }


  grabbed=null;


  if(running){

    setStatus(
      "FREE",
      "#55ff70"
    );
  }
}


/* =====================================================
   CLIMB PHYSICS
===================================================== */

function updatePhysics(dt){

  /*
    NORMAL GRAVITY
  */

  velocityY += gravity*dt;


  if(grabbed){

    /*
      The grip is a FIXED PIVOT.

      The cursor does NOT teleport the hero.
      Instead, it controls which side of the
      pivot the player is trying to swing toward.
    */

    const relX=
      hero.position.x-anchorWorld.x;

    const relY=
      hero.position.y-anchorWorld.y;


    const distance=
      Math.sqrt(
        relX*relX+
        relY*relY
      );


    if(distance>.001){

      /*
        Tangent vector around the anchor.
        This is what produces the swing instead
        of the old "jump toward grip" behavior.
      */

      const tangentX=
        -relY/distance;

      const tangentY=
        relX/distance;


      /*
        Mouse direction relative to anchor.
      */

      const mouseX=
        cursorWorld.x-anchorWorld.x;

      const mouseY=
        cursorWorld.y-anchorWorld.y;


      const mouseLen=
        Math.sqrt(
          mouseX*mouseX+
          mouseY*mouseY
        );


      if(mouseLen>.001){

        const nx=mouseX/mouseLen;
        const ny=mouseY/mouseLen;


        /*
          Tangential mouse influence.
        */

        const tangential=
          nx*tangentX+
          ny*tangentY;


        velocityX +=
          tangentX*
          tangential*
          swingStrength*
          dt;

        velocityY +=
          tangentY*
          tangential*
          swingStrength*
          dt;
      }


      /*
        Rope constraint.

        If the player tries to move farther
        than the distance at which the hammer
        was grabbed, push him back onto the
        pivot circle.
      */

      if(distance>ropeLength){

        const correction=
          distance-ropeLength;

        const nx=
          relX/distance;

        const ny=
          relY/distance;


        hero.position.x -=
          nx*correction;

        hero.position.y -=
          ny*correction;


        /*
          Remove outward velocity so the
          player stays attached to the grip.
        */

        const outward=
          velocityX*nx+
          velocityY*ny;


        if(outward>0){

          velocityX -=
            nx*outward;

          velocityY -=
            ny*outward;
        }
      }


      /*
        A small inward spring prevents the
        player from drifting completely away
        from the anchor when swinging.
      */

      const spring=
        (ropeLength-distance)*
        anchorPull;

      velocityX +=
        (relX/distance)*
        spring*
        dt;

      velocityY +=
        (relY/distance)*
        spring*
        dt;
    }
  }


  /*
    SPEED LIMIT
  */

  const speed=
    Math.sqrt(
      velocityX*velocityX+
      velocityY*velocityY
    );


  if(speed>maxSpeed){

    const scale=
      maxSpeed/speed;

    velocityX*=scale;
    velocityY*=scale;
  }


  /*
    APPLY VELOCITY
  */

  hero.position.x +=
    velocityX*dt;

  hero.position.y +=
    velocityY*dt;


  /*
    AIR DRAG
  */

  velocityX*=Math.pow(
    airDrag,
    dt*60
  );

  velocityY*=Math.pow(
    airDrag,
    dt*60
  );


  /*
    SIDE LIMIT
  */

  hero.position.x=
    THREE.MathUtils.clamp(
      hero.position.x,
      -9,
      9
    );


  /*
    FALL RESET
  */

  if(hero.position.y<-5){

    resetPlayer();
  }
}


/* =====================================================
   RESET
===================================================== */

function resetPlayer(){

  hero.position.set(
    0,
    2,
    3.5
  );

  velocityX=0;
  velocityY=0;

  grabbed=null;

  grips.forEach(
    grip=>{
      grip.group
        .scale
        .setScalar(1);
    }
  );


  setStatus(
    "FREE",
    "#55ff70"
  );
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  color
){

  const status=
    document.getElementById(
      "statusText"
    );

  status.textContent=text;
  status.style.color=color;
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  const targetY=
    hero.position.y+5;


  camera.position.y+=
    (
      targetY-
      camera.position.y
    )*.08;


  camera.position.x+=
    (
      hero.position.x-
      camera.position.x
    )*.05;


  camera.lookAt(
    hero.position.x,
    camera.position.y,
    0
  );
}


/* =====================================================
   GRIP ANIMATION
===================================================== */

function animateGrips(time){

  grips.forEach(
    grip=>{

      if(grip===grabbed)return;


      const pulse=
        1+
        Math.sin(
          time*.004+
          grip.index
        )*.12;


      grip.ring
        .scale
        .setScalar(pulse);

      grip.glow
        .scale
        .setScalar(pulse);
    }
  );
}


/* =====================================================
   HEIGHT
===================================================== */

function updateHeight(){

  const height=
    Math.max(
      0,
      Math.floor(
        hero.position.y
      )
    );


  document.getElementById(
    "heightText"
  ).textContent=height;
}


/* =====================================================
   START
===================================================== */

function startGame(){

  document.getElementById(
    "start"
  ).style.display="none";

  running=true;

  updateCursorWorld();

  lastTime=
    performance.now();
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  camera.aspect=
    window.innerWidth/
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}


/* =====================================================
   GAME LOOP
===================================================== */

function animate(time=0){

  requestAnimationFrame(
    animate
  );


  const now=
    performance.now();


  let dt=
    (now-lastTime)/
    1000;


  lastTime=now;


  /*
    Prevent huge physics jump
    when browser tab pauses.
  */

  dt=
    Math.min(
      dt,
      .033
    );


  if(running){

    updateHammer();

    updatePhysics(dt);

    updateCamera();

    updateHeight();
  }


  animateGrips(time);


  renderer.render(
    scene,
    camera
  );
}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
