<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIMBOUND — Physics Prototype</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080d;
  font-family:Arial,sans-serif;
  color:white;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:18px;
  left:18px;
  z-index:10;
  pointer-events:none;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:4px;
}

.version{
  margin-top:4px;
  font-size:10px;
  letter-spacing:3px;
  opacity:.55;
}

#status{
  margin-top:15px;
  padding:10px 14px;
  border-radius:8px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.18);
  font-size:12px;
}

#help{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  padding:11px 17px;
  background:rgba(0,0,0,.6);
  border-radius:9px;
  border:1px solid rgba(255,255,255,.15);
  font-size:12px;
  text-align:center;
}

#start{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#172532,#030507 75%);
}

.panel{
  width:min(430px,calc(100% - 30px));
  padding:35px;
  text-align:center;
  background:rgba(7,10,15,.94);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
}

.panel h1{
  margin:0;
  font-size:38px;
  letter-spacing:7px;
}

.panel p{
  margin:22px 0;
  color:#c8d0d8;
  line-height:1.7;
  font-size:14px;
}

button{
  padding:14px 25px;
  border:0;
  border-radius:8px;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="hud">
  <div class="logo">CLIMBOUND</div>
  <div class="version">V0.1 — TRUE CLIMBING PROTOTYPE</div>
  <div id="status">HAMMER: FREE</div>
</div>

<div id="help">
  MOVE MOUSE • HOLD LEFT CLICK NEAR A GREEN GRIP • DRAG TO PULL
</div>

<div id="start">
  <div class="panel">
    <h1>CLIMBOUND</h1>

    <p>
      The mountain is controlled by physics.<br><br>
      Move your hammer toward a green grip.<br>
      Hold the left mouse button to grab it.<br>
      Pull the hammer to move yourself.
    </p>

    <button id="startBtn">
      START CLIMBING
    </button>
  </div>
</div>

<script type="module">

import * as THREE
from "https://esm.sh/three@0.180.0";

import * as CANNON
from "https://esm.sh/cannon-es@0.20.0";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x070b11);

scene.fog =
  new THREE.FogExp2(
    0x070b11,
    0.015
  );


/* =====================================================
   CAMERA
===================================================== */

const camera =
  new THREE.PerspectiveCamera(
    60,
    window.innerWidth /
    window.innerHeight,
    0.1,
    300
  );

camera.position.set(
  0,
  5,
  18
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


/* =====================================================
   LIGHTS
===================================================== */

scene.add(
  new THREE.HemisphereLight(
    0xaec8e8,
    0x111111,
    2
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  -10,
  20,
  15
);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
   PHYSICS
===================================================== */

const world =
  new CANNON.World();

world.gravity.set(
  0,
  -12,
  0
);

world.broadphase =
  new CANNON.SAPBroadphase(
    world
  );

world.allowSleep = false;


/* =====================================================
   PLAYER
===================================================== */

const playerMaterial =
  new CANNON.Material(
    "player"
  );

const rockMaterial =
  new CANNON.Material(
    "rock"
  );

world.addContactMaterial(
  new CANNON.ContactMaterial(
    playerMaterial,
    rockMaterial,
    {
      friction:.8,
      restitution:.05
    }
  )
);


/* =====================================================
   PLAYER VISUAL
===================================================== */

const player =
  new THREE.Group();

scene.add(player);


/* POT */

const pot =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .72,
      .85,
      1.15,
      24
    ),
    new THREE.MeshStandardMaterial({
      color:0xb86d36,
      roughness:.8
    })
  );

pot.castShadow = true;

player.add(pot);


/* HEAD */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .45,
      20,
      20
    ),
    new THREE.MeshStandardMaterial({
      color:0xf0b27a
    })
  );

head.position.y =
  .82;

head.castShadow = true;

player.add(head);


/* BODY */

const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .65,
      .55,
      .5
    ),
    new THREE.MeshStandardMaterial({
      color:0x202832
    })
  );

body.position.y =
  .12;

body.castShadow = true;

player.add(body);


/* PHYSICS BODY */

const playerBody =
  new CANNON.Body({
    mass:2,
    material:playerMaterial,
    linearDamping:.12,
    angularDamping:.8
  });

playerBody.addShape(
  new CANNON.Sphere(.68)
);

playerBody.position.set(
  0,
  2,
  2
);

world.addBody(
  playerBody
);


/* =====================================================
   MOUNTAIN ROCKS
===================================================== */

function rock(
  x,
  y,
  z,
  sx,
  sy,
  sz
){

  const mesh =
    new THREE.Mesh(
      new THREE.DodecahedronGeometry(
        1,
        1
      ),
      new THREE.MeshStandardMaterial({
        color:0x303943,
        roughness:1
      })
    );

  mesh.position.set(
    x,y,z
  );

  mesh.scale.set(
    sx,sy,sz
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);


  const shape =
    new CANNON.Box(
      new CANNON.Vec3(
        sx*.8,
        sy*.8,
        sz*.8
      )
    );

  const physics =
    new CANNON.Body({
      mass:0,
      material:rockMaterial
    });

  physics.addShape(shape);

  physics.position.set(
    x,y,z
  );

  world.addBody(
    physics
  );
}


/* FLOOR */

rock(
  0,
  -5,
  0,
  12,
  2,
  4
);


/* SIDE WALLS */

rock(
  -7,
  8,
  0,
  3,
  14,
  3
);

rock(
  7,
  12,
  0,
  3,
  18,
  3
);


/* CLIMBING ROCKS */

const rockList = [

  [-3,2,0,2.2,1.4,1.5],
  [2.8,4.5,0,2.2,1.3,1.5],

  [-2.5,7,0,2.3,1.4,1.5],
  [2.5,9.5,0,2.2,1.4,1.5],

  [-2,12,0,2.3,1.4,1.5],
  [2.4,14.5,0,2.3,1.4,1.5],

  [-2.5,17.5,0,2.2,1.4,1.5],
  [2,20.5,0,2.3,1.4,1.5],

  [-2,23.5,0,2.3,1.4,1.5]
];

for(
  const r of rockList
){
  rock(...r);
}


/* =====================================================
   GREEN GRIPS
===================================================== */

const grips = [];

const gripPositions = [

  [-3,2,1],

  [2.8,4.5,1],

  [-2.5,7,1],

  [2.5,9.5,1],

  [-2,12,1],

  [2.4,14.5,1],

  [-2.5,17.5,1],

  [2,20.5,1],

  [-2,23.5,1]

];


for(
  let i=0;
  i<gripPositions.length;
  i++
){

  const p =
    gripPositions[i];


  /* outer glow */

  const glow =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .48,
        20,
        20
      ),
      new THREE.MeshBasicMaterial({
        color:0x00ff66,
        transparent:true,
        opacity:.18
      })
    );

  glow.position.set(
    p[0],
    p[1],
    p[2]
  );

  scene.add(glow);


  /* actual grip */

  const mesh =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .28,
        20,
        20
      ),
      new THREE.MeshStandardMaterial({
        color:0x00ff66,
        emissive:0x00ff66,
        emissiveIntensity:4
      })
    );

  mesh.position.set(
    p[0],
    p[1],
    p[2]
  );

  scene.add(mesh);


  grips.push({
    mesh:mesh,
    glow:glow,
    position:new THREE.Vector3(
      p[0],
      p[1],
      p[2]
    ),
    grabbed:false
  });
}


/* =====================================================
   HAMMER
===================================================== */

const hammer =
  new THREE.Group();

scene.add(hammer);


/* HANDLE */

const handle =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .08,
      .08,
      2.8,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0x8b5a32
    })
  );

handle.position.y =
  -1.35;

handle.castShadow = true;

hammer.add(handle);


/* HAMMER HEAD */

const hammerHead =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1,
      .3,
      .3
    ),
    new THREE.MeshStandardMaterial({
      color:0x9ba2aa,
      metalness:.8,
      roughness:.3
    })
  );

hammerHead.castShadow = true;

hammer.add(
  hammerHead
);


/* HAMMER TIP */

const hammerTip =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .12,
      12,
      12
    ),
    new THREE.MeshBasicMaterial({
      color:0xffd000
    })
  );

hammerTip.position.y =
  -2.65;

hammer.add(
  hammerTip
);

hammer.position.set(
  2,
  3,
  1
);


/* =====================================================
   MOUSE
===================================================== */

const mouse =
  new THREE.Vector2();

let mouseDown =
  false;

let grabbedGrip =
  null;

const raycaster =
  new THREE.Raycaster();

const plane =
  new THREE.Plane(
    new THREE.Vector3(
      0,0,1
    ),
    0
  );

const mouseWorld =
  new THREE.Vector3();


function mouseMove(
  event
){

  mouse.x =
    event.clientX /
    window.innerWidth *
    2 - 1;

  mouse.y =
    -(event.clientY /
      window.innerHeight) *
    2 + 1;
}


window.addEventListener(
  "pointermove",
  mouseMove
);


window.addEventListener(
  "pointerdown",
  event => {

    if(
      event.button !== 0
    ) return;

    mouseDown = true;

    tryGrab();
  }
);


window.addEventListener(
  "pointerup",
  () => {

    mouseDown = false;

    if(
      grabbedGrip
    ){

      grabbedGrip.grabbed =
        false;

      grabbedGrip.mesh.scale.set(
        1,1,1
      );

      grabbedGrip.glow.scale.set(
        1,1,1
      );

      grabbedGrip = null;

      setStatus(
        "HAMMER: FREE"
      );
    }
  }
);


/* =====================================================
   HAMMER MOVEMENT
===================================================== */

function updateHammer(){

  raycaster.setFromCamera(
    mouse,
    camera
  );

  raycaster.ray.intersectPlane(
    plane,
    mouseWorld
  );

  const playerPos =
    new THREE.Vector3(
      playerBody.position.x,
      playerBody.position.y,
      1
    );

  const direction =
    mouseWorld
      .clone()
      .sub(playerPos);

  direction.z = 0;

  if(
    direction.lengthSq() <
    .001
  ) return;

  direction.normalize();

  const target =
    playerPos.clone().add(
      direction.multiplyScalar(
        3
      )
    );

  hammer.position.lerp(
    target,
    .35
  );

  hammer.lookAt(
    mouseWorld.x,
    mouseWorld.y,
    1
  );

  hammer.rotateX(
    Math.PI/2
  );
}


/* =====================================================
   GRIP DETECTION
===================================================== */

function getHammerTip(){

  const p =
    new THREE.Vector3();

  hammerTip.getWorldPosition(
    p
  );

  return p;
}


function tryGrab(){

  const tip =
    getHammerTip();

  let closest =
    null;

  let distance =
    Infinity;


  for(
    const grip of grips
  ){

    const d =
      tip.distanceTo(
        grip.position
      );

    if(
      d < 1.2 &&
      d < distance
    ){

      closest =
        grip;

      distance =
        d;
    }
  }


  if(
    closest
  ){

    grabbedGrip =
      closest;

    closest.grabbed =
      true;

    closest.mesh.scale.set(
      1.8,
      1.8,
      1.8
    );

    closest.glow.scale.set(
      1.5,
      1.5,
      1.5
    );

    setStatus(
      "HAMMER: GRIP LOCKED"
    );

  }else{

    setStatus(
      "HAMMER: MISSED"
    );
  }
}


/* =====================================================
   CLIMB PHYSICS
===================================================== */

let previousHammer =
  new THREE.Vector3();


function climb(){

  if(
    !mouseDown ||
    !grabbedGrip
  ) return;


  const movement =
    hammer.position
      .clone()
      .sub(previousHammer);


  if(
    movement.lengthSq() >
    .000001
  ){

    const impulse =
      movement
        .clone()
        .multiplyScalar(-9);


    playerBody.applyImpulse(
      new CANNON.Vec3(
        impulse.x,
        impulse.y,
        0
      ),
      playerBody.position
    );
  }


  /* anchor pull */

  const anchor =
    grabbedGrip.position;

  const dx =
    anchor.x -
    playerBody.position.x;

  const dy =
    anchor.y -
    playerBody.position.y;


  const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  if(
    distance > 2
  ){

    const force =
      Math.min(
        distance * 4,
        18
      );

    playerBody.applyForce(
      new CANNON.Vec3(
        dx*force,
        dy*force,
        0
      ),
      playerBody.position
    );
  }


  previousHammer.copy(
    hammer.position
  );
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text
){

  document.getElementById(
    "status"
  ).textContent =
    text;
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  const target =
    new THREE.Vector3(
      playerBody.position.x,
      playerBody.position.y + 1.5,
      18
    );

  camera.position.lerp(
    target,
    .06
  );

  camera.lookAt(
    playerBody.position.x,
    playerBody.position.y + 1,
    0
  );
}


/* =====================================================
   PLAYER SYNC
===================================================== */

function updatePlayer(){

  player.position.set(
    playerBody.position.x,
    playerBody.position.y,
    playerBody.position.z
  );

  player.quaternion.set(
    playerBody.quaternion.x,
    playerBody.quaternion.y,
    playerBody.quaternion.z,
    playerBody.quaternion.w
  );
}


/* =====================================================
   START
===================================================== */

let running =
  false;

document.getElementById(
  "startBtn"
).onclick =
  () => {

    document.getElementById(
      "start"
    ).classList.add(
      "hidden"
    );

    running = true;
  };


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );


  if(
    running
  ){

    updateHammer();

    climb();


    world.step(
      1/60,
      dt,
      3
    );


    updatePlayer();

    updateCamera();


    if(
      playerBody.position.y <
      -10
    ){

      playerBody.position.set(
        0,
        2,
        2
      );

      playerBody.velocity.set(
        0,
        0,
        0
      );

      setStatus(
        "YOU FELL — TRY AGAIN"
      );
    }
  }


  renderer.render(
    scene,
    camera
  );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>

</body>
</html>
