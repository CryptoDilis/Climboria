[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/"]
solc_version = "0.8.19"
evm_version = "london"
optimizer = true
optimizer_runs = 200

# Only local test evidence output, no access to wallet files.
fs_permissions = [{ access = "write", path = "./out" }]
